:root{
 --bg:#f6f4ee;--card:#ffffff;--ink:#1d1b16;--muted:#6b665b;--line:#e4dfd3;--soft:#f0ece2;
 --accent:#2f5bd3;--accent-ink:#fff;--good:#15803d;--good-bg:#e7f6ec;--bad:#b42318;--bad-bg:#fdecea;--warn-bg:#fff6dc;--warn:#8a5a00;
 --q:#7a2e0e;--q-bg:#fbf1e6;--tc:#2f5bd3;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
 --pasuk-size:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#14161a;--card:#1d2026;--ink:#ecebe7;--muted:#a3a19a;--line:#30343c;--soft:#252932;
 --accent:#7aa2ff;--accent-ink:#0b1020;--good:#4ade80;--good-bg:#14301f;--bad:#ff8a80;--bad-bg:#3a1a18;--warn-bg:#3a2f12;--warn:#f5c96a;
 --q:#ffc49b;--q-bg:#2c2219;--shadow:none;}}
:root[data-theme="dark"]{
 --bg:#14161a;--card:#1d2026;--ink:#ecebe7;--muted:#a3a19a;--line:#30343c;--soft:#252932;
 --accent:#7aa2ff;--accent-ink:#0b1020;--good:#4ade80;--good-bg:#14301f;--bad:#ff8a80;--bad-bg:#3a1a18;--warn-bg:#3a2f12;--warn:#f5c96a;
 --q:#ffc49b;--q-bg:#2c2219;--shadow:none;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 80px}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;background:none;border:0;color:var(--ink);padding:4px 0;font-size:1.05rem}
.brand span{font-family:PasukFont,serif}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:.85rem;white-space:nowrap}
.iconbtn{background:var(--soft);border:0;border-radius:10px;padding:6px 10px;color:var(--ink)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
h1{font-size:1.5rem;margin:.4em 0}
h2{font-size:1.2rem;margin:.2em 0 .5em}
h3{font-size:1rem;margin:1em 0 .4em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:12px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.topic-card{border-left:6px solid var(--tc);cursor:pointer}
.topic-card .he-title{font-family:PasukFont,serif;font-size:1.5rem;font-weight:700}
.he,.pq{font-family:PasukFont,"SBL Hebrew","Ezra SIL","Times New Roman",serif;direction:rtl;unicode-bidi:isolate}
.he{font-size:1.15em}
.pq{color:var(--q);font-weight:600;font-size:1.12em;background:var(--q-bg);border-radius:6px;padding:0 .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pq::before,.pq::after{content:none}
.cite{color:var(--muted);font-size:.85em;white-space:nowrap;direction:rtl;unicode-bidi:isolate}
.rtl{direction:rtl;text-align:right}
.rtl .pq{font-size:1.08em}
.pasuk-box{background:var(--q-bg);border-radius:14px;padding:14px 16px;margin:8px 0 4px}
.pasuk{font-family:PasukFont,"SBL Hebrew","Ezra SIL","Times New Roman",serif;font-size:var(--pasuk-size);line-height:2;direction:rtl;text-align:right;margin:0 0 6px}
.pasuk .vn{display:inline-block;min-width:1.6em;font-size:.55em;font-weight:700;color:var(--accent);vertical-align:middle;margin-left:.3em;font-family:system-ui,sans-serif}
.ref-title{font-family:PasukFont,serif;font-weight:700;font-size:1.1rem;direction:rtl}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.word{background:var(--soft);border-radius:10px;padding:8px 10px}
.word .he{display:block;font-size:1.3rem;text-align:right;color:var(--q);font-weight:600}
.sec{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.sec b.lbl{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.tip{background:var(--warn-bg);border-radius:12px;padding:10px 12px;margin-top:10px}
.tip b.lbl{color:var(--warn);display:block;margin-bottom:2px}
.note{display:block;background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .k{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:6px;background:var(--soft);font-size:.8rem;margin-right:8px;font-weight:700}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h4{margin:0 0 4px}
input.txt,textarea{width:100%;font:inherit;font-family:PasukFont,"Times New Roman",serif;font-size:1.25rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);direction:rtl}
textarea{min-height:150px;font-size:1.1rem;line-height:1.7}
.blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--accent);margin:0 .2em}
.order-pool button,.order-ans button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.order-ans{border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:60px;margin:8px 0}
.order-ans button{border-color:var(--accent)}
.order-ans .n{font-weight:700;margin-right:6px;color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
table.cmp{border-collapse:collapse;width:100%;font-size:.95rem}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
table.cmp th{background:var(--soft);font-size:.85rem}
table.cmp.wide{min-width:820px}
.check-list label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.check-list input{width:20px;height:20px;margin-top:2px;flex:none}
.model .pq{background:transparent}
.model{background:var(--good-bg);border-radius:12px;padding:12px 14px;line-height:1.9}
.model hr{border:0;border-top:1px solid var(--line)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.lvl{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.qtext{font-size:1.1rem;font-weight:600;margin:4px 0 8px}
.qtext.rtl{font-size:1.3rem;font-family:PasukFont,serif;line-height:1.8}
.hintbox{background:var(--warn-bg);border-radius:10px;padding:8px 12px;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.formula li{margin:6px 0}
.ex-step{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ex-step .rtl{line-height:1.9}
.choose label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.choose label.on{border-color:var(--accent);background:var(--soft)}
.choose input{width:20px;height:20px;flex:none;margin-top:4px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.celebrate{text-align:center;padding:24px 12px}
.celebrate .big{font-size:3rem}
.lock{opacity:.7}
.cheat li{margin:6px 0}
.must .pasuk{font-size:calc(var(--pasuk-size)*.8)}
@media (max-width:560px){:root{--pasuk-size:1.5rem}.ex-step{grid-template-columns:1fr}.card{padding:14px}h1{font-size:1.3rem}}

<script>
const DATA={"topics":[{"id":"lech","name":"לך לך","full":"לך לך + מצרים","ref":"בראשית יב, א–כ","color":"#d97706","icon":"🐪","intro":"ה' tells אברם to leave everything and go to a land He will show him. ה' gives him 4 promises. Then a famine sends אברם down to Egypt, where he says שרי is his sister.","cards":[{"v":["G12:1"],"words":[{"he":"לֶךְ־לְךָ","cons":"לך לך","en":"go (leave) for yourself","ref":"G12:1"},{"he":"מֵאַרְצְךָ","cons":"מארצך","en":"from your land","ref":"G12:1"},{"he":"וּמִמּוֹלַדְתְּךָ","cons":"וממולדתך","en":"from your birthplace (where your family comes from)","ref":"G12:1"},{"he":"וּמִבֵּית אָבִיךָ","cons":"ומבית אביך","en":"from your father's house","ref":"G12:1"},{"he":"אֲשֶׁר אַרְאֶךָּ","cons":"אשר אראך","en":"that I will show you (he is NOT told where!)","ref":"G12:1"}],"says":"ה' tells אברם to leave <b>three</b> things: his land, his birthplace, and his father's house. He must go \"to the land that I will show you\". ה' doesn't say which land.","teach":"This is אברם's first test (ניסיון). <b>The difficulty (הקושי):</b> he must leave everything he knows: country, family, home. And he doesn't even know where he's going: <q class=\"pq\">אֲשֶׁר אַרְאֶךָּ</q>. The list goes from the biggest circle to the closest one: land → birthplace → father's house.","tip":"Answers <b>הקושי של אברהם</b> and <b>הניסיונות שלו</b>. Quote: <q class=\"pq\">לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ</q> <span class=\"cite\">(בראשית יב, א)</span>."},{"v":["G12:2","G12:3"],"words":[{"he":"וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל","cons":"ואעשך לגוי גדול","en":"I will make you into a great nation","ref":"G12:2"},{"he":"וַאֲבָרֶכְךָ","cons":"ואברכך","en":"I will bless you","ref":"G12:2"},{"he":"וַאֲגַדְּלָה שְׁמֶךָ","cons":"ואגדלה שמך","en":"I will make your name great (famous)","ref":"G12:2"},{"he":"וֶהְיֵה בְּרָכָה","cons":"והיה ברכה","en":"you will be a blessing","ref":"G12:2"},{"he":"וַאֲבָרְכָה מְבָרְכֶיךָ","cons":"ואברכה מברכיך","en":"I will bless those who bless you","ref":"G12:3"},{"he":"וּמְקַלֶּלְךָ אָאֹר","cons":"ומקללך אאר","en":"whoever curses you, I will curse","ref":"G12:3"},{"he":"וְנִבְרְכוּ בְךָ","cons":"ונברכו בך","en":"will be blessed through you","ref":"G12:3"},{"he":"כֹּל מִשְׁפְּחֹת הָאֲדָמָה","cons":"כל משפחת האדמה","en":"all the families of the earth","ref":"G12:3"}],"says":"ה' promises אברם: <b>1.</b> I'll make you a great nation. <b>2.</b> I'll bless you. <b>3.</b> I'll make your name great. <b>4.</b> You'll be a blessing: all the families of the earth will be blessed through you. ה' will also bless whoever blesses אברם and curse whoever curses him.","teach":"<b>Why exactly these promises?</b> Put pasuk א next to pasuk ב. Every promise makes up for something אברם gives up:<br>• He leaves his <b>land</b> → he is promised a land (pasuk ז).<br>• He leaves his <b>birthplace and family</b> → he will become a whole new family: <q class=\"pq\">לְגוֹי גָּדוֹל</q>.<br>• He leaves his <b>father's house</b> (its name and wealth) → <q class=\"pq\">וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ</q>.<br>• He leaves one family behind → in the end <q class=\"pq\">כֹּל מִשְׁפְּחֹת הָאֲדָמָה</q> will be blessed through him.","tip":"Answers <b>ההבטחות + למה דווקא ההבטחות האלה</b>. Know all 4 by heart: <q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה</q> <span class=\"cite\">(בראשית יב, ב)</span> + <q class=\"pq\">וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה</q> <span class=\"cite\">(בראשית יב, ג)</span>."},{"check":{"t":"mc","q":"In pasuk א, how many things does ה' tell אברם to leave?","o":["3: his land, his birthplace, his father's house","1: his land","2: his land and his wife","4: his land, birthplace, father's house and nephew"],"why":"Pasuk א lists three things: מארצך, וממולדתך, ומבית אביך. He takes his wife and nephew <b>with</b> him.","proof":"<q class=\"pq\">מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ</q> <span class=\"cite\">(בראשית יב, א)</span>","hint":"Count the words in pasuk א that start with \"from\" (מ / ומ).","alt":{"t":"mc","q":"Which of these is NOT one of the things ה' tells אברם to leave?","o":["his wife (אשתו)","his land (ארצו)","his birthplace (מולדתו)","his father's house (בית אביו)"],"why":"ה' tells him to leave his land, birthplace and father's house. Sarai his wife comes <b>with</b> him (pasuk ה).","proof":"<q class=\"pq\">מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ</q> <span class=\"cite\">(בראשית יב, א)</span>"}}},{"check":{"t":"mc","q":"What does <span class=\"he\">וַאֲגַדְּלָה שְׁמֶךָ</span> mean?","o":["I will make your name great (famous)","I will make you into a great nation","I will give you a land","I will make you very rich"],"why":"שם = name, אגדלה = I will make great. \"A great nation\" is a different promise: ואעשך לגוי גדול.","proof":"<q class=\"pq\">וַאֲגַדְּלָה שְׁמֶךָ</q> <span class=\"cite\">(בראשית יב, ב)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל</span> mean?","o":["I will make you into a great nation","I will make your name great","I will bless those who bless you","I will show you the land"],"why":"גוי = nation, גדול = great. This promise makes up for leaving his family (מולדת).","proof":"<q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל</q> <span class=\"cite\">(בראשית יב, ב)</span>"}}},{"v":["G12:4"],"words":[{"he":"וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'","cons":"וילך אברם כאשר דבר אליו ה'","en":"אברם went, just as ה' had told him","ref":"G12:4"},{"he":"וַיֵּלֶךְ אִתּוֹ לוֹט","cons":"וילך אתו לוט","en":"and לוט went with him","ref":"G12:4"},{"he":"בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה","cons":"בן חמש שנים ושבעים שנה","en":"75 years old","ref":"G12:4"},{"he":"בְּצֵאתוֹ מֵחָרָן","cons":"בצאתו מחרן","en":"when he left חרן","ref":"G12:4"}],"says":"אברם does exactly what ה' told him. לוט goes with him. אברם is 75 years old when he leaves חרן.","teach":"אברם <b>passes the test</b>. He doesn't ask or argue, he just goes: <q class=\"pq\">כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q>. His age makes it even harder: he starts a whole new life at 75.","tip":"For <b>הניסיונות</b> (he passed the first one) and <b>הקושי</b> (his age): <q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q> <span class=\"cite\">(בראשית יב, ד)</span> and <q class=\"pq\">וְאַבְרָם בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה</q> <span class=\"cite\">(בראשית יב, ד)</span>."},{"v":["G12:5"],"words":[{"he":"וַיִּקַּח","cons":"ויקח","en":"he took","ref":"G12:5"},{"he":"אֶת־שָׂרַי אִשְׁתּוֹ","cons":"את שרי אשתו","en":"Sarai his wife","ref":"G12:5"},{"he":"וְאֶת־לוֹט בֶּן־אָחִיו","cons":"ואת לוט בן אחיו","en":"לוט, his brother's son (his nephew)","ref":"G12:5"},{"he":"רְכוּשָׁם אֲשֶׁר רָכָשׁוּ","cons":"רכושם אשר רכשו","en":"the property they had gathered","ref":"G12:5"},{"he":"וְאֶת־הַנֶּפֶשׁ אֲשֶׁר־עָשׂוּ בְחָרָן","cons":"ואת הנפש אשר עשו בחרן","en":"the people they had acquired in חרן (the people of their household)","ref":"G12:5"},{"he":"אַרְצָה כְּנַעַן","cons":"ארצה כנען","en":"to the land of כנען","ref":"G12:5"}],"says":"אברם takes Sarai his wife, לוט his nephew, all their property and the people of their household from חרן. They set out for כנען, and they arrive.","teach":"This pasuk answers <b>who he took</b>: 1. שרי his wife 2. לוט his nephew 3. all their property (רכוש) 4. the people they had in חרן. The land ה' \"will show\" him turns out to be כנען.","tip":"<b>את מי הוא לקח</b>: <q class=\"pq\">וַיִּקַּח אַבְרָם אֶת־שָׂרַי אִשְׁתּוֹ וְאֶת־לוֹט בֶּן־אָחִיו וְאֶת־כׇּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ וְאֶת־הַנֶּפֶשׁ אֲשֶׁר־עָשׂוּ בְחָרָן</q> <span class=\"cite\">(בראשית יב, ה)</span>."},{"v":["G12:6","G12:7"],"words":[{"he":"וַיַּעֲבֹר","cons":"ויעבר","en":"he passed through","ref":"G12:6"},{"he":"עַד מְקוֹם שְׁכֶם","cons":"עד מקום שכם","en":"up to the place שכם","ref":"G12:6"},{"he":"אֵלוֹן מוֹרֶה","cons":"אלון מורה","en":"the oak tree of מורה","ref":"G12:6"},{"he":"וְהַכְּנַעֲנִי אָז בָּאָרֶץ","cons":"והכנעני אז בארץ","en":"the Canaanites were living in the land then","ref":"G12:6"},{"he":"וַיֵּרָא ה'","cons":"וירא ה'","en":"ה' appeared","ref":"G12:7"},{"he":"לְזַרְעֲךָ","cons":"לזרעך","en":"to your descendants (\"seed\")","ref":"G12:7"},{"he":"אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת","cons":"אתן את הארץ הזאת","en":"I will give this land","ref":"G12:7"},{"he":"וַיִּבֶן שָׁם מִזְבֵּחַ","cons":"ויבן שם מזבח","en":"he built an altar there","ref":"G12:7"},{"he":"הַנִּרְאֶה אֵלָיו","cons":"הנראה אליו","en":"who had appeared to him","ref":"G12:7"}],"says":"אברם travels through the land as far as שכם. The Canaanites live there. ה' appears to him and promises: \"To your descendants I will give this land.\" אברם builds an altar to ה'.","teach":"Now comes the promise of <b>the land</b>. It isn't to אברם himself but <q class=\"pq\">לְזַרְעֲךָ</q>, his children, even though he has no children yet and the land is full of Canaanites (<q class=\"pq\">וְהַכְּנַעֲנִי אָז בָּאָרֶץ</q>). אברם answers by building a מזבח to ה'.","tip":"<b>ההבטחות</b>: the promise of the land is <q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית יב, ז)</span>."},{"check":{"t":"mc","q":"Who is <b>לוט</b> to אברם?","o":["his nephew (בן אחיו)","his brother (אחיו)","his son (בנו)","his servant (עבדו)"],"why":"The pasuk calls לוט <q class=\"pq\">בֶּן־אָחִיו</q>, the son of his brother, so his nephew.","proof":"<q class=\"pq\">וְאֶת־לוֹט בֶּן־אָחִיו</q> <span class=\"cite\">(בראשית יב, ה)</span>","alt":{"t":"mc","q":"How old was אברם when he left חרן?","o":["75","99","100","70"],"why":"<q class=\"pq\">בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה</q> = 5 + 70 = 75. (99 is his age at ברית מילה.)","proof":"<q class=\"pq\">וְאַבְרָם בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה בְּצֵאתוֹ מֵחָרָן</q> <span class=\"cite\">(בראשית יב, ד)</span>"}}},{"check":{"t":"mc","q":"In pasuk ז, to whom does ה' promise to give the land?","o":["to אברם's descendants (לזרעך)","to אברם himself (לך)","to לוט","to the Canaanites"],"why":"The pasuk says <q class=\"pq\">לְזַרְעֲךָ</q>, to your descendants, not \"to you\".","proof":"<q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית יב, ז)</span>","alt":{"t":"mc","q":"What did אברם do right after ה' promised him the land in pasuk ז?","o":["He built an altar (מזבח) to ה'","He went down to Egypt","He laughed","He asked for a sign"],"why":"<q class=\"pq\">וַיִּבֶן שָׁם מִזְבֵּחַ לַה'</q>. He thanks ה' by building an altar.","proof":"<q class=\"pq\">וַיִּבֶן שָׁם מִזְבֵּחַ לַה' הַנִּרְאֶה אֵלָיו</q> <span class=\"cite\">(בראשית יב, ז)</span>"}}},{"v":["G12:8","G12:9"],"words":[{"he":"וַיַּעְתֵּק מִשָּׁם הָהָרָה","cons":"ויעתק משם ההרה","en":"he moved from there to the mountain","ref":"G12:8"},{"he":"וַיֵּט אׇהֳלֹה","cons":"ויט אהלה","en":"he pitched his tent","ref":"G12:8"},{"he":"וַיִּקְרָא בְּשֵׁם ה'","cons":"ויקרא בשם ה'","en":"he called out in the name of ה' (prayed and worshipped)","ref":"G12:8"},{"he":"הָלוֹךְ וְנָסוֹעַ","cons":"הלוך ונסוע","en":"traveling on and on","ref":"G12:9"},{"he":"הַנֶּגְבָּה","cons":"הנגבה","en":"toward the south (the Negev)","ref":"G12:9"}],"says":"אברם moves to the mountain between בית אל and העי, pitches his tent, builds another altar and calls out in the name of ה'. Then he keeps traveling south.","teach":"Everywhere אברם goes in the new land, he builds an altar and calls in ה''s name. He keeps moving and doesn't have a fixed home yet.","tip":"Background pasuk. Remember: two altars, at שכם (pasuk ז) and between בית אל and העי (pasuk ח)."},{"v":["G12:10"],"words":[{"he":"רָעָב","cons":"רעב","en":"famine (hunger)","ref":"G12:10"},{"he":"וַיֵּרֶד אַבְרָם מִצְרַיְמָה","cons":"וירד אברם מצרימה","en":"אברם went down to Egypt","ref":"G12:10"},{"he":"לָגוּר שָׁם","cons":"לגור שם","en":"to live there for a while, as a stranger","ref":"G12:10"},{"he":"כִּי־כָבֵד הָרָעָב בָּאָרֶץ","cons":"כי כבד הרעב בארץ","en":"because the famine was heavy (severe) in the land","ref":"G12:10"}],"says":"There is a famine in the land. אברם goes down to Egypt to stay there for a while, because the famine is very bad.","teach":"<b>Another test:</b> ה' just promised him this land, and right away there's a famine, so he has to leave it. <q class=\"pq\">לָגוּר שָׁם</q> means only for a while. He doesn't plan to stay in Egypt.<br><span class=\"note\">My teacher quoted the saying <b>\"כל מה שאירע לאבות סימן לבנים\"</b> (a saying, <u>not</u> a pasuk): אברם goes down to Egypt because of famine, and later בני ישראל also go down to Egypt.</span>","tip":"<b>הניסיונות</b> + <b>why he went to Egypt</b>: <q class=\"pq\">וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם כִּי־כָבֵד הָרָעָב בָּאָרֶץ</q> <span class=\"cite\">(בראשית יב, י)</span>."},{"check":{"t":"mc","q":"Why did אברם go down to Egypt?","o":["Because of a severe famine in the land","Because ה' told him to","Because Pharaoh invited him","To run away from the Canaanites"],"why":"Pasuk י gives the reason: <q class=\"pq\">כִּי־כָבֵד הָרָעָב בָּאָרֶץ</q>. ה' did not tell him to go.","proof":"<q class=\"pq\">וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה</q> <span class=\"cite\">(בראשית יב, י)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">לָגוּר שָׁם</span> mean?","o":["to live there for a while (as a stranger)","to be afraid there","to settle there forever","to buy food there"],"why":"לגור = to stay as a stranger, for a while. אברם planned to return.","proof":"<q class=\"pq\">וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם</q> <span class=\"cite\">(בראשית יב, י)</span>"}}},{"v":["G12:11"],"words":[{"he":"כַּאֲשֶׁר הִקְרִיב לָבוֹא מִצְרָיְמָה","cons":"כאשר הקריב לבוא מצרימה","en":"when he came close to entering Egypt","ref":"G12:11"},{"he":"הִנֵּה־נָא יָדַעְתִּי","cons":"הנה נא ידעתי","en":"look, I know","ref":"G12:11"},{"he":"יְפַת־מַרְאֶה","cons":"יפת מראה","en":"beautiful-looking","ref":"G12:11"},{"he":"אָתְּ","cons":"את","en":"you (said to a woman)","ref":"G12:11"}],"says":"As they get close to Egypt, אברם says to שרי: \"I know that you are a beautiful woman.\"","teach":"The Egypt story starts with אברם's <b>fear</b>. It comes from שרי's beauty.","tip":"Step 1 of \"the story in Egypt\": <q class=\"pq\">כִּי אִשָּׁה יְפַת־מַרְאֶה אָתְּ</q> <span class=\"cite\">(בראשית יב, יא)</span>."},{"v":["G12:12","G12:13"],"words":[{"he":"וְהָרְגוּ אֹתִי","cons":"והרגו אתי","en":"they will kill me","ref":"G12:12"},{"he":"וְאֹתָךְ יְחַיּוּ","cons":"ואתך יחיו","en":"but you they will let live","ref":"G12:12"},{"he":"אִמְרִי־נָא","cons":"אמרי נא","en":"please say","ref":"G12:13"},{"he":"אֲחֹתִי אָתְּ","cons":"אחתי את","en":"you are my sister","ref":"G12:13"},{"he":"לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ","cons":"למען ייטב לי בעבורך","en":"so that it will go well for me because of you","ref":"G12:13"},{"he":"וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ","cons":"וחיתה נפשי בגללך","en":"and my life will be saved because of you","ref":"G12:13"}],"says":"אברם explains: \"When the Egyptians see you and say 'she's his wife', they'll kill me and let you live. So please say you're my sister. Then they'll treat me well because of you, and I'll stay alive.\"","teach":"<b>Why did אברם say שרי is his sister?</b> The text gives the reasons: he was afraid they would <b>kill him</b> because of her beauty (<q class=\"pq\">וְהָרְגוּ אֹתִי</q>), and he wanted to stay alive (<q class=\"pq\">וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ</q>). A husband would be in danger. A \"brother\" would even be treated well (<q class=\"pq\">יִיטַב־לִי</q>).","tip":"Big test question: <b>למה אברהם אמר ששרה אחותו</b>. Quote: <q class=\"pq\">וְאָמְרוּ אִשְׁתּוֹ זֹאת וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q> <span class=\"cite\">(בראשית יב, יב)</span> + <q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q> <span class=\"cite\">(בראשית יב, יג)</span>."},{"check":{"t":"mc","q":"Why did אברם ask שרי to say she was his sister?","o":["He was afraid the Egyptians would kill him because of her beauty","ה' told him to say it","Pharaoh asked him who she was","He wanted to give her to Pharaoh"],"why":"Pasuk יב: <q class=\"pq\">וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q>. He was afraid for his life.","proof":"<q class=\"pq\">וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q> <span class=\"cite\">(בראשית יב, יב)</span>","hint":"Look for the word \"kill\" (הרג) in pasuk יב.","alt":{"t":"mc","q":"Which words show what אברם hoped to GAIN by saying \"she is my sister\"?","o":["<span class=\"he\">לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ</span>","<span class=\"he\">וְאֹתָךְ יְחַיּוּ</span>","<span class=\"he\">יְפַת־מַרְאֶה אָתְּ</span>","<span class=\"he\">לָגוּר שָׁם</span>"],"why":"<q class=\"pq\">לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ</q> = \"so it will go well for me because of you\", plus <q class=\"pq\">וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ</q>.","proof":"<q class=\"pq\">לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ</q> <span class=\"cite\">(בראשית יב, יג)</span>"}}},{"v":["G12:14","G12:15"],"words":[{"he":"כִּי־יָפָה הִוא מְאֹד","cons":"כי יפה הוא מאד","en":"that she was very beautiful","ref":"G12:14"},{"he":"שָׂרֵי פַרְעֹה","cons":"שרי פרעה","en":"Pharaoh's officers (from שר = officer). NOT Sarai!","ref":"G12:15"},{"he":"וַיְהַלְלוּ אֹתָהּ","cons":"ויהללו אתה","en":"they praised her","ref":"G12:15"},{"he":"וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה","cons":"ותקח האשה בית פרעה","en":"the woman was taken into Pharaoh's house","ref":"G12:15"}],"says":"What אברם feared happens: the Egyptians see she is very beautiful, Pharaoh's officers praise her to Pharaoh, and she is taken into Pharaoh's palace.","teach":"<b>Trap word:</b> <q class=\"pq\">שָׂרֵי פַרְעֹה</q> = Pharaoh's officers, not Sarai. Notice the pasuk calls her <q class=\"pq\">הָאִשָּׁה</q>, \"the woman\", not \"the sister\". The third test: his wife is taken away.","tip":"<b>מה קרה במצרים</b>: <q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q> <span class=\"cite\">(בראשית יב, טו)</span>."},{"v":["G12:16"],"words":[{"he":"וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ","cons":"ולאברם היטיב בעבורה","en":"he (Pharaoh) treated אברם well because of her","ref":"G12:16"},{"he":"צֹאן־וּבָקָר","cons":"צאן ובקר","en":"sheep and cattle","ref":"G12:16"},{"he":"וַחֲמֹרִים","cons":"וחמרים","en":"and donkeys","ref":"G12:16"},{"he":"וַעֲבָדִים וּשְׁפָחֹת","cons":"ועבדים ושפחת","en":"male and female servants","ref":"G12:16"},{"he":"וַאֲתֹנֹת","cons":"ואתנת","en":"and female donkeys","ref":"G12:16"},{"he":"וּגְמַלִּים","cons":"וגמלים","en":"and camels","ref":"G12:16"}],"says":"Because of שרי, Pharaoh treats אברם well. אברם gets sheep, cattle, donkeys, servants and camels.","teach":"Part of אברם's plan comes true, in almost the same words:<br>pasuk יג: <q class=\"pq\">לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ</q><br>pasuk טז: <q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q>","tip":"If asked \"what happened in Egypt\": he got rich because of her. Quote <q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q> <span class=\"cite\">(בראשית יב, טז)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">שָׂרֵי פַרְעֹה</span> (pasuk טו) mean?","o":["Pharaoh's officers","Pharaoh's wife Sarai","Pharaoh's daughters","Pharaoh's servants who were afraid"],"why":"<q class=\"pq\">שָׂרֵי</q> (with a tzere) = officers, from the word שר. Sarai is <q class=\"pq\">שָׂרַי</q> (with a patach under the ר).","proof":"<q class=\"pq\">וַיִּרְאוּ אֹתָהּ שָׂרֵי פַרְעֹה וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה</q> <span class=\"cite\">(בראשית יב, טו)</span>","alt":{"t":"mc","q":"What did אברם receive in Egypt because of שרי?","o":["sheep, cattle, donkeys, servants and camels","a palace and gold","land in Egypt","nothing, they wanted to kill him"],"why":"Pasuk טז lists <q class=\"pq\">צֹאן־וּבָקָר וַחֲמֹרִים וַעֲבָדִים וּשְׁפָחֹת וַאֲתֹנֹת וּגְמַלִּים</q>.","proof":"<q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q> <span class=\"cite\">(בראשית יב, טז)</span>"}}},{"v":["G12:17"],"words":[{"he":"וַיְנַגַּע ה'","cons":"וינגע ה'","en":"ה' struck (with afflictions)","ref":"G12:17"},{"he":"נְגָעִים גְּדֹלִים","cons":"נגעים גדלים","en":"great plagues / afflictions","ref":"G12:17"},{"he":"וְאֶת־בֵּיתוֹ","cons":"ואת ביתו","en":"and his household","ref":"G12:17"},{"he":"עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָם","cons":"על דבר שרי אשת אברם","en":"because of Sarai, אברם's wife","ref":"G12:17"}],"says":"ה' strikes Pharaoh and his household with great plagues (נגעים) because of Sarai.","teach":"ה' protects שרי and אברם. The pasuk tells the truth about her: <q class=\"pq\">אֵשֶׁת אַבְרָם</q>, \"אברם's wife\". <b>How they got out</b> starts here, with the נגעים.","tip":"<b>איך הם יצאו</b> (part 1): <q class=\"pq\">וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָם</q> <span class=\"cite\">(בראשית יב, יז)</span>."},{"v":["G12:18","G12:19"],"words":[{"he":"מַה־זֹּאת עָשִׂיתָ לִּי","cons":"מה זאת עשית לי","en":"what is this you have done to me?","ref":"G12:18"},{"he":"לָמָּה לֹא־הִגַּדְתָּ לִּי","cons":"למה לא הגדת לי","en":"why didn't you tell me?","ref":"G12:18"},{"he":"כִּי אִשְׁתְּךָ הִוא","cons":"כי אשתך הוא","en":"that she is your wife","ref":"G12:18"},{"he":"לָמָה אָמַרְתָּ אֲחֹתִי הִוא","cons":"למה אמרת אחתי הוא","en":"why did you say \"she is my sister\"?","ref":"G12:19"},{"he":"וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה","cons":"ואקח אתה לי לאשה","en":"so I took her to be my wife","ref":"G12:19"},{"he":"קַח וָלֵךְ","cons":"קח ולך","en":"take (her) and go","ref":"G12:19"}],"says":"Pharaoh calls אברם and complains: \"What have you done to me? Why didn't you tell me she's your wife? Why did you say she's your sister, so that I took her as my wife? Here's your wife. Take her and go!\"","teach":"Pharaoh understands the plagues are because of Sarai. He gives her back and tells אברם to leave.","tip":"<b>איך הם יצאו</b> (part 2): <q class=\"pq\">וְעַתָּה הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ</q> <span class=\"cite\">(בראשית יב, יט)</span>. \"Who said it?\": <b>פרעה</b> said <q class=\"pq\">מַה־זֹּאת עָשִׂיתָ לִּי</q>."},{"v":["G12:20"],"words":[{"he":"וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים","cons":"ויצו עליו פרעה אנשים","en":"Pharaoh gave orders to men about him","ref":"G12:20"},{"he":"וַיְשַׁלְּחוּ אֹתוֹ","cons":"וישלחו אתו","en":"and they sent him away (escorted him out)","ref":"G12:20"},{"he":"וְאֶת־כׇּל־אֲשֶׁר־לוֹ","cons":"ואת כל אשר לו","en":"and everything that was his","ref":"G12:20"}],"says":"Pharaoh orders his men to escort אברם out of Egypt, with his wife and everything he owns.","teach":"<b>How they got out of Egypt:</b> 1. ה' sent נגעים. 2. Pharaoh found out the truth. 3. He gave שרי back. 4. He sent them out safely, with all their property.","tip":"<b>איך הם יצאו</b> (part 3): <q class=\"pq\">וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כׇּל־אֲשֶׁר־לוֹ</q> <span class=\"cite\">(בראשית יב, כ)</span>."},{"check":{"t":"order","q":"Put the Egypt story in order:","items":["Famine. אברם goes down to Egypt","אברם asks שרי to say \"I'm your sister\"","שרי is taken to Pharaoh's house","ה' strikes Pharaoh with נגעים","Pharaoh gives her back and sends them out"],"why":"רעב (י) → \"אמרי נא אחתי את\" (יג) → ותקח האשה (טו) → וינגע ה' (יז) → קח ולך / וישלחו אתו (יט–כ)."}},{"type":"compare","title":"What אברם gives up ↔ what he is promised","cols":["What he leaves (פס' א)","What he is promised"],"rows":[["<q class=\"pq\">מֵאַרְצְךָ</q> (his land)","a land: <q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> (ז)"],["<q class=\"pq\">וּמִמּוֹלַדְתְּךָ</q> (his birthplace/family)","a new big family: <q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל</q>"],["<q class=\"pq\">וּמִבֵּית אָבִיךָ</q> (his father's house, name, wealth)","<q class=\"pq\">וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ</q>"],["one family he leaves behind","<q class=\"pq\">וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה</q>"]],"note":"Use this table to answer <b>\"למה דווקא ההבטחות האלה?\"</b> Each promise makes up for exactly what he gave up."},{"type":"compare","title":"אברם's tests (ניסיונות) in פרק יב","cols":["Test","Pasuk","What he did"],"rows":[["Leave land, birthplace, father's house, to an unknown place","<q class=\"pq\">לֶךְ־לְךָ</q> (א)","Went right away: <q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q>"],["Famine in the promised land","<q class=\"pq\">וַיְהִי רָעָב בָּאָרֶץ</q> (י)","Went down to Egypt <q class=\"pq\">לָגוּר שָׁם</q> (only for a while)"],["Fear for his life / his wife is taken","<q class=\"pq\">וְהָרְגוּ אֹתִי</q>, <q class=\"pq\">וַתֻּקַּח הָאִשָּׁה</q> (יב–טו)","Said \"she is my sister\". ה' saved them with נגעים"]]},{"type":"compare","title":"The story in Egypt, step by step","cols":["Step","Pasuk"],"rows":[["1. Why they went: famine","<q class=\"pq\">כִּי־כָבֵד הָרָעָב בָּאָרֶץ</q> (י)"],["2. אברם's fear","<q class=\"pq\">וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q> (יב)"],["3. The plan: \"say you're my sister\"","<q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q> (יג)"],["4. Sarai is taken; אברם gets rich","<q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q> (טו), <q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q> (טז)"],["5. ה' sends נגעים","<q class=\"pq\">וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים</q> (יז)"],["6. Pharaoh complains and sends them out","<q class=\"pq\">קַח וָלֵךְ</q> (יט), <q class=\"pq\">וַיְשַׁלְּחוּ אֹתוֹ</q> (כ)"]]}],"cheat":{"facts":["ה' tells אברם: leave <b>ארצך, מולדתך, בית אביך</b>, go to <q class=\"pq\">הָאָרֶץ אֲשֶׁר אַרְאֶךָּ</q> (unknown place).","4 promises (ב–ג): גוי גדול, ברכה, שם גדול, a blessing for כל משפחות האדמה. Each one makes up for something he left.","He obeys right away, at age 75: <q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q>.","Took: שרי his wife, לוט his nephew, all property, the people from חרן (ה).","In כנען: <q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> and he builds altars (ז, ח).","Famine → Egypt (י). Fear: <q class=\"pq\">וְהָרְגוּ אֹתִי</q> → <q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q>.","Sarai taken to Pharaoh → אברם gets rich → ה' sends נגעים → Pharaoh: <q class=\"pq\">קַח וָלֵךְ</q> → sent out with everything.","Teacher's saying (not a pasuk): \"כל מה שאירע לאבות סימן לבנים\": אברם went down to Egypt, and later so did בני ישראל."],"must":["G12:1","G12:2","G12:10","G12:12","G12:13","G12:17","G12:20"]},"quiz":[{"lv":1,"t":"mc","q":"What does <span class=\"he\">וּמִמּוֹלַדְתְּךָ</span> mean?","o":["your birthplace (where your family is from)","your children","your father","your property"],"why":"מולדת comes from ל-ד (to be born): the place you were born.","proof":"<q class=\"pq\">וּמִמּוֹלַדְתְּךָ</q> <span class=\"cite\">(בראשית יב, א)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">אֲשֶׁר אַרְאֶךָּ</span> mean?","o":["that I will show you","that I gave you","that you saw","that your father showed you"],"why":"From ר-א-ה (to see): \"I will show you\". אברם doesn't know the place yet.","proof":"<q class=\"pq\">אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ</q> <span class=\"cite\">(בראשית יב, א)</span>"}},{"lv":1,"t":"mc","q":"Which of these is NOT one of ה''s promises in פסוקים ב–ג?","o":["I will give you a son named יצחק","I will make you a great nation","I will make your name great","All the families of the earth will be blessed through you"],"why":"The promise of a son named יצחק is in בראשית יז, not in פרק יב.","proof":"<q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה</q> <span class=\"cite\">(בראשית יב, ב)</span>","alt":{"t":"mc","q":"Which promise is in פרק יב?","o":["<span class=\"he\">וַאֲבָרֶכְךָ</span>: I will bless you","Your children will be slaves for 400 years","Your name will be אברהם","Count the stars, so will your children be"],"why":"Only \"ואברכך\" is from פרק יב. The others are from פרקים טו and יז.","proof":"<q class=\"pq\">וַאֲבָרֶכְךָ</q> <span class=\"cite\">(בראשית יב, ב)</span>"}},{"lv":1,"t":"mc","q":"Who went with אברם from חרן?","o":["שרי his wife and לוט his nephew","יצחק and ישמעאל","אליעזר and לוט","his father and his brothers"],"why":"Pasuk ה: <q class=\"pq\">וַיִּקַּח אַבְרָם אֶת־שָׂרַי אִשְׁתּוֹ וְאֶת־לוֹט בֶּן־אָחִיו</q>.","proof":"<q class=\"pq\">וַיִּקַּח אַבְרָם אֶת־שָׂרַי אִשְׁתּוֹ וְאֶת־לוֹט בֶּן־אָחִיו</q> <span class=\"cite\">(בראשית יב, ה)</span>","alt":{"t":"mc","q":"Where did אברם leave from?","o":["חרן","מצרים","שכם","נינוה"],"why":"<q class=\"pq\">בְּצֵאתוֹ מֵחָרָן</q>: when he left חרן.","proof":"<q class=\"pq\">בְּצֵאתוֹ מֵחָרָן</q> <span class=\"cite\">(בראשית יב, ד)</span>"}},{"lv":1,"t":"mc","q":"What did ה' send on Pharaoh and his household?","o":["great plagues (נגעים גדלים)","a famine","a storm","a worm"],"why":"<q class=\"pq\">וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים</q>.","proof":"<q class=\"pq\">וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ</q> <span class=\"cite\">(בראשית יב, יז)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">נְגָעִים</span> mean?","o":["plagues / afflictions","gifts","soldiers","dreams"],"why":"נגעים = plagues, afflictions. ה' \"touched\" (struck) Pharaoh with them.","proof":"<q class=\"pq\">נְגָעִים גְּדֹלִים</q> <span class=\"cite\">(בראשית יב, יז)</span>"}},{"lv":1,"t":"mc","q":"Who said <span class=\"he\">מַה־זֹּאת עָשִׂיתָ לִּי</span>?","o":["Pharaoh, to אברם","אברם, to Pharaoh","שרי, to אברם","ה', to אברם"],"why":"Pasuk יח: <q class=\"pq\">וַיִּקְרָא פַרְעֹה לְאַבְרָם וַיֹּאמֶר מַה־זֹּאת עָשִׂיתָ לִּי</q>.","proof":"<q class=\"pq\">וַיִּקְרָא פַרְעֹה לְאַבְרָם וַיֹּאמֶר מַה־זֹּאת עָשִׂיתָ לִּי</q> <span class=\"cite\">(בראשית יב, יח)</span>","alt":{"t":"mc","q":"Who said <span class=\"he\">אִמְרִי־נָא אֲחֹתִי אָתְּ</span>?","o":["אברם, to שרי","Pharaoh, to שרי","שרי, to Pharaoh","Pharaoh's officers"],"why":"אברם asks שרי (pasuk יא–יג).","proof":"<q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q> <span class=\"cite\">(בראשית יב, יג)</span>"}},{"lv":2,"t":"mc","q":"Which pasuk proves that אברם did what ה' said right away?","o":["<q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q>","<q class=\"pq\">וַיִּסַּע אַבְרָם הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה</q>","<q class=\"pq\">וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם</q>","<q class=\"pq\">וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם</q>"],"why":"\"כאשר דבר אליו ה'\" means exactly as ה' told him.","proof":"<q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q> <span class=\"cite\">(בראשית יב, ד)</span>","alt":{"t":"mc","q":"Which pasuk shows how they got out of Egypt?","o":["<q class=\"pq\">וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַיְשַׁלְּחוּ אֹתוֹ</q>","<q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q>","<q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q>","<q class=\"pq\">וַיֵּרֶד אַבְרָם מִצְרַיְמָה</q>"],"why":"Pharaoh ordered men to send them out: וישלחו אתו.","proof":"<q class=\"pq\">וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כׇּל־אֲשֶׁר־לוֹ</q> <span class=\"cite\">(בראשית יב, כ)</span>"}},{"lv":2,"t":"fill","ref":"G12:1","blank":"אראך","mean":"that I will show you","why":"The land is described only as \"the land that I will show you\": <q class=\"pq\">אֲשֶׁר אַרְאֶךָּ</q>.","before":"וַיֹּאמֶר ה' אֶל־אַבְרָם לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר ","answer":"אַרְאֶךָּ","after":"","cite":"בראשית יב, א","ansCons":"אראך","others":["וַיֹּאמֶר","אַבְרָם","מֵאַרְצְךָ","וּמִמּוֹלַדְתְּךָ","וּמִבֵּית","אָבִיךָ","הָאָרֶץ","אֲשֶׁר"]},{"lv":2,"t":"fill","ref":"G12:13","blank":"אחתי","mean":"my sister","why":"<q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q>: \"please say you are my sister\".","before":"אִמְרִי־נָא ","answer":"אֲחֹתִי","after":" אָתְּ לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ","cite":"בראשית יב, יג","ansCons":"אחתי","others":["אִמְרִי","לְמַעַן","יִיטַב","בַעֲבוּרֵךְ","וְחָיְתָה","נַפְשִׁי","בִּגְלָלֵךְ׃"]},{"lv":2,"t":"order","q":"Put these events of פרק יב in order:","items":["ה' says לך לך","אברם leaves חרן with שרי and לוט","ה' promises the land at שכם","Famine; they go down to Egypt","Pharaoh sends them out"],"why":"א (לך לך) → ד–ה (leaving חרן) → ו–ז (שכם, לזרעך אתן) → י (famine) → כ (sent out)."},{"lv":2,"t":"mc","q":"Which words show that Avram's plan to be treated well actually happened?","o":["<q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q>","<q class=\"pq\">לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ</q>","<q class=\"pq\">כִּי־יָפָה הִוא מְאֹד</q>","<q class=\"pq\">קַח וָלֵךְ</q>"],"why":"Pasuk יג is the <b>plan</b> (ייטב לי בעבורך). Pasuk טז shows it <b>happened</b> (היטיב בעבורה).","proof":"<q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q> <span class=\"cite\">(בראשית יב, טז)</span>"},{"lv":3,"t":"open","q":"מה היה הקושי של אברם בציווי \"לך לך\"? הבא פסוק.","en":"What was Avram's difficulty in the command \"לך לך\"? Bring a pasuk.","model":"הקושי של אברם היה שהוא היה צריך לעזוב את כל מה שהוא מכיר: את הארץ שלו, את המולדת שלו ואת בית אביו, וללכת למקום שהוא לא יודע מהו. כתוב: <q class=\"pq\">לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ</q> <span class=\"cite\">(בראשית יב, א)</span>. המילים \"אשר אראך\" מראות שה' לא אמר לו לאן הוא הולך. בנוסף, הוא כבר היה זקן: <q class=\"pq\">וְאַבְרָם בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה</q> <span class=\"cite\">(בראשית יב, ד)</span>.","check":["Leaving 3 things: ארץ, מולדת, בית אב","Going to an unknown place: \"אשר אראך\"","Quote from פסוק א with chapter and pasuk","(Bonus) age 75, פסוק ד"]},{"lv":3,"t":"open","q":"מנה את ההבטחות שה' הבטיח לאברם בפרק יב, והסבר למה דווקא ההבטחות האלה.","en":"List the promises and explain why exactly these.","model":"ה' הבטיח לאברם: 1. שיהיה לגוי גדול 2. שיברך אותו 3. שיגדיל את שמו 4. שיהיה ברכה, וכל משפחות האדמה יתברכו בו: <q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה</q> <span class=\"cite\">(בראשית יב, ב)</span>, <q class=\"pq\">וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה</q> <span class=\"cite\">(בראשית יב, ג)</span>. בהמשך ה' הבטיח גם את הארץ: <q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית יב, ז)</span>.<br>למה דווקא אלה? כל הבטחה מתאימה למה שאברם עוזב: הוא עוזב את ארצו ומקבל ארץ; עוזב את מולדתו ומשפחתו והופך לגוי גדול; עוזב את בית אביו (השם והעושר) ומקבל ברכה ושם גדול.","check":["All 4 promises from ב–ג","The land promise (ז)","The link: each promise matches something he left in פסוק א","Quotes with pasuk numbers"]},{"lv":3,"t":"open","q":"למה אמר אברם ששרי היא אחותו? מה קרה במצרים ואיך יצאו משם? הבא פסוקים.","en":"Why did Avram say Sarai was his sister, what happened in Egypt, and how did they get out?","model":"אברם פחד שהמצרים יהרגו אותו בגלל היופי של שרי: <q class=\"pq\">וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q> <span class=\"cite\">(בראשית יב, יב)</span>. לכן ביקש ממנה: <q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ</q> <span class=\"cite\">(בראשית יב, יג)</span>.<br>במצרים: שרי נלקחה לבית פרעה <q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q> <span class=\"cite\">(בראשית יב, טו)</span>, ולאברם היה טוב בגללה <q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q> <span class=\"cite\">(בראשית יב, טז)</span>.<br>איך יצאו: ה' שלח נגעים על פרעה <q class=\"pq\">וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים</q> <span class=\"cite\">(בראשית יב, יז)</span>, פרעה החזיר את שרי <q class=\"pq\">הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ</q> <span class=\"cite\">(בראשית יב, יט)</span> ושלח אותם עם כל רכושם <q class=\"pq\">וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כׇּל־אֲשֶׁר־לוֹ</q> <span class=\"cite\">(בראשית יב, כ)</span>.","check":["Reason: fear of being killed (יב)","The request: אמרי נא אחתי את (יג)","What happened: Sarai taken, Avram got rich (טו–טז)","How they got out: נגעים → returned → sent out (יז–כ)","A quote for each part"]},{"lv":3,"t":"open","q":"מה היו הניסיונות של אברם בפרק יב? איך עמד בהם?","en":"What were Avram's tests in chapter 12?","model":"1. לעזוב הכל וללכת למקום לא ידוע: <q class=\"pq\">לֶךְ־לְךָ מֵאַרְצְךָ</q> <span class=\"cite\">(בראשית יב, א)</span>. אברם עמד בניסיון: <q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q> <span class=\"cite\">(בראשית יב, ד)</span>.<br>2. רעב בארץ שה' הבטיח לו: <q class=\"pq\">וַיְהִי רָעָב בָּאָרֶץ</q> <span class=\"cite\">(בראשית יב, י)</span>. הוא ירד למצרים רק \"לגור שם\", לזמן קצר.<br>3. הפחד במצרים ולקיחת שרי: <q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q> <span class=\"cite\">(בראשית יב, טו)</span>. ה' הציל אותם בנגעים.","check":["Test 1: לך לך + he went right away","Test 2: the famine","Test 3: Egypt / Sarai taken","A quote for each"]}],"who":[{"q":"<q class=\"pq\">לֶךְ־לְךָ מֵאַרְצְךָ</q> <span class=\"cite\">(בראשית יב, א)</span>","a":"ה'","o":["אברם","פרעה","לוט"],"ref":"G12:1"},{"q":"<q class=\"pq\">הִנֵּה־נָא יָדַעְתִּי כִּי אִשָּׁה יְפַת־מַרְאֶה אָתְּ</q> <span class=\"cite\">(בראשית יב, יא)</span>","a":"אברם","o":["פרעה","שרי פרעה","ה'"],"ref":"G12:11"},{"q":"<q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q> <span class=\"cite\">(בראשית יב, יג)</span>","a":"אברם","o":["פרעה","שרי","ה'"],"ref":"G12:13"},{"q":"<q class=\"pq\">מַה־זֹּאת עָשִׂיתָ לִּי</q> <span class=\"cite\">(בראשית יב, יח)</span>","a":"פרעה","o":["אברם","שרי","ה'"],"ref":"G12:18"},{"q":"<q class=\"pq\">וְעַתָּה הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ</q> <span class=\"cite\">(בראשית יב, יט)</span>","a":"פרעה","o":["ה'","אברם","שרי פרעה"],"ref":"G12:19"},{"q":"<q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית יב, ז)</span>","a":"ה'","o":["אברם","פרעה","לוט"],"ref":"G12:7"}]},{"id":"batar","name":"ברית בין הבתרים","full":"ברית בין הבתרים","ref":"בראשית טו, א–כא","color":"#7c3aed","icon":"🔥","intro":"ה' promises אברם a son and children as many as the stars, and אברם believes. אברם asks \"how will I know I'll inherit the land?\" ה' answers with a covenant: animals cut in half, and a smoking oven and a torch of fire pass between the pieces.","cards":[{"v":["G15:1"],"words":[{"he":"אַחַר הַדְּבָרִים הָאֵלֶּה","cons":"אחר הדברים האלה","en":"after these events","ref":"G15:1"},{"he":"דְבַר־ה'","cons":"דבר ה'","en":"the word of ה'","ref":"G15:1"},{"he":"בַּמַּחֲזֶה","cons":"במחזה","en":"in a vision","ref":"G15:1"},{"he":"אַל־תִּירָא","cons":"אל תירא","en":"do not be afraid","ref":"G15:1"},{"he":"אָנֹכִי מָגֵן לָךְ","cons":"אנכי מגן לך","en":"I am a shield for you (I will protect you)","ref":"G15:1"},{"he":"שְׂכָרְךָ הַרְבֵּה מְאֹד","cons":"שכרך הרבה מאד","en":"your reward will be very great","ref":"G15:1"}],"says":"ה' speaks to אברם in a vision: \"Don't be afraid, אברם. I am your shield, and your reward will be very great.\"","teach":"Two promises to אברם himself: <b>protection</b> (<q class=\"pq\">אָנֹכִי מָגֵן לָךְ</q>) and <b>a great reward</b> (<q class=\"pq\">שְׂכָרְךָ הַרְבֵּה מְאֹד</q>).","tip":"If asked \"what did ה' promise at the start of פרק טו\": <q class=\"pq\">אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד</q> <span class=\"cite\">(בראשית טו, א)</span>."},{"v":["G15:2","G15:3"],"words":[{"he":"מַה־תִּתֶּן־לִי","cons":"מה תתן לי","en":"what will You give me?","ref":"G15:2"},{"he":"וְאָנֹכִי הוֹלֵךְ עֲרִירִי","cons":"ואנכי הולך ערירי","en":"I am going (through life) childless","ref":"G15:2"},{"he":"וּבֶן־מֶשֶׁק בֵּיתִי","cons":"ובן משק ביתי","en":"the one in charge of my household","ref":"G15:2"},{"he":"דַּמֶּשֶׂק אֱלִיעֶזֶר","cons":"דמשק אליעזר","en":"אליעזר from Damascus","ref":"G15:2"},{"he":"הֵן לִי לֹא נָתַתָּה זָרַע","cons":"הן לי לא נתתה זרע","en":"You have not given me children (\"seed\")","ref":"G15:3"},{"he":"בֶן־בֵּיתִי","cons":"בן ביתי","en":"a member of my household (my servant)","ref":"G15:3"},{"he":"יוֹרֵשׁ אֹתִי","cons":"יורש אתי","en":"will inherit from me","ref":"G15:3"}],"says":"אברם answers: \"What will You give me? I have no children, and the one in charge of my house, אליעזר, will be my heir. You haven't given me children, so a servant of my household will inherit me.\"","teach":"אברם's complaint: a great reward means little if he has no child to pass it to. He is afraid his servant <b>אליעזר</b> will inherit him.","tip":"For <b>הבטחת הזרע</b>, the problem first: <q class=\"pq\">וְאָנֹכִי הוֹלֵךְ עֲרִירִי</q> <span class=\"cite\">(בראשית טו, ב)</span> + <q class=\"pq\">הֵן לִי לֹא נָתַתָּה זָרַע</q> <span class=\"cite\">(בראשית טו, ג)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">עֲרִירִי</span> mean?","o":["without children","without a home","very old","afraid"],"why":"ערירי = childless. Pasuk ג says it again in plain words: <q class=\"pq\">לִי לֹא נָתַתָּה זָרַע</q>.","proof":"<q class=\"pq\">וְאָנֹכִי הוֹלֵךְ עֲרִירִי</q> <span class=\"cite\">(בראשית טו, ב)</span>","alt":{"t":"mc","q":"Who did אברם think would inherit him?","o":["אליעזר, his servant","לוט, his nephew","ישמעאל","Pharaoh"],"why":"<q class=\"pq\">וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר</q>. אליעזר was in charge of his household.","proof":"<q class=\"pq\">וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר</q> <span class=\"cite\">(בראשית טו, ב)</span>"}}},{"v":["G15:4"],"words":[{"he":"לֹא יִירָשְׁךָ זֶה","cons":"לא יירשך זה","en":"this one will not inherit you","ref":"G15:4"},{"he":"כִּי־אִם","cons":"כי אם","en":"but rather","ref":"G15:4"},{"he":"אֲשֶׁר יֵצֵא מִמֵּעֶיךָ","cons":"אשר יצא ממעיך","en":"one who will come from your own body (your own son)","ref":"G15:4"},{"he":"הוּא יִירָשֶׁךָ","cons":"הוא יירשך","en":"he will inherit you","ref":"G15:4"}],"says":"ה' answers: \"אליעזר won't inherit you. Your own son will.\"","teach":"<b>הבטחת הזרע, part 1:</b> a son <b>of his own</b>: <q class=\"pq\">אֲשֶׁר יֵצֵא מִמֵּעֶיךָ</q>.","tip":"<q class=\"pq\">לֹא יִירָשְׁךָ זֶה כִּי־אִם אֲשֶׁר יֵצֵא מִמֵּעֶיךָ הוּא יִירָשֶׁךָ</q> <span class=\"cite\">(בראשית טו, ד)</span>."},{"v":["G15:5"],"words":[{"he":"וַיּוֹצֵא אֹתוֹ הַחוּצָה","cons":"ויוצא אתו החוצה","en":"He took him outside","ref":"G15:5"},{"he":"הַבֶּט־נָא הַשָּׁמַיְמָה","cons":"הבט נא השמימה","en":"please look up at the sky","ref":"G15:5"},{"he":"וּסְפֹר הַכּוֹכָבִים","cons":"וספר הכוכבים","en":"and count the stars","ref":"G15:5"},{"he":"אִם־תּוּכַל לִסְפֹּר אֹתָם","cons":"אם תוכל לספר אתם","en":"if you are able to count them","ref":"G15:5"},{"he":"כֹּה יִהְיֶה זַרְעֶךָ","cons":"כה יהיה זרעך","en":"so (that many) will your descendants be","ref":"G15:5"}],"says":"ה' takes אברם outside: \"Look at the sky and count the stars, if you can. That's how many your descendants will be.\"","teach":"<b>הבטחת הזרע, part 2:</b> not just one son, but so many descendants they <b>can't be counted</b>, like the stars. ה' gives אברם something he can <b>see</b>.","tip":"<q class=\"pq\">הַבֶּט־נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים אִם־תּוּכַל לִסְפֹּר אֹתָם וַיֹּאמֶר לוֹ כֹּה יִהְיֶה זַרְעֶךָ</q> <span class=\"cite\">(בראשית טו, ה)</span>."},{"check":{"t":"mc","q":"What did ה' tell אברם to count?","o":["the stars (הכוכבים)","the sand","the animals","the nations"],"why":"<q class=\"pq\">הַבֶּט־נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים</q>.","proof":"<q class=\"pq\">וּסְפֹר הַכּוֹכָבִים</q> <span class=\"cite\">(בראשית טו, ה)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">אֲשֶׁר יֵצֵא מִמֵּעֶיךָ</span> mean?","o":["one who comes from your own body (your own son)","one who leaves your house","a servant you will buy","someone from Egypt"],"why":"ממעיך = from your insides, your own body, so a real son of his own, not אליעזר.","proof":"<q class=\"pq\">כִּי־אִם אֲשֶׁר יֵצֵא מִמֵּעֶיךָ הוּא יִירָשֶׁךָ</q> <span class=\"cite\">(בראשית טו, ד)</span>"}}},{"v":["G15:6"],"words":[{"he":"וְהֶאֱמִן בַּה'","cons":"והאמן בה'","en":"he believed in ה'","ref":"G15:6"},{"he":"וַיַּחְשְׁבֶהָ לּוֹ","cons":"ויחשבה לו","en":"He counted it for him","ref":"G15:6"},{"he":"צְדָקָה","cons":"צדקה","en":"righteousness (a righteous act)","ref":"G15:6"}],"says":"אברם believed ה', and ה' counted his belief as צדקה.","teach":"<b>Why did אברם believe?</b> ה' answered his exact worry with a clear promise (<q class=\"pq\">אֲשֶׁר יֵצֵא מִמֵּעֶיךָ</q>) and showed him the stars. He believed with <b>no proof yet</b>: he was old and childless. That is why his belief counts as צדקה.","tip":"Must-know pasuk: <q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q> <span class=\"cite\">(בראשית טו, ו)</span>."},{"v":["G15:7","G15:8"],"words":[{"he":"אֲשֶׁר הוֹצֵאתִיךָ מֵאוּר כַּשְׂדִּים","cons":"אשר הוצאתיך מאור כשדים","en":"who took you out of אור כשדים","ref":"G15:7"},{"he":"לָתֶת לְךָ אֶת־הָאָרֶץ הַזֹּאת","cons":"לתת לך את הארץ הזאת","en":"to give you this land","ref":"G15:7"},{"he":"לְרִשְׁתָּהּ","cons":"לרשתה","en":"to inherit it (to own it)","ref":"G15:7"},{"he":"בַּמָּה אֵדַע","cons":"במה אדע","en":"how will I know?","ref":"G15:8"},{"he":"כִּי אִירָשֶׁנָּה","cons":"כי אירשנה","en":"that I will inherit it","ref":"G15:8"}],"says":"ה' says: \"I am ה', who took you out of אור כשדים to give you this land.\" אברם asks: \"How will I know that I will inherit it?\"","teach":"Notice the difference: about <b>children</b> he believed right away (pasuk ו). About <b>the land</b> he asks for a sign: <q class=\"pq\">בַּמָּה אֵדַע</q>. This question is <b>why</b> ה' makes the ברית: it is ה''s answer.","tip":"<b>למה נכרתה ברית בין הבתרים?</b> Quote <q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q> <span class=\"cite\">(בראשית טו, ח)</span>."},{"check":{"t":"mc","q":"What did אברם ask about in <span class=\"he\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</span>?","o":["the land: how will he know he'll inherit it","his son: how will he know he'll have one","the stars: how many there are","Egypt: when they will leave"],"why":"Pasuk ז is about the land (<q class=\"pq\">לָתֶת לְךָ אֶת־הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ</q>). He asks for a sign about <b>the land</b>.","proof":"<q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q> <span class=\"cite\">(בראשית טו, ח)</span>","alt":{"t":"mc","q":"Which pasuk says that אברם believed?","o":["<q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q>","<q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q>","<q class=\"pq\">מַה־תִּתֶּן־לִי</q>","<q class=\"pq\">וַיַּשֵּׁב אֹתָם אַבְרָם</q>"],"why":"והאמן = and he believed (פסוק ו).","proof":"<q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q> <span class=\"cite\">(בראשית טו, ו)</span>"}}},{"v":["G15:9","G15:10"],"words":[{"he":"קְחָה לִי","cons":"קחה לי","en":"take for Me","ref":"G15:9"},{"he":"עֶגְלָה מְשֻׁלֶּשֶׁת","cons":"עגלה משלשת","en":"a 3-year-old calf (heifer)","ref":"G15:9"},{"he":"וְעֵז מְשֻׁלֶּשֶׁת","cons":"ועז משלשת","en":"a 3-year-old goat","ref":"G15:9"},{"he":"וְאַיִל מְשֻׁלָּשׁ","cons":"ואיל משלש","en":"a 3-year-old ram","ref":"G15:9"},{"he":"וְתֹר","cons":"ותר","en":"a turtledove","ref":"G15:9"},{"he":"וְגוֹזָל","cons":"וגוזל","en":"a young pigeon","ref":"G15:9"},{"he":"וַיְבַתֵּר אֹתָם בַּתָּוֶךְ","cons":"ויבתר אתם בתוך","en":"he cut them in half down the middle","ref":"G15:10"},{"he":"וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ","cons":"ויתן איש בתרו לקראת רעהו","en":"he placed each half opposite the other","ref":"G15:10"},{"he":"וְאֶת־הַצִּפֹּר לֹא בָתָר","cons":"ואת הצפר לא בתר","en":"but the birds he did not cut","ref":"G15:10"}],"says":"ה' tells אברם to bring a calf, a goat and a ram (each 3 years old), a turtledove and a young pigeon. אברם cuts the three animals in half and lays each half facing the other. He does <b>not</b> cut the birds.","teach":"<b>The animals cut in half</b> are how this ברית is made. Later, fire passes between the pieces (pasuk יז), and the Torah says ה' <b>\"cut\"</b> a covenant: <q class=\"pq\">כָּרַת ה' אֶת־אַבְרָם בְּרִית</q>.<br><span class=\"note\"><b>My teacher:</b> the birds that were <u>not</u> cut (<q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q>) = <b>עם ישראל will remain forever</b>.</span>","tip":"<b>לקחת חיות ולחתוך לחצי</b>: <q class=\"pq\">וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ וְאֶת־הַצִּפֹּר לֹא בָתָר</q> <span class=\"cite\">(בראשית טו, י)</span>."},{"v":["G15:11"],"words":[{"he":"וַיֵּרֶד הָעַיִט","cons":"וירד העיט","en":"the bird of prey came down","ref":"G15:11"},{"he":"עַל־הַפְּגָרִים","cons":"על הפגרים","en":"onto the dead bodies (the cut animals)","ref":"G15:11"},{"he":"וַיַּשֵּׁב אֹתָם אַבְרָם","cons":"וישב אתם אברם","en":"and אברם drove them away","ref":"G15:11"}],"says":"Birds of prey swoop down onto the pieces, and אברם chases them away.","teach":"<span class=\"note\"><b>My teacher:</b> the big bird, <b>העיט</b>, stands for <b>מצרים</b>.</span> You can connect it to pasuk יג–יד: a nation will enslave his descendants, but ה' will judge it and they will go free.","tip":"<b>הציפור הגדולה = מצרים</b>: <q class=\"pq\">וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים וַיַּשֵּׁב אֹתָם אַבְרָם</q> <span class=\"cite\">(בראשית טו, יא)</span>."},{"check":{"t":"mc","q":"Which did אברם NOT cut in half?","o":["the birds (תר and גוזל)","the calf (עגלה)","the goat (עז)","the ram (איל)"],"why":"<q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q>. My teacher: this shows עם ישראל remains forever.","proof":"<q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q> <span class=\"cite\">(בראשית טו, י)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">הָעַיִט</span> stand for (my teacher)?","o":["מצרים","עם ישראל","ה'","the Canaanites"],"why":"העיט, the bird of prey that came down on the pieces, stands for מצרים.","proof":"<q class=\"pq\">וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים</q> <span class=\"cite\">(בראשית טו, יא)</span>"}}},{"v":["G15:12"],"words":[{"he":"וַיְהִי הַשֶּׁמֶשׁ לָבוֹא","cons":"ויהי השמש לבוא","en":"as the sun was about to set","ref":"G15:12"},{"he":"וְתַרְדֵּמָה נָפְלָה עַל־אַבְרָם","cons":"ותרדמה נפלה על אברם","en":"a deep sleep fell on אברם","ref":"G15:12"},{"he":"אֵימָה חֲשֵׁכָה גְדֹלָה","cons":"אימה חשכה גדלה","en":"a great dark dread (fear)","ref":"G15:12"},{"he":"נֹפֶלֶת עָלָיו","cons":"נפלת עליו","en":"falling on him","ref":"G15:12"}],"says":"As the sun is setting, אברם falls into a deep sleep, and a great, dark fear falls on him.","teach":"The darkness and fear come right before ה' tells him the hard news about slavery (pasuk יג).","tip":"<b>מתי</b>: at sunset. <q class=\"pq\">וַיְהִי הַשֶּׁמֶשׁ לָבוֹא</q> <span class=\"cite\">(בראשית טו, יב)</span>."},{"v":["G15:13"],"words":[{"he":"יָדֹעַ תֵּדַע","cons":"ידע תדע","en":"know for sure","ref":"G15:13"},{"he":"כִּי־גֵר יִהְיֶה זַרְעֲךָ","cons":"כי גר יהיה זרעך","en":"your descendants will be strangers","ref":"G15:13"},{"he":"בְּאֶרֶץ לֹא לָהֶם","cons":"בארץ לא להם","en":"in a land that is not theirs","ref":"G15:13"},{"he":"וַעֲבָדוּם","cons":"ועבדום","en":"and they (the locals) will enslave them","ref":"G15:13"},{"he":"וְעִנּוּ אֹתָם","cons":"וענו אתם","en":"and they will oppress them","ref":"G15:13"},{"he":"אַרְבַּע מֵאוֹת שָׁנָה","cons":"ארבע מאות שנה","en":"400 years","ref":"G15:13"}],"says":"\"Know for sure: your descendants will be strangers in a land that isn't theirs. They will be enslaved and oppressed for 400 years.\"","teach":"The ברית doesn't hide the hard part: before they get the land, there will be <b>exile and slavery</b> (גלות ושעבוד).","tip":"<q class=\"pq\">כִּי־גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה</q> <span class=\"cite\">(בראשית טו, יג)</span>."},{"v":["G15:14"],"words":[{"he":"וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ","cons":"וגם את הגוי אשר יעבדו","en":"and also the nation that they will serve","ref":"G15:14"},{"he":"דָּן אָנֹכִי","cons":"דן אנכי","en":"I will judge (punish)","ref":"G15:14"},{"he":"וְאַחֲרֵי־כֵן","cons":"ואחרי כן","en":"and after that","ref":"G15:14"},{"he":"יֵצְאוּ בִּרְכֻשׁ גָּדוֹל","cons":"יצאו ברכש גדול","en":"they will go out with great wealth","ref":"G15:14"}],"says":"\"I will also judge the nation that enslaves them. After that they will go out with great wealth.\"","teach":"The slavery has an end. ה' will <b>punish</b> the enslaving nation and take them out <b>rich</b>.","tip":"The promise to take them out: <q class=\"pq\">וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל</q> <span class=\"cite\">(בראשית טו, יד)</span>."},{"check":{"t":"mc","q":"For how long will אברם's descendants be enslaved?","o":["400 years","40 years","4 generations of 100","70 years"],"why":"<q class=\"pq\">אַרְבַּע מֵאוֹת שָׁנָה</q> = 400 years.","proof":"<q class=\"pq\">וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה</q> <span class=\"cite\">(בראשית טו, יג)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">דָּן אָנֹכִי</span> mean?","o":["I will judge (punish)","I will give","I will count","I will protect"],"why":"דן = judge. ה' will judge the nation that enslaves them.","proof":"<q class=\"pq\">וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי</q> <span class=\"cite\">(בראשית טו, יד)</span>"}}},{"v":["G15:15","G15:16"],"words":[{"he":"תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם","cons":"תבוא אל אבתיך בשלום","en":"you will go to your fathers in peace (die peacefully)","ref":"G15:15"},{"he":"תִּקָּבֵר בְּשֵׂיבָה טוֹבָה","cons":"תקבר בשיבה טובה","en":"you will be buried at a good old age","ref":"G15:15"},{"he":"וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה","cons":"ודור רביעי ישובו הנה","en":"the fourth generation will return here","ref":"G15:16"},{"he":"כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי","cons":"כי לא שלם עון האמרי","en":"because the sin of the Amorites is not yet complete","ref":"G15:16"},{"he":"עַד־הֵנָּה","cons":"עד הנה","en":"until now","ref":"G15:16"}],"says":"\"You yourself will die in peace at a good old age. The fourth generation will come back here, because the sin of the Amorites (who live in the land) is not yet complete.\"","teach":"Why wait so long? The pasuk explains: the people living in the land haven't yet sinned enough to lose it. A personal promise to אברם: a peaceful, long life.","tip":"<q class=\"pq\">וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה</q> <span class=\"cite\">(בראשית טו, טז)</span>."},{"v":["G15:17"],"words":[{"he":"וַיְהִי הַשֶּׁמֶשׁ בָּאָה","cons":"ויהי השמש באה","en":"the sun had set","ref":"G15:17"},{"he":"וַעֲלָטָה הָיָה","cons":"ועלטה היה","en":"and it was very dark","ref":"G15:17"},{"he":"תַנּוּר עָשָׁן","cons":"תנור עשן","en":"a smoking oven (furnace)","ref":"G15:17"},{"he":"וְלַפִּיד אֵשׁ","cons":"ולפיד אש","en":"a torch of fire","ref":"G15:17"},{"he":"אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה","cons":"אשר עבר בין הגזרים האלה","en":"that passed between these pieces","ref":"G15:17"}],"says":"After sunset, in deep darkness, a smoking oven and a torch of fire pass between the pieces.","teach":"<b>תנור עשן ולפיד אש</b> passing between the pieces stand for <b>making the ברית</b> (כריתת הברית). The very next pasuk says: <q class=\"pq\">בַּיּוֹם הַהוּא כָּרַת ה' אֶת־אַבְרָם בְּרִית</q>.","tip":"<b>הסבר את הסמל</b>: <q class=\"pq\">וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה</q> <span class=\"cite\">(בראשית טו, יז)</span>."},{"v":["G15:18"],"words":[{"he":"בַּיּוֹם הַהוּא","cons":"ביום ההוא","en":"on that day","ref":"G15:18"},{"he":"כָּרַת ה' אֶת־אַבְרָם בְּרִית","cons":"כרת ה' את אברם ברית","en":"ה' made (\"cut\") a covenant with אברם","ref":"G15:18"},{"he":"לְזַרְעֲךָ נָתַתִּי","cons":"לזרעך נתתי","en":"to your descendants I have given","ref":"G15:18"},{"he":"מִנְּהַר מִצְרַיִם","cons":"מנהר מצרים","en":"from the river of Egypt","ref":"G15:18"},{"he":"עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת","cons":"עד הנהר הגדל נהר פרת","en":"to the great river, the Euphrates (פרת)","ref":"G15:18"}],"says":"On that day ה' made a covenant with אברם: \"To your descendants I have given this land, from the river of Egypt to the great river, the פרת.\"","teach":"This is the <b>content of the ברית: the land</b>, for his descendants. Two word clues: <b>כרת</b> = \"cut\", like the cut animals. <b>נתתי</b> is past tense (\"I have given\"): it's already decided.","tip":"<b>מה הברית?</b> <q class=\"pq\">בַּיּוֹם הַהוּא כָּרַת ה' אֶת־אַבְרָם בְּרִית לֵאמֹר לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית טו, יח)</span>."},{"v":["G15:19","G15:20","G15:21"],"words":[{"he":"אֶת־הַקֵּינִי","cons":"את הקיני","en":"the Kenites","ref":"G15:19"},{"he":"וְאֶת־הַחִתִּי","cons":"ואת החתי","en":"the Hittites","ref":"G15:20"},{"he":"וְאֶת־הַכְּנַעֲנִי","cons":"ואת הכנעני","en":"the Canaanites","ref":"G15:21"},{"he":"וְאֶת־הַיְבוּסִי","cons":"ואת היבוסי","en":"the Jebusites","ref":"G15:21"}],"says":"The list of the 10 nations whose land is promised.","teach":"The land promised in the ברית belongs right now to <b>10 nations</b>. That's why it's a promise for the future.","tip":"You don't need to memorize the list. Just know it's the nations of the land."},{"check":{"t":"order","q":"Put the events of פרק טו in order:","items":["ה': \"אל תירא… שכרך הרבה מאד\"","אברם: \"I'm childless, אליעזר will inherit me\"","Count the stars; אברם believes","\"במה אדע\": אברם cuts the animals","The עיט comes down; אברם chases it","400 years of slavery are foretold","תנור עשן ולפיד אש pass between the pieces"],"why":"א → ב–ג → ה–ו → ח–י → יא → יג → יז."}},{"type":"compare","title":"The symbols of ברית בין הבתרים","cols":["Symbol","Pasuk","What it means"],"rows":[["Animals cut in half, halves facing each other","<q class=\"pq\">וַיְבַתֵּר אֹתָם בַּתָּוֶךְ</q> (י)","The way the ברית is made (\"כרת ברית\" = cut a covenant)"],["Birds not cut","<q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q> (י)","<b>Teacher:</b> עם ישראל remains forever"],["עיט (bird of prey) on the pieces; אברם chases it","<q class=\"pq\">וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים</q> (יא)","<b>Teacher:</b> מצרים"],["Great dark fear at sunset","<q class=\"pq\">אֵימָה חֲשֵׁכָה גְדֹלָה</q> (יב)","The hard news that follows: slavery (יג)"],["תנור עשן ולפיד אש passing between the pieces","<q class=\"pq\">תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ</q> (יז)","The making of the ברית (כריתת הברית)"]]},{"type":"compare","title":"ברית בין הבתרים: מי? למה? מה הסמלים? מתי?","cols":["Question","Answer"],"rows":[["מי?","ה' and אברם (for his descendants, \"לזרעך\"): <q class=\"pq\">כָּרַת ה' אֶת־אַבְרָם בְּרִית</q>"],["למה?","אברם asked <q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q>. The ברית is ה''s answer: the land is promised to his descendants."],["What is promised?","The land, <q class=\"pq\">מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת</q>, after 400 years of slavery, leaving <q class=\"pq\">בִּרְכֻשׁ גָּדוֹל</q>"],["מה הסמלים?","cut animals; birds not cut (Israel forever); עיט (Egypt); תנור עשן ולפיד אש (making the ברית)"],["מתי?","<q class=\"pq\">אַחַר הַדְּבָרִים הָאֵלֶּה</q>, before אברם had any children, at sunset and in the dark: <q class=\"pq\">וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה</q>"],["What does אברם do?","Brings the animals, cuts them, chases away the עיט"]]}],"cheat":{"facts":["ה': <q class=\"pq\">אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד</q>: protection + great reward.","אברם: childless (<q class=\"pq\">עֲרִירִי</q>), afraid אליעזר will inherit him.","Promise of seed: <q class=\"pq\">אֲשֶׁר יֵצֵא מִמֵּעֶיךָ</q> (his own son) + as many as the stars (<q class=\"pq\">כֹּה יִהְיֶה זַרְעֶךָ</q>).","<q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q>: he believed with no proof yet.","About the land he asks <q class=\"pq\">בַּמָּה אֵדַע</q> → the ברית.","עגלה, עז, איל (3 years old) cut in half; תר and גוזל not cut = Israel forever (teacher).","עיט on the pieces = מצרים (teacher). אברם chased them away.","Slavery 400 years in a land not theirs → ה' judges that nation → they leave <q class=\"pq\">בִּרְכֻשׁ גָּדוֹל</q> → return in the 4th generation.","תנור עשן ולפיד אש pass between the pieces = making the ברית. Land: from נהר מצרים to נהר פרת."],"must":["G15:5","G15:6","G15:8","G15:10","G15:11","G15:13","G15:17","G15:18"]},"quiz":[{"lv":1,"t":"mc","q":"What does <span class=\"he\">וַיְבַתֵּר</span> mean?","o":["he cut (them) in half","he burned (them)","he counted (them)","he chased (them) away"],"why":"ויבתר comes from בתר, to cut in two. That's where the name ברית בין ה<b>בתרים</b> comes from.","proof":"<q class=\"pq\">וַיְבַתֵּר אֹתָם בַּתָּוֶךְ</q> <span class=\"cite\">(בראשית טו, י)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">הַפְּגָרִים</span> mean?","o":["dead bodies (the cut animals)","birds","stars","pieces of wood"],"why":"פגרים = carcasses, the dead animals that were cut.","proof":"<q class=\"pq\">וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים</q> <span class=\"cite\">(בראשית טו, יא)</span>"}},{"lv":1,"t":"mc","q":"Which animals did ה' tell אברם to bring?","o":["a calf, a goat, a ram, a turtledove and a young pigeon","a lamb, an ox and a dove","a goat and two rams","camels and donkeys"],"why":"Pasuk ט: <q class=\"pq\">עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָל</q>.","proof":"<q class=\"pq\">וַיֹּאמֶר אֵלָיו קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָל</q> <span class=\"cite\">(בראשית טו, ט)</span>","alt":{"t":"mc","q":"How old were the calf, goat and ram?","o":["3 years old (משלשת)","1 year old","8 days old","7 years old"],"why":"משלשת / משלש = three years old.","proof":"<q class=\"pq\">עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ</q> <span class=\"cite\">(בראשית טו, ט)</span>"}},{"lv":1,"t":"mc","q":"What passed between the pieces?","o":["a smoking oven and a torch of fire","a great bird","an angel","a strong wind"],"why":"<q class=\"pq\">תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה</q>.","proof":"<q class=\"pq\">וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ</q> <span class=\"cite\">(בראשית טו, יז)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">וְלַפִּיד אֵשׁ</span> mean?","o":["a torch of fire","a pillar of cloud","a burning bush","a lightning bolt"],"why":"לפיד = torch. It passed between the pieces together with the smoking oven.","proof":"<q class=\"pq\">וְלַפִּיד אֵשׁ</q> <span class=\"cite\">(בראשית טו, יז)</span>"}},{"lv":1,"t":"mc","q":"What does <span class=\"he\">שְׂכָרְךָ הַרְבֵּה מְאֹד</span> mean?","o":["your reward will be very great","your children will be very many","your land will be very big","your enemies will be very few"],"why":"שכר = reward.","proof":"<q class=\"pq\">שְׂכָרְךָ הַרְבֵּה מְאֹד</q> <span class=\"cite\">(בראשית טו, א)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">אָנֹכִי מָגֵן לָךְ</span> mean?","o":["I am a shield for you (I will protect you)","I am your king","I will give you a son","I will take you out"],"why":"מגן = shield.","proof":"<q class=\"pq\">אָנֹכִי מָגֵן לָךְ</q> <span class=\"cite\">(בראשית טו, א)</span>"}},{"lv":1,"t":"mc","q":"Where will the land's borders be, according to the ברית?","o":["from the river of Egypt to the Euphrates (פרת)","from the sea to the desert","from שכם to בית אל","from חרן to כנען"],"why":"<q class=\"pq\">מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת</q>.","proof":"<q class=\"pq\">מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת</q> <span class=\"cite\">(בראשית טו, יח)</span>"},{"lv":2,"t":"mc","q":"Which pasuk shows the PROBLEM that leads to the promise of seed?","o":["<q class=\"pq\">הֵן לִי לֹא נָתַתָּה זָרַע</q>","<q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q>","<q class=\"pq\">כִּי־גֵר יִהְיֶה זַרְעֲךָ</q>","<q class=\"pq\">לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q>"],"why":"The problem: אברם has no children. \"הן לי לא נתתה זרע\" = You haven't given me children.","proof":"<q class=\"pq\">הֵן לִי לֹא נָתַתָּה זָרַע וְהִנֵּה בֶן־בֵּיתִי יוֹרֵשׁ אֹתִי</q> <span class=\"cite\">(בראשית טו, ג)</span>","alt":{"t":"mc","q":"Which pasuk explains WHY the return to the land is delayed?","o":["<q class=\"pq\">כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי עַד־הֵנָּה</q>","<q class=\"pq\">וְאַתָּה תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם</q>","<q class=\"pq\">וְתַרְדֵּמָה נָפְלָה עַל־אַבְרָם</q>","<q class=\"pq\">וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל</q>"],"why":"The Amorites' sin isn't \"complete\" yet.","proof":"<q class=\"pq\">וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי עַד־הֵנָּה</q> <span class=\"cite\">(בראשית טו, טז)</span>"}},{"lv":2,"t":"fill","ref":"G15:6","blank":"צדקה","mean":"righteousness","why":"<q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q>.","before":"וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ ","answer":"צְדָקָה","after":"","cite":"בראשית טו, ו","ansCons":"צדקה","others":["וְהֶאֱמִן","בַּה'","וַיַּחְשְׁבֶהָ"]},{"lv":2,"t":"fill","ref":"G15:10","blank":"לא בתר","mean":"he did not cut","why":"The birds were not cut: <q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q>. My teacher: Israel remains forever.","before":"וַיִּקַּח־לוֹ אֶת־כׇּל־אֵלֶּה וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ וְאֶת־הַצִּפֹּר ","answer":"לֹא בָתָר","after":"","cite":"בראשית טו, י","ansCons":"לא בתר","others":["וַיִּקַּח","אֵלֶּה","וַיְבַתֵּר","אֹתָם","בַּתָּוֶךְ","וַיִּתֵּן","אִישׁ","בִּתְרוֹ","לִקְרַאת","רֵעֵהוּ","וְאֶת","הַצִּפֹּר"]},{"lv":2,"t":"fill","ref":"G15:2","blank":"ערירי","mean":"childless","why":"<q class=\"pq\">וְאָנֹכִי הוֹלֵךְ עֲרִירִי</q>.","before":"וַיֹּאמֶר אַבְרָם אֲדֹנָי ה' מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ ","answer":"עֲרִירִי","after":" וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר","cite":"בראשית טו, ב","ansCons":"ערירי","others":["וַיֹּאמֶר","אַבְרָם","אֲדֹנָי","תִּתֶּן","וְאָנֹכִי","הוֹלֵךְ","וּבֶן","מֶשֶׁק","בֵּיתִי","הוּא","דַּמֶּשֶׂק","אֱלִיעֶזֶר׃"]},{"lv":2,"t":"mc","q":"About which promise did אברם believe right away, and about which did he ask for a sign?","o":["believed about children; asked a sign about the land","believed about the land; asked a sign about children","asked for a sign about both","believed both with no question"],"why":"Children: <q class=\"pq\">וְהֶאֱמִן בַּה'</q>. Land: <q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q>.","proof":"<q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q> <span class=\"cite\">(בראשית טו, ח)</span>"},{"lv":3,"t":"open","q":"למה אברם האמין לה'? מה הייתה הבטחת הזרע? הבא פסוקים.","en":"Why did Avram believe, and what was the promise of seed?","model":"אברם התלונן שאין לו ילדים: <q class=\"pq\">הֵן לִי לֹא נָתַתָּה זָרַע</q> <span class=\"cite\">(בראשית טו, ג)</span>. ה' הבטיח לו בן משלו: <q class=\"pq\">כִּי־אִם אֲשֶׁר יֵצֵא מִמֵּעֶיךָ הוּא יִירָשֶׁךָ</q> <span class=\"cite\">(בראשית טו, ד)</span>, וצאצאים רבים כמו הכוכבים: <q class=\"pq\">וּסְפֹר הַכּוֹכָבִים אִם־תּוּכַל לִסְפֹּר אֹתָם וַיֹּאמֶר לוֹ כֹּה יִהְיֶה זַרְעֶךָ</q> <span class=\"cite\">(בראשית טו, ה)</span>. ה' ענה בדיוק על החשש שלו והראה לו את הכוכבים, ולכן אברם האמין, אפילו בלי הוכחה: <q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q> <span class=\"cite\">(בראשית טו, ו)</span>.","check":["The problem: no children / אליעזר (ב–ג)","Promise 1: a son of his own (ד)","Promise 2: like the stars (ה)","He believed, counted as צדקה (ו)"]},{"lv":3,"t":"open","q":"הסבר את הסמלים בברית בין הבתרים: החיות שנחתכו, הציפורים, העיט, התנור והלפיד.","en":"Explain the symbols.","model":"1. אברם חתך את החיות לחצי: <q class=\"pq\">וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ</q> <span class=\"cite\">(בראשית טו, י)</span>. כך כורתים ברית (\"כרת\" = חתך).<br>2. את הציפורים לא חתך: <q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q> <span class=\"cite\">(בראשית טו, י)</span>. זה מסמל שעם ישראל יישאר לנצח.<br>3. העיט שירד על הפגרים: <q class=\"pq\">וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים</q> <span class=\"cite\">(בראשית טו, יא)</span>. העיט מסמל את מצרים, שתשעבד את ישראל (פס' יג).<br>4. התנור והלפיד: <q class=\"pq\">וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה</q> <span class=\"cite\">(בראשית טו, יז)</span>. זה מסמל את כריתת הברית, ובפסוק יח כתוב: <q class=\"pq\">בַּיּוֹם הַהוּא כָּרַת ה' אֶת־אַבְרָם בְּרִית</q> <span class=\"cite\">(בראשית טו, יח)</span>.","check":["Cut animals = the way to make a ברית","Birds not cut = Israel forever","עיט = מצרים","תנור ולפיד = making the ברית","A quote for each"]},{"lv":3,"t":"open","q":"ברית בין הבתרים: מי? למה? מתי? ומה הובטח בה?","en":"Who, why, when, what was promised.","model":"מי: ה' כרת ברית עם אברם: <q class=\"pq\">כָּרַת ה' אֶת־אַבְרָם בְּרִית</q> <span class=\"cite\">(בראשית טו, יח)</span>.<br>למה: אברם שאל <q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q> <span class=\"cite\">(בראשית טו, ח)</span>. הברית היא התשובה.<br>מתי: לפני שהיו לאברם ילדים, בשקיעה ובחושך: <q class=\"pq\">וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה</q> <span class=\"cite\">(בראשית טו, יז)</span>.<br>מה הובטח: הארץ לצאצאיו: <q class=\"pq\">לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית טו, יח)</span>, אחרי שעבוד של 400 שנה: <q class=\"pq\">וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה</q> <span class=\"cite\">(בראשית טו, יג)</span>, ויציאה ברכוש גדול: <q class=\"pq\">וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל</q> <span class=\"cite\">(בראשית טו, יד)</span>.","check":["Who: ה' + אברם","Why: במה אדע (ח)","When: sunset/dark, before he had children","What: land for his descendants + 400 years + leaving with great wealth"]},{"lv":3,"t":"open","q":"מה ה' גילה לאברם על העתיד של צאצאיו? הבא פסוקים.","en":"What did ה' reveal about the future of his descendants?","model":"ה' גילה שצאצאיו יהיו גרים בארץ זרה וישעבדו אותם 400 שנה: <q class=\"pq\">כִּי־גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה</q> <span class=\"cite\">(בראשית טו, יג)</span>. אבל ה' יעניש את הגוי המשעבד והם יצאו עם רכוש גדול: <q class=\"pq\">וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל</q> <span class=\"cite\">(בראשית טו, יד)</span>. הדור הרביעי יחזור לארץ: <q class=\"pq\">וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה</q> <span class=\"cite\">(בראשית טו, טז)</span>.","check":["Strangers + slavery, 400 years (יג)","ה' judges the nation, they leave with wealth (יד)","Return in the 4th generation (טז)"]}],"who":[{"q":"<q class=\"pq\">אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ</q> <span class=\"cite\">(בראשית טו, א)</span>","a":"ה'","o":["אברם","אליעזר","מלאך"],"ref":"G15:1"},{"q":"<q class=\"pq\">מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי</q> <span class=\"cite\">(בראשית טו, ב)</span>","a":"אברם","o":["ה'","אליעזר","שרי"],"ref":"G15:2"},{"q":"<q class=\"pq\">כֹּה יִהְיֶה זַרְעֶךָ</q> <span class=\"cite\">(בראשית טו, ה)</span>","a":"ה'","o":["אברם","אליעזר","פרעה"],"ref":"G15:5"},{"q":"<q class=\"pq\">בַּמָּה א
