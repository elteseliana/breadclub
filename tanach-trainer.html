// ================= QUESTION RENDERER =================
// renderQ(el, q, {onResult(correct, extra), mode}) — shows a question; calls onResult once.
function renderQ(el,q,opt){
 const lvl=q.lv==='check'?'Quick check':q.lv?('Level '+q.lv):'';
 const head=`<div class="qhead"><span class="lvl">${lvl}${q.topic&&byId[q.topic]?' · '+tname(q.topic):''}</span>${opt.counter?`<span class="small muted">${opt.counter}</span>`:''}</div>`;
 let hintUsed=false;
 const hintBtn=`<button class="btn ghost small" data-hint>💡 Hint</button>`;
 const showHint=(txt)=>{if(!hintUsed){hintUsed=true;S.hints[q.topic]=(S.hints[q.topic]||0)+1;save();}const hb=el.querySelector('.hintbox');hb.innerHTML='💡 '+txt;hb.hidden=false;};
 const wireHint=(fn)=>{const b=el.querySelector('[data-hint]');if(b)b.onclick=()=>showHint(fn());};
 const feedback=(ok,chosenHTML,rightHTML)=>{
   const fb=document.createElement('div');fb.className='fb '+(ok?'ok':'no');
   fb.innerHTML=ok?`<h4>✅ Correct!</h4><div>${q.why||''}</div>${q.proof?`<div class="sec"><b class="lbl">The pasuk</b>${q.proof}</div>`:''}`
     :`<h4>❌ Not quite.</h4>${chosenHTML?`<div class="small">You answered: ${chosenHTML}</div>`:''}<div><b>Right answer:</b> ${rightHTML}</div><div class="sec"><b class="lbl">Why</b>${q.why||''}</div>${q.proof?`<div class="sec"><b class="lbl">The pasuk that proves it</b>${q.proof}</div>`:''}<div class="sec"><b class="lbl">Next time</b>${q.look||q.hint||defaultLook(q)}</div>`;
   el.appendChild(fb);
   const nav=document.createElement('div');nav.className='nav';
   nav.innerHTML=ok?`<span></span><button class="btn primary" data-next>Continue →</button>`:`<span class="small muted">This one is saved to your Mistakes round.</span><button class="btn primary" data-next>Try a similar question →</button>`;
   el.appendChild(nav); const nb=nav.querySelector('[data-next]'); nb.focus({preventScroll:true});
   nb.onclick=()=>opt.onResult(ok,{hintUsed});
   fb.scrollIntoView({behavior:'smooth',block:'nearest'});
 };
 if(q.t==='mc'){
   const order=shuffle(q.o.map((o,i)=>i));
   el.innerHTML=head+`<div class="qtext">${q.q}</div><div class="opts">${order.map((i,k)=>`<button class="opt" data-i="${i}"><span class="k">${k+1}</span>${q.o[i]}</button>`).join('')}</div><div class="row">${hintBtn}</div><div class="hintbox" hidden></div>`;
   const btns=[...el.querySelectorAll('.opt')];
   wireHint(()=>{const wrong=btns.filter(b=>b.dataset.i!=='0'&&!b.disabled);if(wrong.length>1){const w=wrong[Math.floor(Math.random()*wrong.length)];w.disabled=true;w.style.opacity=.35;}return (q.hint?q.hint+'<br>':'')+'One wrong answer was removed.';});
   btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.disabled=true);const ok=b.dataset.i==='0';
     b.classList.add(ok?'right':'wrong');btns.find(x=>x.dataset.i==='0').classList.add('right');
     feedback(ok,ok?'':b.innerHTML.replace(/<span class="k">\d<\/span>/,''),q.o[0]);});
   keyHandler=(e)=>{const n=+e.key;if(n>=1&&n<=btns.length&&!btns[n-1].disabled)btns[n-1].click();};
 }
 else if(q.t==='fill'){
   el.innerHTML=head+`<div class="qtext">Type the missing word${norm(q.answer).includes(' ')?'s':''} (no nikud needed):</div><div class="pasuk-box"><p class="pasuk">${esc(q.before)}<span class="blank">&nbsp;?&nbsp;</span>${esc(q.after)}</p><div class="cite">(${q.cite})</div></div><input class="txt" dir="rtl" lang="he" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="הקלד כאן…"><div class="row" style="margin-top:8px"><button class="btn primary" data-check>Check</button>${hintBtn}</div><div class="hintbox" hidden></div>`;
   const inp=el.querySelector('input');setTimeout(()=>inp.focus({preventScroll:true}),50);
   let step=0;
   wireHint(()=>{step++;const a=norm(q.answer);return step===1?`Meaning: <b>${esc(q.mean||'')}</b>`:`Meaning: <b>${esc(q.mean||'')}</b>. It starts with <span class="he">${a[0]}</span> and has ${a.replace(/ /g,'').length} letters.`;});
   const check=()=>{if(!inp.value.trim())return;inp.disabled=true;el.querySelector('[data-check]').disabled=true;const ok=norm(inp.value)===norm(q.answer);
     inp.style.borderColor=ok?'var(--good)':'var(--bad)';feedback(ok,`<span class="he">${esc(inp.value)}</span>`,`<span class="he">${q.answer}</span>`);};
   el.querySelector('[data-check]').onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
   keyHandler=null;
 }
 else if(q.t==='order'){
   const items=q.items.map((x,i)=>({x,i}));let pool=shuffle(items);if(pool.every((p,k)=>p.i===k)&&pool.length>1)pool=pool.reverse();let ans=[];
   el.innerHTML=head+`<div class="qtext">${q.q}</div><div class="small muted">Tap the events in the right order. Tap an answer to take it back.</div><div class="order-ans"></div><div class="order-pool"></div><div class="row"><button class="btn primary" data-check disabled>Check order</button>${hintBtn}</div><div class="hintbox" hidden></div>`;
   const A=el.querySelector('.order-ans'),P=el.querySelector('.order-pool'),C=el.querySelector('[data-check]');
   const draw=()=>{A.innerHTML=ans.length?ans.map((p,k)=>`<button data-a="${k}"><span class="n">${k+1}.</span>${p.x}</button>`).join(''):'<div class="small muted" style="padding:10px">Your order will appear here</div>';
     P.innerHTML=pool.map((p,k)=>`<button data-p="${k}" data-o="${p.i}">${p.x}</button>`).join('');C.disabled=pool.length>0;
     A.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{pool.push(ans.splice(+b.dataset.a,1)[0]);draw();});
     P.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ans.push(pool.splice(+b.dataset.p,1)[0]);draw();});};
   draw();
   wireHint(()=>`The first one is: <b>${q.items[0]}</b>`);
   C.onclick=()=>{C.disabled=true;A.querySelectorAll('button').forEach(b=>b.disabled=true);const ok=ans.every((p,k)=>p.i===k);
     feedback(ok,'',`<ol>${q.items.map(x=>`<li>${x}</li>`).join('')}</ol>`);};
   keyHandler=null;
 }
 else if(q.t==='open'){
   const draftKey='draft:'+q.id;
   el.innerHTML=head+`<div class="qtext rtl">${q.q}</div>${q.en?`<div class="small muted">${esc(q.en)}</div>`:''}<p class="small muted">Write your answer in Hebrew: <b>answer sentence → quote with chapter and pasuk → explanation</b>.</p><textarea dir="rtl" lang="he" placeholder="התשובה שלי…"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-show>Show model answer</button>${hintBtn}</div><div class="hintbox" hidden></div><div data-grade></div>`;
   const ta=el.querySelector('textarea');ta.value=(S.drafts&&S.drafts[draftKey])||'';ta.oninput=()=>{S.drafts=S.drafts||{};S.drafts[draftKey]=ta.value;save();};
   wireHint(()=>`A full answer must include:<ul>${q.check.slice(0,2).map(c=>`<li>${c}</li>`).join('')}</ul>`);
   el.querySelector('[data-show]').onclick=(e)=>{e.target.disabled=true;
     const g=el.querySelector('[data-grade]');
     g.innerHTML=`<div class="sec"><b class="lbl">Model answer</b><div class="model rtl">${q.model}</div></div><div class="sec"><b class="lbl">Checklist: did your answer include…</b><div class="check-list">${q.check.map(c=>`<label><input type="checkbox"> <span>${c}</span></label>`).join('')}</div></div><div class="nav"><button class="btn bad" data-no>✘ I didn't get it</button><button class="btn good" data-yes>✔ I got it</button></div>`;
     g.querySelector('[data-yes]').onclick=()=>{const boxes=[...g.querySelectorAll('input')];if(boxes.some(b=>!b.checked)&&!confirm('Not every checklist item is ticked. Mark as "got it" anyway?'))return;opt.onResult(true,{hintUsed,open:true});};
     g.querySelector('[data-no]').onclick=()=>opt.onResult(false,{hintUsed,open:true});
     g.scrollIntoView({behavior:'smooth',block:'start'});};
   keyHandler=null;
 }
}
function defaultLook(q){
 if(q.t==='fill') return 'Read the whole pasuk out loud. The missing word usually connects to the words right before and after it.';
 if(q.t==='order') return 'Use the pasuk numbers: events earlier in the chapter come first.';
 return 'Find the pasuk and read it word by word. The answer is in the exact words.';
}
let keyHandler=null;
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='Enter'){if(e.target.matches('button'))return;const n=document.querySelector('[data-next]');if(n){n.click();return;}}if(keyHandler)keyHandler(e);});

// ================= RUNNER (quiz session with retry + requeue) =================
// queue items: {id, scored:true|false, retry:bool}
function Runner(el,cfg){
 // cfg: {kind, topic, title, queue, pos, stats, persist:bool, onDone(stats), bucket}
 const st=cfg.state||{kind:cfg.kind,topic:cfg.topic,title:cfg.title,queue:cfg.ids.map(id=>({id,scored:true})),pos:0,right:0,total:0,wrongIds:[],bucket:cfg.bucket};
 const persist=()=>{if(cfg.persist){S.session=st;save();}};
 function step(){
  if(st.pos>=st.queue.length){if(cfg.persist){S.session=null;save();}cfg.onDone&&cfg.onDone(st);return;}
  const it=st.queue[st.pos]; const q=getQ(it.id); if(!q){st.pos++;return step();}
  const done=st.queue.slice(0,st.pos).filter(x=>x.scored).length, totalScored=st.queue.filter(x=>x.scored).length;
  const counter=it.retry?'🔁 Similar question':(it.again?'↩︎ Back again: get it right':`Question ${Math.min(done+1,totalScored)} of ${totalScored}`);
  el.innerHTML=`${cfg.title?`<div class="row" style="justify-content:space-between"><h2>${cfg.title}</h2><span class="small muted">${st.right}/${st.total} first try</span></div>`:''}<div class="bar"><i style="width:${pct(st.pos,st.queue.length)}%"></i></div><div class="card" data-q></div>`;
  const box=el.querySelector('[data-q]');
  renderQ(box,q,{counter,onResult:(ok,ex)=>{
    if(it.scored){st.total++; if(ok)st.right++; if(st.bucket){const s=sc(st.bucket,q.topic,st.bucket==='scores'?String(q.lv):'all');s.t++;if(ok)s.r++;}}
    if(ok){ if(it.scored||it.again){S.streak++;S.best=Math.max(S.best,S.streak);} if(st.kind==='mistakes'){clearMistake(it.base||it.id);} if(S.streak>0&&S.streak%10===0)toast(`🔥 ${S.streak} in a row!`); }
    else { S.streak=0; addMistake(getQ(it.base||it.id)); if(!st.wrongIds.includes(it.base||it.id))st.wrongIds.push(it.base||it.id);
      const base=it.base||it.id;
      if(q.t!=='open'){ const r=retryFor(getQ(base)); st.queue.splice(st.pos+1,0,{id:r,scored:false,retry:true,base}); }
      st.queue.push({id:base,scored:false,again:true,base}); }
    st.pos++; save(); updHeader(); persist(); step(); window.scrollTo({top:0,behavior:'smooth'});
  }});
  persist();
 }
 step();
}

function startTopicQuiz(tid){const t=byId[tid];
 const ids=t.quiz.map((q,i)=>`${tid}.q${i}`);const lv1=ids.filter(id=>REG[id].lv===1),lv2=ids.filter(id=>REG[id].lv===2),lv3=ids.filter(id=>REG[id].lv===3);
 const who=pick(WHO[tid],1);
 const queue=shuffle(lv1.concat(who)).concat(shuffle(lv2)).concat(lv3);
 S.session={kind:'quiz',topic:tid,title:`Mini quiz: ${t.name}`,queue:queue.map(id=>({id,scored:true})),pos:0,right:0,total:0,wrongIds:[],bucket:'scores'};save();go('quiz',{resume:true});}
function startMistakes(tid){const ids=shuffle(mistakeIds(tid));if(!ids.length){toast('No mistakes to redo 🎉');return;}
 S.session={kind:'mistakes',topic:tid||null,title:tid?`Mistakes round: ${tname(tid)}`:'Mistakes round: all topics',queue:ids.map(id=>({id,scored:true})),pos:0,right:0,total:0,wrongIds:[],bucket:null};save();go('quiz',{resume:true});}

 if(s.kind==='quiz'){const tid=s.topic;S.quizDone[tid]=true;save();const nm=mistakeIds(tid).length;const first=!S.celebrated[tid];S.celebrated[tid]=true;save();
  app.innerHTML=`<div class="card celebrate"><div class="big">🎉</div><h1>${byId[tid].name}: mini quiz complete!</h1><p>First-try score: <b>${s.right}/${s.total} (${pct(s.right,s.total)}%)</b></p>${nm?`<p>You still have <b>${nm}</b> mistake${nm>1?'s':''} saved in this topic. Do the mistakes round now while it's fresh.</p>`:'<p>No mistakes left in this topic. Amazing!</p>'}

// ----- final -----
function buildQuickRound(){const per={};const counts=shuffle([7,6,6,6]);
 TID.forEach((tid,i)=>{const t=byId[tid];
  const authored=t.quiz.map((q,qi)=>`${tid}.q${qi}`).filter(id=>REG[id].t!=='open');
  const checks=t.cards.map((c,ci)=>c.check?`${tid}.c${ci}`:null).filter(Boolean);
  const words=WORDS[tid].map(w=>Math.random()<.5?w.id:w.id+'r');
  const who=WHO[tid];
  const mix=pick(who,2).concat(pick(words,2)).concat(pick(authored.concat(checks),counts[i]));
  per[tid]=[...new Set(mix)].slice(0,counts[i]);});
 return shuffle(Object.values(per).flat());}
function final(app){const nm=mistakeIds().length;
 app.innerHTML=`<div class="card"><h1>🏁 The big final quiz</h1><ol><li><b>Quick round:</b> 25 mixed questions from all 4 topics (words, who said it, which pasuk).</li><li><b>מבחן אמיתי:</b> 8 open questions. Choose 5, at least one from each topic, just like the real test. Optional 45-minute timer.</li><li>Grade yourself with the model answers and checklists → results per topic.</li></ol>
  ${nm?`<div class="tip">You have <b>${nm}</b> saved mistakes. It's best to redo them first.<div class="row" style="margin-top:6px"><button class="btn" onclick="startMistakes()">Redo mistakes first</button></div></div>`:''}
  ${S.lessonDone?'':`<div class="tip">Tip: do the <a href="#" onclick="go('lesson');return false">bagrut answer lesson</a> before the מבחן אמיתי.</div>`}
  <div class="row" style="margin-top:12px"><button class="btn primary" onclick="startFinal()">Start quick round</button><button class="btn" onclick="go('real')">Skip to מבחן אמיתי</button></div></div>`;}
function startFinal(){S.final={};S.session={kind:'final',topic:null,title:'Final quiz: quick round',queue:buildQuickRound().map(id=>({id,scored:true})),pos:0,right:0,total:0,wrongIds:[],bucket:'final'};save();go('quiz',{resume:true});}

function real(app){const RT=DATA.extra.realTest;S.realTest=S.realTest||{stage:'choose',chosen:[],answers:{},timer:false,endAt:0,grades:{}};const R=S.realTest;save();
 if(R.stage==='choose'){

  ${R.chosen.map((i,k)=>`<div class="card"><span class="lvl">Question ${k+1} · ${tname(RT[i].topic)}</span><div class="qtext rtl">${RT[i].q}</div><textarea data-a="${i}" dir="rtl" lang="he" placeholder="התשובה שלי…">${esc(R.answers[i]||'')}</textarea></div>`).join('')}

  app.querySelectorAll('textarea').forEach(ta=>ta.oninput=()=>{R.answers[ta.dataset.a]=ta.value;save();});
  if(R.timer){const tick=()=>{const left=Math.max(0,R.endAt-Date.now());const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const el=$('#tm');if(!el){stopTimer();return;}el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(left<=0){stopTimer();el.textContent='00:00';toast('⏰ Time is up! Finish your sentence and go to grading.',4000);}else if(left<5*60000)el.style.background='var(--bad-bg)';};tick();timerInt=setInterval(tick,1000);}

  const comb={r:f.r+rr.r*3,t:f.t+rr.t*3};// open questions count triple

// ================= CONFETTI =================
function confetti(n){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#f59e0b','#7c3aed','#0891b2','#059669','#ef4444','#2f5bd3'];
 const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
 let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});if(++f<170)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);})();}

window.addEventListener('resize',applySettings);
render();
