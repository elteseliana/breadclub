ֵדַע כִּי אִירָשֶׁנָּה</q> <span class=\"cite\">(בראשית טו, ח)</span>","a":"אברם","o":["ה'","אליעזר","שרי"],"ref":"G15:8"},{"q":"<q class=\"pq\">יָדֹעַ תֵּדַע כִּי־גֵר יִהְיֶה זַרְעֲךָ</q> <span class=\"cite\">(בראשית טו, יג)</span>","a":"ה'","o":["אברם","אליעזר","פרעה"],"ref":"G15:13"}]},{"id":"mila","name":"ברית מילה","full":"ברית מילה","ref":"בראשית יז, א–כז","color":"#0891b2","icon":"✡️","intro":"At age 99, ה' makes a ברית with אברם: new names (אברהם, שרה), a son יצחק, kings, the land, \"I will be your God\". Avraham's part is to circumcise every male. The מילה is the אות (sign) of the ברית. He does it that same day.","cards":[{"v":["G17:1"],"words":[{"he":"בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים","cons":"בן תשעים שנה ותשע שנים","en":"99 years old","ref":"G17:1"},{"he":"וַיֵּרָא ה'","cons":"וירא ה'","en":"ה' appeared","ref":"G17:1"},{"he":"אֲנִי־אֵל שַׁדַּי","cons":"אני אל שדי","en":"I am א-ל שד-י (God Almighty)","ref":"G17:1"},{"he":"הִתְהַלֵּךְ לְפָנַי","cons":"התהלך לפני","en":"walk before Me (live your life in front of Me)","ref":"G17:1"},{"he":"וֶהְיֵה תָמִים","cons":"והיה תמים","en":"and be whole / wholehearted (תמים)","ref":"G17:1"}],"says":"When אברם is 99, ה' appears to him: \"Walk before Me and be תמים.\"","teach":"<b>מתי:</b> age 99. <b>What אברם must do</b> (in general): <q class=\"pq\">הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים</q>. The מילה (later) is the specific mitzva.","tip":"<b>מתי?</b> <q class=\"pq\">וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q> <span class=\"cite\">(בראשית יז, א)</span>."},{"v":["G17:2","G17:3"],"words":[{"he":"וְאֶתְּנָה בְרִיתִי בֵּינִי וּבֵינֶךָ","cons":"ואתנה בריתי ביני ובינך","en":"I will set My covenant between Me and you","ref":"G17:2"},{"he":"וְאַרְבֶּה אוֹתְךָ בִּמְאֹד מְאֹד","cons":"וארבה אותך במאד מאד","en":"I will multiply you very, very much","ref":"G17:2"},{"he":"וַיִּפֹּל אַבְרָם עַל־פָּנָיו","cons":"ויפל אברם על פניו","en":"אברם fell on his face (bowed down)","ref":"G17:3"}],"says":"\"I will make My covenant between Me and you and multiply you very much.\" אברם bows down with his face to the ground.","teach":"The ברית is between ה' and אברם: <q class=\"pq\">בֵּינִי וּבֵינֶךָ</q>. The first promise: many descendants.","tip":"<b>מי?</b> <q class=\"pq\">וְאֶתְּנָה בְרִיתִי בֵּינִי וּבֵינֶךָ</q> <span class=\"cite\">(בראשית יז, ב)</span>."},{"v":["G17:4","G17:5"],"words":[{"he":"הִנֵּה בְרִיתִי אִתָּךְ","cons":"הנה בריתי אתך","en":"here is My covenant with you","ref":"G17:4"},{"he":"לְאַב הֲמוֹן גּוֹיִם","cons":"לאב המון גוים","en":"a father of many nations","ref":"G17:4"},{"he":"וְלֹא־יִקָּרֵא עוֹד אֶת־שִׁמְךָ אַבְרָם","cons":"ולא יקרא עוד את שמך אברם","en":"you will no longer be called אברם","ref":"G17:5"},{"he":"וְהָיָה שִׁמְךָ אַבְרָהָם","cons":"והיה שמך אברהם","en":"your name will be אברהם","ref":"G17:5"},{"he":"כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ","cons":"כי אב המון גוים נתתיך","en":"because I have made you a father of many nations","ref":"G17:5"}],"says":"\"You will be the father of many nations. Your name will no longer be אברם. It will be אברהם, because I have made you a father of many nations.\"","teach":"<b>The name change:</b> the pasuk itself gives the reason: <q class=\"pq\">כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ</q>. אב + המון → <b>אברהם</b>. The new name holds the promise.","tip":"<q class=\"pq\">וְהָיָה שִׁמְךָ אַבְרָהָם כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ</q> <span class=\"cite\">(בראשית יז, ה)</span>."},{"check":{"t":"mc","q":"Why was אברם's name changed to אברהם?","o":["Because he would be a father of many nations (אב המון גוים)","Because he laughed","Because he was circumcised","Because he left חרן"],"why":"The pasuk says: <q class=\"pq\">כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ</q>.","proof":"<q class=\"pq\">וְהָיָה שִׁמְךָ אַבְרָהָם כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ</q> <span class=\"cite\">(בראשית יז, ה)</span>","alt":{"t":"mc","q":"How old was אברם when ה' made the ברית מילה?","o":["99","75","100","86"],"why":"<q class=\"pq\">בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q> = 90 + 9 = 99. (75 was when he left חרן.)","proof":"<q class=\"pq\">וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q> <span class=\"cite\">(בראשית יז, א)</span>"}}},{"v":["G17:6"],"words":[{"he":"וְהִפְרֵתִי אֹתְךָ","cons":"והפרתי אתך","en":"I will make you fruitful","ref":"G17:6"},{"he":"וּנְתַתִּיךָ לְגוֹיִם","cons":"ונתתיך לגוים","en":"I will make you into nations","ref":"G17:6"},{"he":"וּמְלָכִים מִמְּךָ יֵצֵאוּ","cons":"ומלכים ממך יצאו","en":"and kings will come from you","ref":"G17:6"}],"says":"\"I will make you very fruitful and turn you into nations. Kings will come from you.\"","teach":"A new promise that wasn't in פרק יב or טו: <b>kings</b>.","tip":"<q class=\"pq\">וּמְלָכִים מִמְּךָ יֵצֵאוּ</q> <span class=\"cite\">(בראשית יז, ו)</span>."},{"v":["G17:7","G17:8"],"words":[{"he":"וַהֲקִמֹתִי אֶת־בְּרִיתִי","cons":"והקמתי את בריתי","en":"I will establish My covenant","ref":"G17:7"},{"he":"וּבֵין זַרְעֲךָ אַחֲרֶיךָ לְדֹרֹתָם","cons":"ובין זרעך אחריך לדרתם","en":"and with your descendants after you, for all their generations","ref":"G17:7"},{"he":"לִבְרִית עוֹלָם","cons":"לברית עולם","en":"as an everlasting covenant","ref":"G17:7"},{"he":"לִהְיוֹת לְךָ לֵאלֹהִים","cons":"להיות לך לאלהים","en":"to be God to you","ref":"G17:7"},{"he":"אֶרֶץ מְגֻרֶיךָ","cons":"ארץ מגריך","en":"the land where you live as a stranger","ref":"G17:8"},{"he":"לַאֲחֻזַּת עוֹלָם","cons":"לאחזת עולם","en":"as a possession forever","ref":"G17:8"},{"he":"וְהָיִיתִי לָהֶם לֵאלֹהִים","cons":"והייתי להם לאלהים","en":"and I will be God to them","ref":"G17:8"}],"says":"\"The covenant is with you and your descendants forever. I will be your God. I will give you and your descendants all of כנען as a possession forever.\"","teach":"<b>The content of the ברית (ה''s side):</b> 1. It's forever: <q class=\"pq\">לִבְרִית עוֹלָם</q>. 2. ה' will be their God: <q class=\"pq\">לִהְיוֹת לְךָ לֵאלֹהִים</q>. 3. The land: <q class=\"pq\">אֵת כׇּל־אֶרֶץ כְּנַעַן לַאֲחֻזַּת עוֹלָם</q>.","tip":"<b>למה / מה הברית?</b> <q class=\"pq\">לִבְרִית עוֹלָם לִהְיוֹת לְךָ לֵאלֹהִים וּלְזַרְעֲךָ אַחֲרֶיךָ</q> <span class=\"cite\">(בראשית יז, ז)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">לִבְרִית עוֹלָם</span> mean?","o":["an everlasting covenant","a covenant with the whole world","a covenant for one generation","a covenant of peace"],"why":"עולם here = forever.","proof":"<q class=\"pq\">לִבְרִית עוֹלָם</q> <span class=\"cite\">(בראשית יז, ז)</span>","alt":{"t":"mc","q":"Which promise in פרק יז was NOT in פרק יב?","o":["Kings will come from you (ומלכים ממך יצאו)","You will be blessed","Your descendants will get the land","You will be a great nation"],"why":"<q class=\"pq\">וּמְלָכִים מִמְּךָ יֵצֵאוּ</q> is new in פרק יז.","proof":"<q class=\"pq\">וּמְלָכִים מִמְּךָ יֵצֵאוּ</q> <span class=\"cite\">(בראשית יז, ו)</span>"}}},{"v":["G17:9","G17:10"],"words":[{"he":"וְאַתָּה אֶת־בְּרִיתִי תִשְׁמֹר","cons":"ואתה את בריתי תשמר","en":"and you, you must keep My covenant","ref":"G17:9"},{"he":"זֹאת בְּרִיתִי","cons":"זאת בריתי","en":"this is My covenant","ref":"G17:10"},{"he":"הִמּוֹל לָכֶם כׇּל־זָכָר","cons":"המול לכם כל זכר","en":"every male among you must be circumcised","ref":"G17:10"}],"says":"\"And you must keep My covenant, you and your descendants. This is My covenant: every male among you shall be circumcised.\"","teach":"Now comes <b>אברהם's side</b>: <q class=\"pq\">וְאַתָּה</q> = \"and you\". <b>Law 1: every male</b>: <q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q>.","tip":"<b>דיני ברית מילה, 1:</b> <q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, י)</span>."},{"v":["G17:11"],"words":[{"he":"וּנְמַלְתֶּם","cons":"ונמלתם","en":"you shall circumcise","ref":"G17:11"},{"he":"אֵת בְּשַׂר עׇרְלַתְכֶם","cons":"את בשר ערלתכם","en":"the flesh of your foreskin (ערלה)","ref":"G17:11"},{"he":"וְהָיָה לְאוֹת בְּרִית","cons":"והיה לאות ברית","en":"and it will be a SIGN (אות) of the covenant","ref":"G17:11"}],"says":"\"You shall circumcise the flesh of your foreskin, and it will be a sign of the covenant between Me and you.\"","teach":"<b>The symbol of ברית מילה:</b> the מילה itself is the <b>אות</b> (sign) of the ברית: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q>. <b>Law 4:</b> what you do is remove the ערלה.","tip":"<b>מה הסמל?</b> <q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>."},{"v":["G17:12","G17:13"],"words":[{"he":"וּבֶן־שְׁמֹנַת יָמִים","cons":"ובן שמנת ימים","en":"and at eight days old","ref":"G17:12"},{"he":"יִמּוֹל לָכֶם כׇּל־זָכָר","cons":"ימול לכם כל זכר","en":"every male shall be circumcised","ref":"G17:12"},{"he":"לְדֹרֹתֵיכֶם","cons":"לדרתיכם","en":"for all your generations","ref":"G17:12"},{"he":"יְלִיד בָּיִת","cons":"יליד בית","en":"a servant born in the house","ref":"G17:12"},{"he":"וּמִקְנַת־כֶּסֶף","cons":"ומקנת כסף","en":"one bought with money","ref":"G17:12"},{"he":"בֶּן־נֵכָר","cons":"בן נכר","en":"a foreigner","ref":"G17:12"},{"he":"הִמּוֹל יִמּוֹל","cons":"המול ימול","en":"must surely be circumcised","ref":"G17:13"},{"he":"וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם","cons":"והיתה בריתי בבשרכם","en":"My covenant will be in your flesh","ref":"G17:13"},{"he":"לִבְרִית עוֹלָם","cons":"לברית עולם","en":"as an everlasting covenant","ref":"G17:13"}],"says":"\"At eight days old, every male shall be circumcised, for all generations. Also a servant born in your house or one bought with money from a foreigner. My covenant will be in your flesh, forever.\"","teach":"<b>Law 2: at 8 days old</b> (<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים</q>). <b>Also servants:</b> <q class=\"pq\">יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף</q>. The ברית is <b>in the body</b>: <q class=\"pq\">וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם</q>. It stays forever and can't be taken off.","tip":"<b>דיני מילה, 2:</b> <q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר לְדֹרֹתֵיכֶם</q> <span class=\"cite\">(בראשית יז, יב)</span>."},{"check":{"t":"mc","q":"At what age is a baby boy circumcised?","o":["8 days old","13 years old","7 days old","30 days old"],"why":"<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר</q>. (13 was ישמעאל's age.)","proof":"<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, יב)</span>","alt":{"t":"mc","q":"What is the sign (אות) of the ברית in פרק יז?","o":["the מילה itself","the stars","the cut animals","a smoking oven"],"why":"<q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q>: the מילה is the sign. (Stars and animals belong to פרק טו.)","proof":"<q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם וְהָיָה לְאוֹת בְּרִית</q> <span class=\"cite\">(בראשית יז, יא)</span>"}}},{"v":["G17:14"],"words":[{"he":"וְעָרֵל זָכָר","cons":"וערל זכר","en":"an uncircumcised male","ref":"G17:14"},{"he":"אֲשֶׁר לֹא־יִמּוֹל","cons":"אשר לא ימול","en":"who is not circumcised","ref":"G17:14"},{"he":"וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ","cons":"ונכרתה הנפש ההוא מעמיה","en":"that person will be cut off from his people (the punishment of כרת)","ref":"G17:14"},{"he":"אֶת־בְּרִיתִי הֵפַר","cons":"את בריתי הפר","en":"he has broken My covenant","ref":"G17:14"}],"says":"\"An uncircumcised male will be cut off from his people. He has broken My covenant.\"","teach":"<b>Law 3: the punishment for not doing the מילה is כרת</b>: <q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q>. Notice the same root כ-ר-ת as <q class=\"pq\">כָּרַת ה' אֶת־אַבְרָם בְּרִית</q>.","tip":"<b>דיני מילה, 3:</b> <q class=\"pq\">וְעָרֵל זָכָר אֲשֶׁר לֹא־יִמּוֹל אֶת־בְּשַׂר עׇרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q> <span class=\"cite\">(בראשית יז, יד)</span>."},{"v":["G17:15","G17:16"],"words":[{"he":"לֹא־תִקְרָא אֶת־שְׁמָהּ שָׂרָי","cons":"לא תקרא את שמה שרי","en":"don't call her שרי","ref":"G17:15"},{"he":"כִּי שָׂרָה שְׁמָהּ","cons":"כי שרה שמה","en":"for שרה is her name","ref":"G17:15"},{"he":"וּבֵרַכְתִּי אֹתָהּ","cons":"וברכתי אתה","en":"I will bless her","ref":"G17:16"},{"he":"וְגַם נָתַתִּי מִמֶּנָּה לְךָ בֵּן","cons":"וגם נתתי ממנה לך בן","en":"and I will also give you a son from her","ref":"G17:16"},{"he":"וְהָיְתָה לְגוֹיִם","cons":"והיתה לגוים","en":"she will become nations","ref":"G17:16"},{"he":"מַלְכֵי עַמִּים מִמֶּנָּה יִהְיוּ","cons":"מלכי עמים ממנה יהיו","en":"kings of peoples will come from her","ref":"G17:16"}],"says":"\"Your wife will no longer be called שרי. Her name is שרה. I will bless her and give you a son from her. Nations and kings will come from her.\"","teach":"Second name change: <b>שרי → שרה</b>. Kings will come from her too: <q class=\"pq\">מַלְכֵי עַמִּים מִמֶּנָּה יִהְיוּ</q>. The son will be <b>from Sarah</b>: <q class=\"pq\">נָתַתִּי מִמֶּנָּה לְךָ בֵּן</q>.","tip":"<q class=\"pq\">וְגַם נָתַתִּי מִמֶּנָּה לְךָ בֵּן</q> <span class=\"cite\">(בראשית יז, טז)</span>."},{"v":["G17:17"],"words":[{"he":"וַיִּצְחָק","cons":"ויצחק","en":"and he laughed","ref":"G17:17"},{"he":"וַיֹּאמֶר בְּלִבּוֹ","cons":"ויאמר בלבו","en":"and he said in his heart (to himself)","ref":"G17:17"},{"he":"הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד","cons":"הלבן מאה שנה יולד","en":"can a child be born to a 100-year-old man?","ref":"G17:17"},{"he":"וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד","cons":"ואם שרה הבת תשעים שנה תלד","en":"and can Sarah, at 90, give birth?","ref":"G17:17"}],"says":"Avraham bows, laughs, and says to himself: \"Can a 100-year-old man have a child? Can Sarah give birth at 90?\"","teach":"<b>Why he laughs:</b> it is hard to believe they could have a son <b>at their age</b>. The pasuk says it: <q class=\"pq\">הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד</q>. He says it <q class=\"pq\">בְּלִבּוֹ</q>, only to himself.","tip":"<q class=\"pq\">וַיִּצְחָק וַיֹּאמֶר בְּלִבּוֹ הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד</q> <span class=\"cite\">(בראשית יז, יז)</span>."},{"check":{"t":"mc","q":"Why did Avraham laugh?","o":["Because it was hard to believe a son could be born n":"as for ישמעאל, I have heard you","ref":"G17:20"},{"he":"בֵּרַכְתִּי אֹתוֹ","cons":"ברכתי אתו","en":"I have blessed him","ref":"G17:20"},{"he":"שְׁנֵים־עָשָׂר נְשִׂיאִם יוֹלִיד","cons":"שנים עשר נשיאם יוליד","en":"he will father 12 princes","ref":"G17:20"},{"he":"וּנְתַתִּיו לְגוֹי גָּדוֹל","cons":"ונתתיו לגוי גדול","en":"I will make him a great nation","ref":"G17:20"},{"he":"וְאֶת־בְּרִיתִי אָקִים אֶת־יִצְחָק","cons":"ואת בריתי אקים את יצחק","en":"but My covenant I will establish with יצחק","ref":"G17:21"},{"he":"לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת","cons":"למועד הזה בשנה האחרת","en":"at this time next year","ref":"G17:21"}],"says":"\"About ישמעאל, I heard you. I've blessed him: he will have 12 princes and become a great nation. But My covenant will be with יצחק, whom Sarah will bear at this time next year.\"","teach":"ישמעאל gets a <b>blessing</b> and becomes a <b>גוי גדול</b>, but the <b>ברית</b> goes through <b>יצחק</b>.","tip":"<q class=\"pq\">וּנְתַתִּיו לְגוֹי גָּדוֹל</q> <span class=\"cite\">(בראשית יז, כ)</span> / <q class=\"pq\">וְאֶת־בְּרִיתִי אָקִים אֶת־יִצְחָק</q> <span class=\"cite\">(בראשית יז, כא)</span>."},{"check":{"t":"mc","q":"What did ה' promise about ישמעאל?","o":["He'll be blessed, have 12 princes, and be a great nation; but the ברית is with יצחק","The ברית will be with him","He will not be blessed at all","He will be a king over יצחק"],"why":"<q class=\"pq\">שְׁנֵים־עָשָׂר נְשִׂיאִם יוֹלִיד וּנְתַתִּיו לְגוֹי גָּדוֹל</q> but <q class=\"pq\">וְאֶת־בְּרִיתִי אָקִים אֶת־יִצְחָק</q>.","proof":"<q class=\"pq\">וְאֶת־בְּרִיתִי אָקִים אֶת־יִצְחָק</q> <span class=\"cite\">(בראשית יז, כא)</span>","alt":{"t":"mc","q":"Who said <span class=\"he\">לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ</span>?","o":["Avraham, to ה'","Sarah, to Avraham","ה', to Avraham","ישמעאל"],"why":"<q class=\"pq\">וַיֹּאמֶר אַבְרָהָם אֶל־הָאֱלֹהִים</q>.","proof":"<q class=\"pq\">וַיֹּאמֶר אַבְרָהָם אֶל־הָאֱלֹהִים לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ</q> <span class=\"cite\">(בראשית יז, יח)</span>"}}},{"v":["G17:22","G17:23"],"words":[{"he":"וַיְכַל לְדַבֵּר אִתּוֹ","cons":"ויכל לדבר אתו","en":"He finished speaking with him","ref":"G17:22"},{"he":"וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָם","cons":"ויעל אלהים מעל אברהם","en":"God went up from Avraham","ref":"G17:22"},{"he":"כׇּל־יְלִידֵי בֵיתוֹ","cons":"כל ילידי ביתו","en":"all those born in his house","ref":"G17:23"},{"he":"כׇּל־מִקְנַת כַּסְפּוֹ","cons":"כל מקנת כספו","en":"all those bought with his money","ref":"G17:23"},{"he":"וַיָּמׇל","cons":"וימל","en":"he circumcised","ref":"G17:23"},{"he":"בְּעֶצֶם הַיּוֹם הַזֶּה","cons":"בעצם היום הזה","en":"on that very same day","ref":"G17:23"},{"he":"כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים","cons":"כאשר דבר אתו אלהים","en":"just as God had told him","ref":"G17:23"}],"says":"When ה' finished speaking, Avraham took ישמעאל, everyone born in his house and everyone he had bought, every male, and circumcised them <b>that same day</b>, as God had told him.","teach":"<b>He obeys immediately:</b> <q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה</q>. Compare פרק יב: <q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q>, and here: <q class=\"pq\">כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים</q>. Same quick obedience.","tip":"<b>מי עשה? מתי?</b> <q class=\"pq\">וַיָּמׇל אֶת־בְּשַׂר עׇרְלָתָם בְּעֶצֶם הַיּוֹם הַזֶּה כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים</q> <span class=\"cite\">(בראשית יז, כג)</span>."},{"v":["G17:24","G17:25"],"words":[{"he":"בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה","cons":"בן תשעים ותשע שנה","en":"99 years old","ref":"G17:24"},{"he":"בְּהִמֹּלוֹ","cons":"בהמלו","en":"when he was circumcised","ref":"G17:24"},{"he":"בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה","cons":"בן שלש עשרה שנה","en":"13 years old","ref":"G17:25"}],"says":"Avraham was 99 when he was circumcised. ישמעאל his son was 13.","teach":"Know the two ages: <b>Avraham 99, ישמעאל 13</b>.","tip":"<q class=\"pq\">וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה בְּהִמֹּלוֹ</q> <span class=\"cite\">(בראשית יז, כד)</span> / <q class=\"pq\">וְיִשְׁמָעֵאל בְּנוֹ בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה</q> <span class=\"cite\">(בראשית יז, כה)</span>."},{"v":["G17:26","G17:27"],"words":[{"he":"בְּעֶצֶם הַיּוֹם הַזֶּה","cons":"בעצם היום הזה","en":"on that very day","ref":"G17:26"},{"he":"נִמּוֹל","cons":"נמול","en":"was circumcised","ref":"G17:26"},{"he":"וְכׇל־אַנְשֵׁי בֵיתוֹ","cons":"וכל אנשי ביתו","en":"and all the men of his household","ref":"G17:27"},{"he":"נִמֹּלוּ אִתּוֹ","cons":"נמלו אתו","en":"were circumcised with him","ref":"G17:27"}],"says":"On that same day Avraham and ישמעאל were circumcised, and all the men of his household with him.","teach":"The chapter ends by repeating: it was done <b>on that very day</b>, by <b>everyone</b>.","tip":"<q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנוֹ</q> <span class=\"cite\">(בראשית יז, כו)</span>."},{"check":{"t":"order","q":"Put the events of פרק יז in order:","items":["ה' appears to אברם at 99","Name change: אברם → אברהם","The command: every male must be circumcised","Name change: שרי → שרה, promise of a son","Avraham laughs","Avraham asks for ישמעאל","Avraham circumcises everyone that same day"],"why":"א → ה → י → טו–טז → יז → יח → כג."}},{"type":"compare","title":"The laws of ברית מילה (דיני ברית מילה)","cols":["Law","Pasuk"],"rows":[["1. Every male must be circumcised","<q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q> (י)"],["2. At 8 days old","<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר</q> (יב)"],["3. Not circumcised → כרת","<q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q> (יד)"],["4. The מילה = removing the ערלה","<q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q> (יא)"],["5. Also servants: born in the house or bought","<q class=\"pq\">יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף</q> (יב), <q class=\"pq\">הִמּוֹל יִמּוֹל</q> (יג)"],["6. For all generations, forever","<q class=\"pq\">לְדֹרֹתֵיכֶם</q> (יב), <q class=\"pq\">לִבְרִית עוֹלָם</q> (יג)"]]},{"type":"compare","title":"ברית בין הבתרים vs. ברית מילה","wide":true,"cols":["","מי?","למה? (what is promised)","מה הסמלים?","מתי?","What Avraham must do"],"rows":[["<b>ברית בין הבתרים</b> (טו)","ה' and אברם, for his descendants: <q class=\"pq\">כָּרַת ה' אֶת־אַבְרָם בְּרִית</q>","Answer to <q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q>: the land for his descendants, after 400 years of slavery","cut animals; birds not cut (Israel forever); עיט (Egypt); <q class=\"pq\">תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ</q> (making the ברית)","Before he had children, at sunset, in the dark: <q class=\"pq\">וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה</q>","Bring animals, cut them in half, chase away the עיט"],["<b>ברית מילה</b> (יז)","ה' and Avraham and all his descendants, every male: <q class=\"pq\">בֵּינִי וּבֵינֶךָ וּבֵין זַרְעֲךָ אַחֲרֶיךָ</q>","<q class=\"pq\">לִבְרִית עוֹלָם לִהְיוֹת לְךָ לֵאלֹהִים</q>; the land (<q class=\"pq\">לַאֲחֻזַּת עוֹלָם</q>); אב המון גוים; kings; a son יצחק","The מילה itself is the sign: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q>; it's in the body, forever. New names: אברהם, שרה","Age 99: <q class=\"pq\">בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q>; done that very day","<q class=\"pq\">הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים</q>; circumcise every male (and keep doing it for all generations)"]],"note":"<b>Similar:</b> both are ה''s ברית with Avraham, both promise the land to his descendants (<q class=\"pq\">לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q> / <q class=\"pq\">וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ</q>).<br><b>Different:</b> in טו Avraham only watches and ה' passes between the pieces. In יז Avraham has a mitzva to <b>do</b>, forever, and the sign is in the body."}],"cheat":{"facts":["מתי: age 99 (<q class=\"pq\">בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q>). ה': <q class=\"pq\">הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים</q>.","אברם → אברהם <q class=\"pq\">כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ</q>. שרי → שרה.","Promises: many nations, kings (<q class=\"pq\">וּמְלָכִים מִמְּךָ יֵצֵאוּ</q>), <q class=\"pq\">לִבְרִית עוֹלָם</q>, <q class=\"pq\">לִהְיוֹת לְךָ לֵאלֹהִים</q>, all כנען <q class=\"pq\">לַאֲחֻזַּת עוֹלָם</q>, a son from Sarah: יצחק.","Laws: כל זכר / 8 days / servants too / כרת for not doing it / the מילה = removing the ערלה.","Symbol: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q>. The covenant is in the body: <q class=\"pq\">בִּבְשַׂרְכֶם לִבְרִית עוֹלָם</q>.","Avraham laughs: <q class=\"pq\">הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד</q>. Asks: <q class=\"pq\">לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ</q>.","ישמעאל: blessed, 12 princes, גוי גדול. But the ברית is with יצחק, born next year.","Done <q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה</q>: Avraham 99, ישמעאל 13, all the men of his household."],"must":["G17:1","G17:5","G17:10","G17:11","G17:12","G17:14","G17:17","G17:19","G17:23"]},"quiz":[{"lv":1,"t":"mc","q":"What does <span class=\"he\">עׇרְלַתְכֶם</span> mean? (from the word ערלה)","o":["foreskin (what is removed in the מילה)","a sign","a servant","a generation"],"why":"ערלה = foreskin. The מילה removes it: <q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q>.","proof":"<q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">לְאוֹת</span> mean in <span class=\"he\">לְאוֹת בְּרִית</span>?","o":["a sign","a letter of the alphabet","a promise","a punishment"],"why":"אות = sign. The מילה is the sign of the ברית.","proof":"<q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q> <span class=\"cite\">(בראשית יז, יא)</span>"}},{"lv":1,"t":"mc","q":"What does <span class=\"he\">יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף</span> mean?","o":["a servant born in the house, and one bought with money","a son and a daughter","a house and money","a foreigner and a guest"],"why":"יליד בית = born in the house. מקנת כסף = bought with money. Both must be circumcised.","proof":"<q class=\"pq\">יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף</q> <span class=\"cite\">(בראשית יז, יב)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">כָּרַת</span> (<span class=\"he\">וְנִכְרְתָה הַנֶּפֶשׁ</span>) mean?","o":["being cut off from his people (a punishment)","making a covenant","circumcision","a reward"],"why":"<q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q> = that person will be cut off from his people.","proof":"<q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q> <span class=\"cite\">(בראשית יז, יד)</span>"}},{"lv":1,"t":"mc","q":"How old was ישמעאל when he was circumcised?","o":["13","8 days","99","12"],"why":"<q class=\"pq\">בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה</q>.","proof":"<q class=\"pq\">וְיִשְׁמָעֵאל בְּנוֹ בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה</q> <span class=\"cite\">(בראשית יז, כה)</span>","alt":{"t":"mc","q":"How old was Avraham when he was circumcised?","o":["99","100","75","90"],"why":"<q class=\"pq\">בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה</q>.","proof":"<q class=\"pq\">וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה בְּהִמֹּלוֹ בְּשַׂר עׇרְלָתוֹ</q> <span class=\"cite\">(בראשית יז, כד)</span>"}},{"lv":1,"t":"mc","q":"What will the son's name be?","o":["יצחק","ישמעאל","יעקב","אליעזר"],"why":"<q class=\"pq\">וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק</q>.","proof":"<q class=\"pq\">וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק</q> <span class=\"cite\">(בראשית יז, יט)</span>"},{"lv":1,"t":"mc","q":"When did Avraham circumcise his household?","o":["that very same day (בעצם היום הזה)","the next morning","after 8 days","a year later"],"why":"<q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה</q>.","proof":"<q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים</q> <span class=\"cite\">(בראשית יז, כג)</span>"},{"lv":2,"t":"mc","q":"Which pasuk shows the SYMBOL of ברית מילה?","o":["<q class=\"pq\">וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם</q>","<q class=\"pq\">וְהָיָה שִׁמְךָ אַבְרָהָם</q>","<q class=\"pq\">וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו וַיִּצְחָק</q>","<q class=\"pq\">וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָם</q>"],"why":"אות = sign/symbol.","proof":"<q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>","alt":{"t":"mc","q":"Which pasuk shows the punishment for not doing the מילה?","o":["<q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q>","<q class=\"pq\">הִמּוֹל יִמּוֹל יְלִיד בֵּיתְךָ</q>","<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל</q>","<q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q>"],"why":"כרת = cut off.","proof":"<q class=\"pq\">וְעָרֵל זָכָר אֲשֶׁר לֹא־יִמּוֹל אֶת־בְּשַׂר עׇרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ אֶת־בְּרִיתִי הֵפַר</q> <span class=\"cite\">(בראשית יז, יד)</span>"}},{"lv":2,"t":"fill","ref":"G17:12","blank":"שמנת","mean":"eight","why":"<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים</q>: at eight days old.","before":"וּבֶן־","answer":"שְׁמֹנַת","after":" יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר לְדֹרֹתֵיכֶם יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מִכֹּל בֶּן־נֵכָר אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא","cite":"בראשית יז, יב","ansCons":"שמנת","others":["וּבֶן","יָמִים","יִמּוֹל","לָכֶם","זָכָר","לְדֹרֹתֵיכֶם","יְלִיד","בָּיִת","וּמִקְנַת","כֶּסֶף","מִכֹּל","נֵכָר","אֲשֶׁר","מִזַּרְעֲךָ","הוּא׃"]},{"lv":2,"t":"fill","ref":"G17:11","blank":"לאות","mean":"as a sign","why":"<q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q>.","before":"וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם וְהָיָה ","answer":"לְאוֹת","after":" בְּרִית בֵּינִי וּבֵינֵיכֶם","cite":"בראשית יז, יא","ansCons":"לאות","others":["וּנְמַלְתֶּם","בְּשַׂר","עׇרְלַתְכֶם","וְהָיָה","בְּרִית","בֵּינִי","וּבֵינֵיכֶם׃"]},{"lv":2,"t":"fill","ref":"G17:5","blank":"אברהם","mean":"the new name","why":"<q class=\"pq\">וְהָיָה שִׁמְךָ אַבְרָהָם</q>.","before":"וְלֹא־יִקָּרֵא עוֹד אֶת־שִׁמְךָ אַבְרָם וְהָיָה שִׁמְךָ ","answer":"אַבְרָהָם","after":" כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ","cite":"בראשית יז, ה","ansCons":"אברהם","others":["וְלֹא","יִקָּרֵא","עוֹד","שִׁמְךָ","אַבְרָם","וְהָיָה","שִׁמְךָ","הֲמוֹן","גּוֹיִם","נְתַתִּיךָ׃"]},{"lv":2,"t":"mc","q":"Which is a difference between ברית מילה and ברית בין הבתרים?","o":["In ברית מילה Avraham has a mitzva to do forever, with a sign in the body","Only ברית מילה promises the land","Only ברית בין הבתרים is with Avraham's descendants","In ברית מילה animals are cut"],"why":"Both promise the land. In פרק יז the sign is the מילה: <q class=\"pq\">וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם</q>.","proof":"<q class=\"pq\">וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם</q> <span class=\"cite\">(בראשית יז, יג)</span>"},{"lv":3,"t":"open","q":"פרט את דיני ברית המילה. הבא פסוק לכל דין.","en":"List the laws of brit mila with a pasuk for each.","model":"1. חובה למול כל זכר: <q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, י)</span>.<br>2. בגיל שמונה ימים: <q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר לְדֹרֹתֵיכֶם</q> <span class=\"cite\">(בראשית יז, יב)</span>.<br>3. גם עבדים, יליד בית ומקנת כסף: <q class=\"pq\">יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף</q> <span class=\"cite\">(בראשית יז, יב)</span>.<br>4. המילה היא הסרת הערלה: <q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>.<br>5. מי שלא נימול נענש בכרת: <q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q> <span class=\"cite\">(בראשית יז, יד)</span>.","check":["כל זכר","8 days","servants: יליד בית + מקנת כסף","removing the ערלה","כרת","a pasuk for each"]},{"lv":3,"t":"open","q":"ברית מילה: מי עשה? מתי? מה עושים? מה הסמל?","en":"Who did it, when, what is done, what is the symbol?","model":"מי עשה: אברהם מל את עצמו, את ישמעאל בנו ואת כל הזכרים בביתו: <q class=\"pq\">וַיִּקַּח אַבְרָהָם אֶת־יִשְׁמָעֵאל בְּנוֹ וְאֵת כׇּל־יְלִידֵי בֵיתוֹ וְאֵת כׇּל־מִקְנַת כַּסְפּוֹ</q> <span class=\"cite\">(בראשית יז, כג)</span>.<br>מתי: כשאברהם היה בן 99, ובאותו היום שה' ציווה: <q class=\"pq\">וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה</q> <span class=\"cite\">(בראשית יז, כד)</span>, <q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנוֹ</q> <span class=\"cite\">(בראשית יז, כו)</span>. לדורות: בגיל 8 ימים.<br>מה עושים: מסירים את הערלה: <q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>.<br>הסמל: המילה היא אות לברית בין ה' לעם ישראל, בגוף, לתמיד: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>, <q class=\"pq\">וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם</q> <span class=\"cite\">(בראשית יז, יג)</span>.","check":["Who: Avraham + ישמעאל + all males of the house","When: age 99, that same day (and 8 days for the generations)","What: removing the ערלה","Symbol: אות ברית, in the body, forever"]},{"lv":3,"t":"open","q":"השווה בין ברית בין הבתרים לברית מילה: ציין דבר אחד דומה ושני דברים שונים. הבא פסוקים.","en":"Compare: one similarity, two differences.","model":"דומה: בשתי הבריתות ה' מבטיח את הארץ לצאצאי אברהם: <q class=\"pq\">לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית טו, יח)</span> וגם <q class=\"pq\">וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ אֵת אֶרֶץ מְגֻרֶיךָ</q> <span class=\"cite\">(בראשית יז, ח)</span>.<br>שונה 1: בברית בין הבתרים הסמלים הם חיות חתוכות ותנור עשן ולפיד אש: <q class=\"pq\">וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה</q> <span class=\"cite\">(בראשית טו, יז)</span>. בברית מילה הסמל הוא המילה בגוף: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q> <span class=\"cite\">(בראשית יז, יא)</span>.<br>שונה 2: בברית בין הבתרים אברהם לא צריך לקיים מצווה לדורות. בברית מילה הוא וכל צאצאיו צריכים למול לדורות: <q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, י)</span>.<br>שונה 3: מתי: בברית בין הבתרים עוד לא היו לו ילדים. בברית מילה הוא בן 99: <q class=\"pq\">וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q> <span class=\"cite\">(בראשית יז, א)</span>.","check":["Similarity with a pasuk from each chapter","Difference 1 with pesukim (symbols)","Difference 2 with pesukim (mitzva / when / who)"]},{"lv":3,"t":"open","q":"מה הייתה התגובה של אברהם להבטחת הבן משרה, ומה ענה לו ה'?","en":"Avraham's reaction to the promise of a son from Sarah and ה''s answer.","model":"אברהם צחק, כי היה לו קשה להאמין שיוולד להם בן בגילם: <q class=\"pq\">וַיִּצְחָק וַיֹּאמֶר בְּלִבּוֹ הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד</q> <span class=\"cite\">(בראשית יז, יז)</span>. הוא ביקש: <q class=\"pq\">לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ</q> <span class=\"cite\">(בראשית יז, יח)</span>. ה' ענה ששרה תלד בן בשם יצחק והברית תמשיך דרכו: <q class=\"pq\">אֲבָל שָׂרָה אִשְׁתְּךָ יֹלֶדֶת לְךָ בֵּן וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ</q> <span class=\"cite\">(בראשית יז, יט)</span>. גם ישמעאל יתברך ויהיה לגוי גדול: <q class=\"pq\">וּנְתַתִּיו לְגוֹי גָּדוֹל</q> <span class=\"cite\">(בראשית יז, כ)</span>.","check":["He laughed + why (age)","He asked about ישמעאל","ה': son יצחק from Sarah, ברית through him","ישמעאל also a great nation"]}],"who":[{"q":"<q class=\"pq\">הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים</q> <span class=\"cite\">(בראשית יז, א)</span>","a":"ה'","o":["אברהם","שרה","ישמעאל"],"ref":"G17:1"},{"q":"<q class=\"pq\">הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד</q> <span class=\"cite\">(בראשית יז, יז)</span>","a":"אברהם (בלבו)","o":["שרה","ה'","ישמעאל"],"ref":"G17:17"},{"q":"<q class=\"pq\">לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ</q> <span class=\"cite\">(בראשית יז, יח)</span>","a":"אברהם","o":["שרה","ה'","הגר"],"ref":"G17:18"},{"q":"<q class=\"pq\">וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק</q> <span class=\"cite\">(בראשית יז, יט)</span>","a":"ה'","o":["אברהם","שרה","ישמעאל"],"ref":"G17:19"},{"q":"<q class=\"pq\">וְהָיָה שִׁמְךָ אַבְרָהָם</q> <span class=\"cite\">(בראשית יז, ה)</span>","a":"ה'","o":["אברהם","שרה","מלאך"],"ref":"G17:5"}]},{"id":"yona","name":"יונה","full":"יונה (פרקים א, ג, ד)","ref":"יונה א; ג; ד","color":"#059669","icon":"🐋","intro":"ה' sends יונה to warn נינוה. יונה runs away to תרשיש. In a storm, the sailors pray and try to save everyone while יונה sleeps. They throw him into the sea. (פרק ב is not on the test: a big fish swallows יונה for 3 days and 3 nights.) Then יונה goes to נינוה, the people do teshuva and ה' forgives them. יונה is very angry. ה' teaches him with the קיקיון.","cards":[{"v":["J1:1","J1:2"],"words":[{"he":"דְּבַר־ה'","cons":"דבר ה'","en":"the word of ה'","ref":"J1:1"},{"he":"קוּם לֵךְ","cons":"קום לך","en":"get up, go","ref":"J1:2"},{"he":"אֶל־נִינְוֵה הָעִיר הַגְּדוֹלָה","cons":"אל נינוה העיר הגדולה","en":"to נינוה, the great city","ref":"J1:2"},{"he":"וּקְרָא עָלֶיהָ","cons":"וקרא עליה","en":"and call out against it (announce)","ref":"J1:2"},{"he":"כִּי־עָלְתָה רָעָתָם לְפָנָי","cons":"כי עלתה רעתם לפני","en":"because their wickedness has come up before Me","ref":"J1:2"}],"says":"ה' tells יונה: \"Get up, go to the great city נינוה and call out against it, because their wickedness has come up before Me.\"","teach":"The mission: warn נינוה. Remember the words <q class=\"pq\">קוּם לֵךְ</q>. They come back again and again in the book.","tip":"Pattern: <q class=\"pq\">קוּם לֵךְ אֶל־נִינְוֵה</q> <span class=\"cite\">(יונה א, ב)</span> (1:2)."},{"v":["J1:3"],"words":[{"he":"וַיָּקׇם יוֹנָה לִבְרֹחַ","cons":"ויקם יונה לברח","en":"יונה got up to run away","ref":"J1:3"},{"he":"תַּרְשִׁישָׁה","cons":"תרשישה","en":"to תרשיש (far away, the opposite direction)","ref":"J1:3"},{"he":"מִלִּפְנֵי ה'","cons":"מלפני ה'","en":"from before ה' (away from ה')","ref":"J1:3"},{"he":"וַיֵּרֶד יָפוֹ","cons":"וירד יפו","en":"he went down to יפו","ref":"J1:3"},{"he":"אֳנִיָּה","cons":"אניה","en":"a ship","ref":"J1:3"},{"he":"וַיִּתֵּן שְׂכָרָהּ","cons":"ויתן שכרה","en":"he paid its fare","ref":"J1:3"},{"he":"וַיֵּרֶד בָּהּ","cons":"וירד בה","en":"and went down into it","ref":"J1:3"}],"says":"יונה gets up, but to <b>run away</b> to תרשיש, away from ה'. He goes down to יפו, finds a ship, pays, and goes down into it.","teach":"<b>ה' said</b> <q class=\"pq\">קוּם לֵךְ</q>, and <b>יונה</b> <q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ</q>: he \"gets up\", but to run away. The pasuk says twice <q class=\"pq\">מִלִּפְנֵי ה'</q>. He is running from ה'. Count the \"going down\" (י-ר-ד): <q class=\"pq\">וַיֵּרֶד יָפוֹ</q>, <q class=\"pq\">וַיֵּרֶד בָּהּ</q>.","tip":"<b>יונה לא רצה ללכת</b>: <q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי ה'</q> <span class=\"cite\">(יונה א, ג)</span>."},{"type":"note","title":"Why didn't יונה want to go to נינוה?","html":"<p><b>The reason יונה himself gives (פרק ד, פס' ב):</b> he knew ה' is merciful and would forgive them:<br><q class=\"pq\">עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה</q> <span class=\"cite\">(יונה ד, ב)</span></p>\n<p><b>From class (my teacher's 4 reasons):</b></p><ol><li>He didn't think they would listen to him.</li><li>He didn't believe they would really do teshuva.</li><li>He didn't think they deserved ה''s mercy.</li><li>He knew that if נינוה did teshuva, it would look bad for Israel, because Israel had not done teshuva.</li></ol>\n<p class=\"note\">On the test: give יונה's own reason with the quote from ד, ב, and add the class reasons.</p>"},{"check":{"t":"mc","q":"Where did יונה try to run away to?","o":["תרשיש","נינוה","יפו","מצרים"],"why":"<q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה</q>. יפו is the port he left from, not where he was going.","proof":"<q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי ה'</q> <span class=\"cite\">(יונה א, ג)</span>","alt":{"t":"mc","q":"From which port did the ship leave?","o":["יפו","תרשיש","נינוה","חרן"],"why":"<q class=\"pq\">וַיֵּרֶד יָפוֹ וַיִּמְצָא אֳנִיָּה</q>.","proof":"<q class=\"pq\">וַיֵּרֶד יָפוֹ וַיִּמְצָא אֳנִיָּה בָּאָה תַרְשִׁישׁ</q> <span class=\"cite\">(יונה א, ג)</span>"}}},{"v":["J1:4"],"words":[{"he":"וַה' הֵטִיל רוּחַ־גְּדוֹלָה","cons":"וה' הטיל רוח גדולה","en":"ה' hurled a great wind","ref":"J1:4"},{"he":"סַעַר־גָּדוֹל","cons":"סער גדול","en":"a great storm","ref":"J1:4"},{"he":"חִשְּׁבָה לְהִשָּׁבֵר","cons":"חשבה להשבר","en":"was about to break apart","ref":"J1:4"}],"says":"ה' throws a great wind onto the sea. A great storm starts and the ship is about to break apart.","teach":"ה' doesn't let יונה run away. The storm is ה''s answer to his escape.","tip":"<q class=\"pq\">וַה' הֵטִיל רוּחַ־גְּדוֹלָה אֶל־הַיָּם וַיְהִי סַעַר־גָּדוֹל בַּיָּם</q> <span class=\"cite\">(יונה א, ד)</span>."},{"v":["J1:5"],"words":[{"he":"וַיִּירְאוּ הַמַּלָּחִים","cons":"וייראו המלחים","en":"the sailors were afraid","ref":"J1:5"},{"he":"וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו","cons":"ויזעקו איש אל אלהיו","en":"each one cried out to his own god","ref":"J1:5"},{"he":"וַיָּטִלוּ אֶת־הַכֵּלִים","cons":"ויטלו את הכלים","en":"they threw the cargo (the things)","ref":"J1:5"},{"he":"לְהָקֵל מֵעֲלֵיהֶם","cons":"להקל מעליהם","en":"to make it lighter for them","ref":"J1:5"},{"he":"יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה","cons":"ירד אל ירכתי הספינה","en":"went down into the bottom (inner part) of the ship","ref":"J1:5"},{"he":"וַיִּשְׁכַּב","cons":"וישכב","en":"and lay down","ref":"J1:5"},{"he":"וַיֵּרָדַם","cons":"וירדם","en":"and fell into a deep sleep","ref":"J1:5"}],"says":"The sailors are afraid. Each one cries out to his god. They throw the cargo into the sea to lighten the ship. And יונה? He went down into the bottom of the ship, lay down, and fell fast asleep.","teach":"<b>The big contrast:</b> the sailors <b>pray and act</b> (ויזעקו, ויטלו). יונה goes <b>down and sleeps</b> (ירד, וישכב, וירדם). Even the word <q class=\"pq\">וַיֵּרָדַם</q> sounds like ירד, \"going down\".","tip":"<b>ההבדל בין המלחים ליונה</b>: <q class=\"pq\">וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו וַיָּטִלוּ אֶת־הַכֵּלִים</q> <span class=\"cite\">(יונה א, ה)</span> vs. <q class=\"pq\">וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם</q> <span class=\"cite\">(יונה א, ה)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">יַרְכְּתֵי הַסְּפִינָה</span> mean?","o":["the bottom (inner part) of the ship","the top deck of the ship","the sails","the captain's room"],"why":"ירכתי = the far, inner part. יונה went down, deep into the ship.","proof":"<q class=\"pq\">וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה</q> <span class=\"cite\">(יונה א, ה)</span>","alt":{"t":"mc","q":"What were the sailors doing while יונה slept?","o":["crying out to their gods and throwing cargo overboard","sleeping too","rowing to תרשיש","casting lots"],"why":"<q class=\"pq\">וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו וַיָּטִלוּ אֶת־הַכֵּלִים</q>. (The lots come later, in pasuk ז.)","proof":"<q class=\"pq\">וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו</q> <span class=\"cite\">(יונה א, ה)</span>"}}},{"v":["J1:6"],"words":[{"he":"רַב הַחֹבֵל","cons":"רב החבל","en":"the captain","ref":"J1:6"},{"he":"מַה־לְּךָ נִרְדָּם","cons":"מה לך נרדם","en":"how can you be sleeping?!","ref":"J1:6"},{"he":"קוּם קְרָא אֶל־אֱלֹהֶיךָ","cons":"קום קרא אל אלהיך","en":"get up, call out to your God","ref":"J1:6"},{"he":"אוּלַי","cons":"אולי","en":"maybe","ref":"J1:6"},{"he":"יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ","cons":"יתעשת האלהים לנו","en":"God will think of us (have mercy on us)","ref":"J1:6"},{"he":"וְלֹא נֹאבֵד","cons":"ולא נאבד","en":"and we will not die (be lost)","ref":"J1:6"}],"says":"The captain wakes יונה: \"How can you sleep?! Get up, call out to your God! Maybe God will think of us and we won't die.\"","teach":"The captain uses almost the same words ה' used: <q class=\"pq\">קוּם קְרָא</q> (ה' said <q class=\"pq\">קוּם לֵךְ … וּקְרָא</q>). The captain hopes: <q class=\"pq\">אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵד</q>. Later the king of נינוה says almost the same words.","tip":"\"Who said it\": <b>רב החובל</b>. <q class=\"pq\">מַה־לְּךָ נִרְדָּם קוּם קְרָא אֶל־אֱלֹהֶיךָ</q> <span class=\"cite\">(יונה א, ו)</span>."},{"v":["J1:7"],"words":[{"he":"לְכוּ וְנַפִּילָה גוֹרָלוֹת","cons":"לכו ונפילה גורלות","en":"come, let's cast lots","ref":"J1:7"},{"he":"וְנֵדְעָה","cons":"ונדעה","en":"so we will know","ref":"J1:7"},{"he":"בְּשֶׁלְּמִי הָרָעָה הַזֹּאת לָנוּ","cons":"בשלמי הרעה הזאת לנו","en":"because of whom this disaster has come on us","ref":"J1:7"},{"he":"וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה","cons":"ויפל הגורל על יונה","en":"the lot fell on יונה","ref":"J1:7"}],"says":"The sailors say: \"Let's cast lots to find out whose fault this disaster is.\" The lot falls on יונה.","teach":"The sailors try to <b>understand</b> why this is happening. The lot shows: <q class=\"pq\">וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה</q>.","tip":"<q class=\"pq\">וַיַּפִּלוּ גּוֹרָלוֹת וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה</q> <span class=\"cite\">(יונה א, ז)</span>."},{"check":{"t":"mc","q":"Who said <span class=\"he\">מַה־לְּךָ נִרְדָּם קוּם קְרָא אֶל־אֱלֹהֶיךָ</span>?","o":["רב החובל (the captain)","ה'","the king of נינוה","יונה"],"why":"<q class=\"pq\">וַיִּקְרַב אֵלָיו רַב הַחֹבֵל וַיֹּאמֶר לוֹ</q>.","proof":"<q class=\"pq\">וַיִּקְרַב אֵלָיו רַב הַחֹבֵל וַיֹּאמֶר לוֹ מַה־לְּךָ נִרְדָּם</q> <span class=\"cite\">(יונה א, ו)</span>","alt":{"t":"mc","q":"How did the sailors find out it was יונה's fault?","o":["They cast lots (גורלות)","יונה told them right away","ה' told them in a dream","The captain saw him sleeping"],"why":"<q class=\"pq\">וַיַּפִּלוּ גּוֹרָלוֹת וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה</q>.","proof":"<q class=\"pq\">וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה</q> <span class=\"cite\">(יונה א, ז)</span>"}}},{"v":["J1:8"],"words":[{"he":"הַגִּידָה־נָּא לָנוּ","cons":"הגידה נא לנו","en":"please tell us","ref":"J1:8"},{"he":"מַה־מְּלַאכְתְּךָ","cons":"מה מלאכתך","en":"what is your work?","ref":"J1:8"},{"he":"וּמֵאַיִן תָּבוֹא","cons":"ומאין תבוא","en":"where do you come from?","ref":"J1:8"},{"he":"וְאֵי־מִזֶּה עַם אָתָּה","cons":"ואי מזה עם אתה","en":"and from which people are you?","ref":"J1:8"}],"says":"They ask יונה a list of questions: why is this happening to us, what's your job, where are you from, what's your country, which people are you from?","teach":"The sailors don't attack him right away. They <b>ask</b> and try to understand.","tip":"Background for \"the sailors vs. יונה\"."},{"v":["J1:9"],"words":[{"he":"עִבְרִי אָנֹכִי","cons":"עברי אנכי","en":"I am a Hebrew","ref":"J1:9"},{"he":"וְאֶת־ה' אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא","cons":"ואת ה' אלהי השמים אני ירא","en":"and I fear ה', the God of heaven","ref":"J1:9"},{"he":"אֲשֶׁר־עָשָׂה אֶת־הַיָּם וְאֶת־הַיַּבָּשָׁה","cons":"אשר עשה את הים ואת היבשה","en":"who made the sea and the dry land","ref":"J1:9"}],"says":"יונה answers: \"I am a Hebrew, and I fear ה', the God of heaven, who made the sea and the dry land.\"","teach":"יונה <b>says</b> <q class=\"pq\">אֲנִי יָרֵא</q>, but he is <b>running away</b> from ה'. And he is running away by sea, while saying ה' made <q class=\"pq\">אֶת־הַיָּם</q>!","tip":"\"Who said it\": <b>יונה</b>. <q class=\"pq\">עִבְרִי אָנֹכִי וְאֶת־ה' אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא</q> <span class=\"cite\">(יונה א, ט)</span>."},{"v":["J1:10"],"words":[{"he":"וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה","cons":"וייראו האנשים יראה גדולה","en":"the men feared a great fear","ref":"J1:10"},{"he":"מַה־זֹּאת עָשִׂיתָ","cons":"מה זאת עשית","en":"what is this that you have done?","ref":"J1:10"},{"he":"כִּי־מִלִּפְנֵי ה' הוּא בֹרֵחַ","cons":"כי מלפני ה' הוא ברח","en":"that he was running away from ה'","ref":"J1:10"},{"he":"כִּי הִגִּיד לָהֶם","cons":"כי הגיד להם","en":"because he had told them","ref":"J1:10"}],"says":"The men become very afraid: \"What have you done?!\" They now know he is running from ה', because he told them.","teach":"<b>The fear grows:</b> <q class=\"pq\">וַיִּירְאוּ הַמַּלָּחִים</q> (5) → <q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה</q> (10). Now they're afraid because they understand <b>who</b> יונה is running from.","tip":"Pattern of the sailors' fear, step 2: <q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה</q> <span class=\"cite\">(יונה א, י)</span>."},{"check":{"t":"mc","q":"Who said <span class=\"he\">עִבְרִי אָנֹכִי</span>?","o":["יונה","רב החובל","the sailors","the king of נינוה"],"why":"<q class=\"pq\">וַיֹּאמֶר אֲלֵיהֶם עִבְרִי אָנֹכִי</q>. יונה answers the sailors' questions.","proof":"<q class=\"pq\">עִבְרִי אָנֹכִי וְאֶת־ה' אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא</q> <span class=\"cite\">(יונה א, ט)</span>","alt":{"t":"mc","q":"Which words show what is strange about יונה's answer in pasuk ט?","o":["He says <q class=\"pq\">אֲנִי יָרֵא</q> (I fear ה'), but he's running away from ה'","He says he is from נינוה","He refuses to answer","He says he is a sailor"],"why":"He says he fears ה' who made the sea, while running away from ה' on the sea.","proof":"<q class=\"pq\">כִּי־מִלִּפְנֵי ה' הוּא בֹרֵחַ</q> <span class=\"cite\">(יונה א, י)</span>"}}},{"v":["J1:11","J1:12"],"words":[{"he":"מַה־נַּעֲשֶׂה לָּךְ","cons":"מה נעשה לך","en":"what shall we do to you?","ref":"J1:11"},{"he":"וְיִשְׁתֹּק הַיָּם מֵעָלֵינוּ","cons":"וישתק הים מעלינו","en":"so the sea will calm down for us","ref":"J1:11"},{"he":"הוֹלֵךְ וְסֹעֵר","cons":"הולך וסער","en":"getting stormier and stormier","ref":"J1:11"},{"he":"שָׂאוּנִי","cons":"שאוני","en":"pick me up","ref":"J1:12"},{"he":"וַהֲטִילֻנִי אֶל־הַיָּם","cons":"והטילני אל הים","en":"and throw me into the sea","ref":"J1:12"},{"he":"כִּי בְשֶׁלִּי","cons":"כי בשלי","en":"because it is because of me","ref":"J1:12"}],"says":"\"What should we do with you so the sea calms down?\" The sea keeps getting stormier. יונה says: \"Pick me up and throw me into the sea, and it will calm down. I know this storm is because of me.\"","teach":"<b>What יונה did do:</b> he admits the truth (<q class=\"pq\">כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה</q>) and takes responsibility. <b>What he didn't do:</b> he still doesn't pray, and doesn't agree to go to נינוה.","tip":"<b>What יונה did:</b> <q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם</q> <span class=\"cite\">(יונה א, יב)</span> + <q class=\"pq\">כִּי יוֹדֵעַ אָנִי כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה עֲלֵיכֶם</q> <span class=\"cite\">(יונה א, יב)</span>."},{"v":["J1:13"],"words":[{"he":"וַיַּחְתְּרוּ הָאֲנָשִׁים","cons":"ויחתרו האנשים","en":"the men rowed hard","ref":"J1:13"},{"he":"לְהָשִׁיב אֶל־הַיַּבָּשָׁה","cons":"להשיב אל היבשה","en":"to get back to dry land","ref":"J1:13"},{"he":"וְלֹא יָכֹלוּ","cons":"ולא יכלו","en":"but they could not","ref":"J1:13"}],"says":"The men row hard to get back to land so they don't have to throw him in, but they can't. The sea keeps storming.","teach":"The sailors <b>try to save יונה</b>, the one who caused their trouble. They don't want to hurt him.","tip":"The sailors vs. יונה: <q class=\"pq\">וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה וְלֹא יָכֹלוּ</q> <span class=\"cite\">(יונה א, יג)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">וַיַּחְתְּרוּ</span> mean?","o":["they rowed hard","they prayed","they were afraid","they cast lots"],"why":"ויחתרו = they rowed with all their strength, trying to get back to dry land.","proof":"<q class=\"pq\">וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה</q> <span class=\"cite\">(יונה א, יג)</span>","alt":{"t":"mc","q":"What did יונה tell the sailors to do?","o":["Pick him up and throw him into the sea","Row back to יפו","Pray to their gods","Throw the cargo into the sea"],"why":"<q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם</q>.","proof":"<q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם</q> <span class=\"cite\">(יונה א, יב)</span>"}}},{"v":["J1:14"],"words":[{"he":"וַיִּקְרְאוּ אֶל־ה'","cons":"ויקראו אל ה'","en":"they called out to ה'","ref":"J1:14"},{"he":"אָנָּה ה'","cons":"אנה ה'","en":"please, ה'","ref":"J1:14"},{"he":"אַל־נָא נֹאבְדָה","cons":"אל נא נאבדה","en":"please don't let us die","ref":"J1:14"},{"he":"בְּנֶפֶשׁ הָאִישׁ הַזֶּה","cons":"בנפש האיש הזה","en":"because of this man's life","ref":"J1:14"},{"he":"וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא","cons":"ואל תתן עלינו דם נקיא","en":"and don't put innocent blood on us","ref":"J1:14"},{"he":"כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ","cons":"כאשר חפצת עשית","en":"You have done as You wished","ref":"J1:14"}],"says":"Now the sailors pray to <b>ה'</b>: \"Please don't let us die because of this man, and don't blame us for innocent blood. You, ה', have done what You wanted.\"","teach":"The sailors now pray to <b>ה'</b> (not to their own gods like in pasuk ה). They care about not harming even יונה.","tip":"<q class=\"pq\">וַיִּקְרְאוּ אֶל־ה' וַיֹּאמְרוּ אָנָּה ה' אַל־נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה</q> <span class=\"cite\">(יונה א, יד)</span>."},{"v":["J1:15"],"words":[{"he":"וַיִּשְׂאוּ אֶת־יוֹנָה","cons":"וישאו את יונה","en":"they picked up יונה","ref":"J1:15"},{"he":"וַיְטִלֻהוּ אֶל־הַיָּם","cons":"ויטלהו אל הים","en":"and threw him into the sea","ref":"J1:15"},{"he":"וַיַּעֲמֹד הַיָּם מִזַּעְפּוֹ","cons":"ויעמד הים מזעפו","en":"the sea stopped its raging","ref":"J1:15"}],"says":"They pick up יונה and throw him into the sea, and the sea stops raging.","teach":"The moment יונה is thrown in, the storm stops. That proves it was all because of him.","tip":"<q class=\"pq\">וַיִּשְׂאוּ אֶת־יוֹנָה וַיְטִלֻהוּ אֶל־הַיָּם וַיַּעֲמֹד הַיָּם מִזַּעְפּוֹ</q> <span class=\"cite\">(יונה א, טו)</span>."},{"v":["J1:16"],"words":[{"he":"וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה'","cons":"וייראו האנשים יראה גדולה את ה'","en":"the men feared ה' with a great fear (awe)","ref":"J1:16"},{"he":"וַיִּזְבְּחוּ־זֶבַח","cons":"ויזבחו זבח","en":"they offered a sacrifice","ref":"J1:16"},{"he":"וַיִּדְּרוּ נְדָרִים","cons":"וידרו נדרים","en":"and made vows","ref":"J1:16"}],"says":"The men feared ה' greatly, offered a sacrifice to ה' and made vows.","teach":"<b>The end of the fear pattern:</b> now it's <q class=\"pq\">יִרְאָה גְדוֹלָה אֶת־ה'</q>, awe of ה'. The sailors come to believe in ה', the ה' that יונה himself was running from.","tip":"<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח לַה' וַיִּדְּרוּ נְדָרִים</q> <span class=\"cite\">(יונה א, טז)</span>."},{"type":"note","title":"Between the chapters (פרק ב is NOT on your test)","html":"<p>In the sea, ה' sent a big fish that swallowed יונה, and he was inside it for <b>3 days and 3 nights</b>. Then the fish spat him out onto dry land.</p><p class=\"note\">That's all you need from פרק ב.</p>"},{"type":"pattern","title":"Pattern 1: יונה keeps going DOWN (י-ר-ד)","rows":[["<q class=\"pq\">וַיֵּרֶד יָפוֹ</q>","went down to יפו (1:3)"],["<q class=\"pq\">וַיֵּרֶד בָּהּ</q>","went down into the ship (1:3)"],["<q class=\"pq\">יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה</q>","went down to the bottom of the ship (1:5)"],["<q class=\"pq\">וַיֵּרָדַם</q>","fell into a deep sleep (1:5)"]],"note":"Each step takes him further down and away <q class=\"pq\">מִלִּפְנֵי ה'</q>. It ends in a deep sleep while everyone else is praying."},{"type":"pattern","title":"Pattern 2: The sailors' fear grows","rows":[["<q class=\"pq\">וַיִּירְאוּ הַמַּלָּחִים</q>","afraid of the storm (1:5)"],["<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה</q>","very afraid once they hear יונה is running from ה' (1:10)"],["<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה'</q>","awe of ה': they believe, bring a sacrifice, make vows (1:16)"]],"note":"Fear of the storm → fear of the situation → fear (awe) of ה'."},{"type":"compare","title":"יונה vs. the sailors","cols":["The sailors","יונה"],"rows":[["Pray, each to his god: <q class=\"pq\">וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו</q>","Doesn't pray. Even when the captain says <q class=\"pq\">קוּם קְרָא אֶל־אֱלֹהֶיךָ</q>"],["Act to save the ship: <q class=\"pq\">וַיָּטִלוּ אֶת־הַכֵּלִים</q>","Goes down and sleeps: <q class=\"pq\">וַיִּשְׁכַּב וַיֵּרָדַם</q>"],["Try to understand: cast lots, ask questions (ז–ח)","Says <q class=\"pq\">אֲנִי יָרֵא</q> but is running from ה'"],["Try to save יונה: <q class=\"pq\">וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה</q>","Admits it's his fault: <q class=\"pq\">כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה</q> and says <q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם</q>"],["Pray to ה' not to shed innocent blood (יד)","Doesn't ask ה' to forgive him and doesn't agree to go to נינוה"],["End: <q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח</q>","Is thrown into the sea"]],"note":"<b>What יונה did:</b> ran away, paid for the ship, went down and slept, told the truth, took responsibility.<br><b>What he did NOT do:</b> he didn't pray, didn't help save the ship, didn't do teshuva, didn't go to נינוה."},{"check":{"t":"mc","q":"Which pasuk shows the END of the sailors' fear pattern?","o":["<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה'</q>","<q class=\"pq\">וַיִּירְאוּ הַמַּלָּחִים</q>","<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה</q>","<q class=\"pq\">וְאֶת־ה' אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא</q>"],"why":"1:5 → 1:10 → 1:16. Only 1:16 adds \"את ה'\".","proof":"<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה'</q> <span class=\"cite\">(יונה א, טז)</span>","alt":{"t":"order","q":"Put the \"going down\" steps in order:","items":["<q class=\"pq\">וַיֵּרֶד יָפוֹ</q>","<q class=\"pq\">וַיֵּרֶד בָּהּ</q>","<q class=\"pq\">יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה</q>","<q class=\"pq\">וַיֵּרָדַם</q>"],"why":"All in 1:3 and 1:5: יפו → into the ship → bottom of the ship → deep sleep."}}},{"check":{"t":"order","q":"Put the events of פרק א in order:","items":["ה': קום לך אל נינוה","יונה goes down to יפו and boards a ship","ה' sends a great wind","The captain wakes יונה","The lot falls on יונה","The sailors row hard but can't","They throw יונה into the sea","The sailors sacrifice to ה'"],"why":"ב → ג → ד → ו → ז → יג → טו → טז."}},{"v":["J3:1","J3:2"],"words":[{"he":"שֵׁנִית","cons":"שנית","en":"a second time","ref":"J3:1"},{"he":"קוּם לֵךְ","cons":"קום לך","en":"get up, go","ref":"J3:2"},{"he":"וּקְרָא אֵלֶיהָ אֶת־הַקְּרִיאָה","cons":"וקרא אליה את הקריאה","en":"and call out to it the message","ref":"J3:2"},{"he":"אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ","cons":"אשר אנכי דבר אליך","en":"that I will tell you","ref":"J3:2"}],"says":"ה' speaks to יונה a <b>second time</b>: \"Get up, go to נינוה and announce the message I will tell you.\"","teach":"ה' gives יונה a <b>second chance</b>, with the same words: <q class=\"pq\">קוּם לֵךְ</q>.","tip":"<q class=\"pq\">וַיְהִי דְבַר־ה' אֶל־יוֹנָה שֵׁנִית לֵאמֹר</q> <span class=\"cite\">(יונה ג, א)</span>."},{"v":["J3:3"],"words":[{"he":"וַיָּקׇם יוֹנָה וַיֵּלֶךְ","cons":"ויקם יונה וילך","en":"יונה got up and went","ref":"J3:3"},{"he":"כִּדְבַר ה'","cons":"כדבר ה'","en":"as ה' had said","ref":"J3:3"},{"he":"עִיר־גְּדוֹלָה לֵאלֹהִים","cons":"עיר גדולה לאלהים","en":"a very great city (great \"to God\")","ref":"J3:3"},{"he":"מַהֲלַךְ שְׁלֹשֶׁת יָמִים","cons":"מהלך שלשת ימים","en":"a walk of three days","ref":"J3:3"}],"says":"This time יונה gets up and goes to נינוה, as ה' said. נינוה is huge: it takes three days to walk across.","teach":"<b>Pattern:</b> <q class=\"pq\">קוּם לֵךְ</q> (1:2) → <q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ</q> (1:3) → <q class=\"pq\">וַיָּקׇם יוֹנָה וַיֵּלֶךְ</q> (3:3). Now he obeys.","tip":"<q class=\"pq\">וַיָּקׇם יוֹנָה וַיֵּלֶךְ אֶל־נִינְוֵה כִּדְבַר ה'</q> <span class=\"cite\">(יונה ג, ג)</span>."},{"v":["J3:4"],"words":[{"he":"וַיָּחֶל","cons":"ויחל","en":"he began","ref":"J3:4"},{"he":"מַהֲלַךְ יוֹם אֶחָד","cons":"מהלך יום אחד","en":"a walk of one day","ref":"J3:4"},{"he":"עוֹד אַרְבָּעִים יוֹם","cons":"עוד ארבעים יום","en":"in another 40 days","ref":"J3:4"},{"he":"וְנִינְוֵה נֶהְפָּכֶת","cons":"ונינוה נהפכת","en":"נינוה will be overturned (destroyed)","ref":"J3:4"}],"says":"יונה walks one day into the city and announces: \"Forty more days, and נינוה will be overturned!\"","teach":"יונה's whole message is just <b>five words</b>. He doesn't say \"do teshuva\" and he doesn't mention ה'.","tip":"\"Who said it\": <b>יונה</b>. <q class=\"pq\">עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת</q> <span class=\"cite\">(יונה ג, ד)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">וְנִינְוֵה נֶהְפָּכֶת</span> mean?","o":["נינוה will be overturned (destroyed)","נינוה will do teshuva","נינוה will be forgiven","נינוה will become great"],"why":"נהפכת = overturned. That is the threat of destruction.","proof":"<q class=\"pq\">עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת</q> <span class=\"cite\">(יונה ג, ד)</span>","alt":{"t":"mc","q":"How many days did יונה say were left?","o":["40","3","7","120"],"why":"<q class=\"pq\">עוֹד אַרְבָּעִים יוֹם</q>.","proof":"<q class=\"pq\">עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת</q> <span class=\"cite\">(יונה ג, ד)</span>"}}},{"v":["J3:5"],"words":[{"he":"וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים","cons":"ויאמינו אנשי נינוה באלהים","en":"the people of נינוה believed in God","ref":"J3:5"},{"he":"וַיִּקְרְאוּ־צוֹם","cons":"ויקראו צום","en":"they declared a fast","ref":"J3:5"},{"he":"וַיִּלְבְּשׁוּ שַׂקִּים","cons":"וילבשו שקים","en":"they wore sackcloth","ref":"J3:5"},{"he":"מִגְּדוֹלָם וְעַד־קְטַנָּם","cons":"מגדולם ועד קטנם","en":"from the greatest to the smallest","ref":"J3:5"}],"says":"The people of נינוה believe God. They declare a fast and wear sackcloth, everyone from the most important to the least.","teach":"<b>What the PEOPLE did:</b> 1. believed: <q class=\"pq\">וַיַּאֲמִינוּ</q> 2. fasted: <q class=\"pq\">וַיִּקְרְאוּ־צוֹם</q> 3. wore שקים 4. everyone: <q class=\"pq\">מִגְּדוֹלָם וְעַד־קְטַנָּם</q>. This happens <b>before</b> the king's order.","tip":"<b>איך אנשי נינוה חזרו בתשובה</b>: <q class=\"pq\">וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים וַיִּקְרְאוּ־צוֹם וַיִּלְבְּשׁוּ שַׂקִּים מִגְּדוֹלָם וְעַד־קְטַנָּם</q> <span class=\"cite\">(יונה ג, ה)</span>."},{"v":["J3:6"],"words":[{"he":"וַיִּגַּע הַדָּבָר אֶל־מֶלֶךְ נִינְוֵה","cons":"ויגע הדבר אל מלך נינוה","en":"the news reached the king of נינוה","ref":"J3:6"},{"he":"וַיָּקׇם מִכִּסְאוֹ","cons":"ויקם מכסאו","en":"he got up from his throne","ref":"J3:6"},{"he":"וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו","cons":"ויעבר אדרתו מעליו","en":"he took off his royal robe","ref":"J3:6"},{"he":"וַיְכַס שַׂק","cons":"ויכס שק","en":"he covered himself in sackcloth","ref":"J3:6"},{"he":"וַיֵּשֶׁב עַל־הָאֵפֶר","cons":"וישב על האפר","en":"and sat on ashes (אפר)","ref":"J3:6"}],"says":"The news reaches the king. He gets up from his throne, takes off his royal robe, covers himself with sackcloth and sits on ashes.","teach":"<b>What the KING added (himself):</b> he gives up his royal honor: off the throne, off with the robe, and he <b>sits on ashes</b> (<q class=\"pq\">וַיֵּשֶׁב עַל־הָאֵפֶר</q>). The people didn't do this.","tip":"<b>What the king added</b>: <q class=\"pq\">וַיָּקׇם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל־הָאֵפֶר</q> <span class=\"cite\">(יונה ג, ו)</span>."},{"v":["J3:7"],"words":[{"he":"וַיַּזְעֵק","cons":"ויזעק","en":"he had it proclaimed","ref":"J3:7"},{"he":"מִטַּעַם הַמֶּלֶךְ וּגְדֹלָיו","cons":"מטעם המלך וגדליו","en":"by order of the king and his nobles","ref":"J3:7"},{"he":"הָאָדָם וְהַבְּהֵמָה","cons":"האדם והבהמה","en":"people and animals","ref":"J3:7"},{"he":"הַבָּקָר וְהַצֹּאן","cons":"הבקר והצאן","en":"cattle and sheep","ref":"J3:7"},{"he":"אַל־יִטְעֲמוּ מְאוּמָה","cons":"אל יטעמו מאומה","en":"must not taste anything","ref":"J3:7"},{"he":"אַל־יִרְעוּ","cons":"אל ירעו","en":"must not graze","ref":"J3:7"},{"he":"וּמַיִם אַל־יִשְׁתּוּ","cons":"ומים אל ישתו","en":"and must not drink water","ref":"J3:7"}],"says":"The king announces a decree: people and animals, cattle and sheep, must not eat anything, not graze, not drink water.","teach":"<b>The king adds:</b> even the <b>animals</b> must fast! (The people only had <q class=\"pq\">וַיִּקְרְאוּ־צוֹם</q>.) And the fast is stricter: no food <b>and no water</b>.","tip":"<q class=\"pq\">הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה אַל־יִרְעוּ וּמַיִם אַל־יִשְׁתּוּ</q> <span class=\"cite\">(יונה ג, ז)</span>."},{"check":{"t":"mc","q":"What did the KING add that the people hadn't done?","o":["Sitting on ashes, and making even the animals fast","Believing in God","Declaring a fast","Wearing sackcloth"],"why":"The people already believed, fasted and wore sackcloth (3:5). The king added <q class=\"pq\">וַיֵּשֶׁב עַל־הָאֵפֶר</q> and <q class=\"pq\">הָאָדָם וְהַבְּהֵמָה</q>.","proof":"<q class=\"pq\">הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה</q> <span class=\"cite\">(יונה ג, ז)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו</span> mean?","o":["he took off his royal robe","he left his palace","he passed by the city","he gave his robe to יונה"],"why":"אדרת = (royal) robe. ויעבר מעליו = took it off himself.","proof":"<q class=\"pq\">וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו</q> <span class=\"cite\">(יונה ג, ו)</span>"}}},{"v":["J3:8"],"words":[{"he":"וְיִתְכַּסּוּ שַׂקִּים הָאָדָם וְהַבְּהֵמָה","cons":"ויתכסו שקים האדם והבהמה","en":"people and animals must be covered in sackcloth","ref":"J3:8"},{"he":"וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחׇזְקָה","cons":"ויקראו אל אלהים בחזקה","en":"and call out to God with strength","ref":"J3:8"},{"he":"וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה","cons":"וישבו איש מדרכו הרעה","en":"and each one must turn back from his evil way","ref":"J3:8"},{"he":"וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם","cons":"ומן החמס אשר בכפיהם","en":"and from the violence (robbery) in their hands","ref":"J3:8"}],"says":"\"Let people and animals be covered in sackcloth, call out to God with all their strength, and each person must turn from his evil ways and from the violence in his hands.\"","teach":"<b>The most important thing the king added:</b> changing their <b>deeds</b>: <q class=\"pq\">וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם</q>. Not just fasting and sackcloth, but really stopping the evil. Also: <q class=\"pq\">בְּחׇזְקָה</q>, praying with strength.","tip":"<b>The key quote</b>: <q class=\"pq\">וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם</q> <span class=\"cite\">(יונה ג, ח)</span>."},{"v":["J3:9"],"words":[{"he":"מִי־יוֹדֵעַ","cons":"מי יודע","en":"who knows","ref":"J3:9"},{"he":"יָשׁוּב וְנִחַם הָאֱלֹהִים","cons":"ישוב ונחם האלהים","en":"God may turn back and change His mind","ref":"J3:9"},{"he":"וְשָׁב מֵחֲרוֹן אַפּוֹ","cons":"ושב מחרון אפו","en":"and turn away from His fierce anger","ref":"J3:9"},{"he":"וְלֹא נֹאבֵד","cons":"ולא נאבד","en":"and we will not die (be lost)","ref":"J3:9"}],"says":"\"Who knows? Maybe God will change His mind and turn from His anger, and we won't die.\"","teach":"<b>Pattern:</b> the captain: <q class=\"pq\">אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵד</q> (1:6). The king: <q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים … וְלֹא נֹאבֵד</q> (3:9). Both non-Jews hope, without being sure.","tip":"\"Who said it\": <b>the king of נינוה</b>. <q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵד</q> <span class=\"cite\">(יונה ג, ט)</span>."},{"v":["J3:10"],"words":[{"he":"וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם","cons":"וירא האלהים את מעשיהם","en":"God saw their deeds","ref":"J3:10"},{"he":"כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה","cons":"כי שבו מדרכם הרעה","en":"that they turned back from their evil way","ref":"J3:10"},{"he":"וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה","cons":"וינחם האלהים על הרעה","en":"God changed His mind about the evil (punishment)","ref":"J3:10"},{"he":"וְלֹא עָשָׂה","cons":"ולא עשה","en":"and He did not do it","ref":"J3:10"}],"says":"God saw what they <b>did</b>: that they turned from their evil ways. So He changed His mind about the punishment and didn't do it.","teach":"<b>What saved נינוה?</b> The pasuk doesn't say \"God saw their fast\" or \"their sackcloth\". It says <q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם</q>, God saw their <b>deeds</b>: <q class=\"pq\">כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה</q>. Real teshuva = changing what you do.<br><span class=\"note\">That's why we read יונה on יום כיפור: even someone who sinned can do teshuva. נינוה regretted, changed their ways, and ה' forgave them.</span>","tip":"Must-know: <q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה</q> <span class=\"cite\">(יונה ג, י)</span>."},{"check":{"t":"mc","q":"According to 3:10, what did God see?","o":["their deeds: that they turned from their evil way","their fast","their sackcloth","their sacrifices"],"why":"<q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה</q>: their DEEDS.","proof":"<q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם</q> <span class=\"cite\">(יונה ג, י)</span>","alt":{"t":"mc","q":"Who said <span class=\"he\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים</span>?","o":["the king of נינוה","רב החובל","יונה","the sailors"],"why":"It is part of the king's decree (3:7–9). The captain said the similar \"אולי… ולא נאבד\".","proof":"<q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים</q> <span class=\"cite\">(יונה ג, ט)</span>"}}},{"type":"compare","title":"The people of נינוה vs. what the KING added","cols":["The people (3:5)","The king added (3:6–9)"],"rows":[["Believed: <q class=\"pq\">וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים</q>","Got off his throne, took off his robe: <q class=\"pq\">וַיָּקׇם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו</q>"],["Fasted: <q class=\"pq\">וַיִּקְרְאוּ־צוֹם</q>","Sat on ashes: <q class=\"pq\">וַיֵּשֶׁב עַל־הָאֵפֶר</q>"],["Wore sackcloth: <q class=\"pq\">וַיִּלְבְּשׁוּ שַׂקִּים</q>","Even the animals: fast + sackcloth: <q class=\"pq\">הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה</q>, <q class=\"pq\">וְיִתְכַּסּוּ שַׂקִּים הָאָדָם וְהַבְּהֵמָה</q>"],["Everyone: <q class=\"pq\">מִגְּדוֹלָם וְעַד־קְטַנָּם</q>","A stricter fast, no water either: <q class=\"pq\">וּמַיִם אַל־יִשְׁתּוּ</q>"],["","Pray with strength: <q class=\"pq\">וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחׇזְקָה</q>"],["","<b>Change their deeds</b>: <q class=\"pq\">וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם</q>"]],"note":"Then: <q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם</q>. What God responded to was the <b>change in deeds</b> the king demanded."},{"type":"pattern","title":"Pattern 3: קום לך… and how יונה \"gets up\"","rows":[["<q class=\"pq\">קוּם לֵךְ</q>","ה''s command (1:2)"],["<q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ</q>","gets up… to run away (1:3)"],["<q class=\"pq\">קוּם קְרָא</q>","the captain repeats ה''s words (1:6)"],["<q class=\"pq\">קוּם לֵךְ</q>","ה' asks again, second time (3:2)"],["<q class=\"pq\">וַיָּקׇם יוֹנָה וַיֵּלֶךְ</q>","gets up and goes (3:3)"]]},{"type":"pattern","title":"Pattern 4: \"…ולא נאבד\": the captain and the king","rows":[["<q class=\"pq\">אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵד</q>","רב החובל (1:6)"],["<q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵד</q>","מלך נינוה (3:9)"]],"note":"Two non-Jews, the same hope, the same ending words. Both use \"maybe\" words (אולי / מי יודע): they hope but aren't sure."},{"v":["J4:1"],"words":[{"he":"וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה","cons":"וירע אל יונה רעה גדולה","en":"it was very bad in יונה's eyes (a great evil to him)","ref":"J4:1"},{"he":"וַיִּחַר לוֹ","cons":"ויחר לו","en":"and he was angry","ref":"J4:1"}],"says":"This upset יונה very much, and he was angry.","teach":"<b>יונה's reaction</b> to נינוה being saved: anger. The city's רעה (evil) ended, and now יונה feels <q class=\"pq\">רָעָה גְדוֹלָה</q>.","tip":"<b>מה הייתה התגובה של יונה</b>: <q class=\"pq\">וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ</q> <span class=\"cite\">(יונה ד, א)</span>."},{"v":["J4:2"],"words":[{"he":"וַיִּתְפַּלֵּל אֶל־ה'","cons":"ויתפלל אל ה'","en":"he prayed to ה'","ref":"J4:2"},{"he":"הֲלוֹא־זֶה דְבָרִי","cons":"הלוא זה דברי","en":"isn't this what I said","ref":"J4:2"},{"he":"עַד־הֱיוֹתִי עַל־אַדְמָתִי","cons":"עד היותי על אדמתי","en":"while I was still in my own land","ref":"J4:2"},{"he":"עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ","cons":"על כן קדמתי לברח","en":"that is why I ran away at first","ref":"J4:2"},{"he":"אֵל־חַנּוּן וְרַחוּם","cons":"אל חנון ורחום","en":"a gracious and merciful God","ref":"J4:2"},{"he":"אֶרֶךְ אַפַּיִם","cons":"ארך אפים","en":"slow to anger","ref":"J4:2"},{"he":"וְרַב־חֶסֶד","cons":"ורב חסד","en":"full of kindness","ref":"J4:2"},{"he":"וְנִחָם עַל־הָרָעָה","cons":"ונחם על הרעה","en":"and You relent from punishing","ref":"J4:2"}],"says":"יונה prays: \"Please ה', isn't this what I said back home? That's why I ran to תרשיש at first. I knew You are gracious, merciful, slow to anger, full of kindness, and You take back punishments.\"","teach":"Now יונה <b>himself</b> explains why he ran away (1:3): he <b>knew</b> ה' would forgive נינוה. The things we usually praise ה' for (חנון, רחום, רב חסד) are exactly what יונה is upset about.","tip":"<b>למה יונה לא רצה ללכת</b> (his own reason): <q class=\"pq\">עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה</q> <span class=\"cite\">(יונה ד, ב)</span>."},{"v":["J4:3","J4:4"],"words":[{"he":"קַח־נָא אֶת־נַפְשִׁי מִמֶּנִּי","cons":"קח נא את נפשי ממני","en":"please take my life from me","ref":"J4:3"},{"he":"כִּי טוֹב מוֹתִי מֵחַיָּי","cons":"כי טוב מותי מחיי","en":"for my death is better than my life","ref":"J4:3"},{"he":"הַהֵיטֵב חָרָה לָךְ","cons":"ההיטב חרה לך","en":"are you right to be so angry?","ref":"J4:4"}],"says":"\"Now, ה', please take my life. Better for me to die than to live.\" ה' answers: \"Are you right to be so angry?\"","teach":"יונה's reaction goes as far as <b>asking to die</b>. ה' doesn't punish him. He asks a <b>question</b> to make him think.","tip":"<q class=\"pq\">קַח־נָא אֶת־נַפְשִׁי מִמֶּנִּי כִּי טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ג)</span> / ה': <q class=\"pq\">הַהֵיטֵב חָרָה לָךְ</q> <span class=\"cite\">(יונה ד, ד)</span>."},{"check":{"t":"mc","q":"According to יונה himself (4:2), why did he run away?","o":["He knew ה' is merciful and would forgive נינוה","He was afraid of the people of נינוה","He wanted to go to תרשיש for work","He didn't hear ה''s command"],"why":"<q class=\"pq\">כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם</q>.","proof":"<q class=\"pq\">עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם</q> <span class=\"cite\">(יונה ד, ב)</span>","alt":{"t":"mc","q":"Who said <span class=\"he\">הַהֵיטֵב חָרָה לָךְ</span>?","o":["ה', to יונה","יונה, to ה'","the king, to יונה","the captain"],"why":"<q class=\"pq\">וַיֹּאמֶר ה' הַהֵיטֵב חָרָה לָךְ</q>.","proof":"<q class=\"pq\">וַיֹּאמֶר ה' הַהֵיטֵב חָרָה לָךְ</q> <span class=\"cite\">(יונה ד, ד)</span>"}}},{"v":["J4:5"],"words":[{"he":"וַיֵּצֵא יוֹנָה מִן־הָעִיר","cons":"ויצא יונה מן העיר","en":"יונה left the city","ref":"J4:5"},{"he":"מִקֶּדֶם לָעִיר","cons":"מקדם לעיר","en":"east of the city","ref":"J4:5"},{"he":"וַיַּעַשׂ לוֹ שָׁם סֻכָּה","cons":"ויעש לו שם סכה","en":"he made himself a hut (סוכה) there","ref":"J4:5"},{"he":"בַּצֵּל","cons":"בצל","en":"in the shade","ref":"J4:5"},{"he":"עַד אֲשֶׁר יִרְאֶה מַה־יִּהְיֶה בָּעִיר","cons":"עד אשר יראה מה יהיה בעיר","en":"until he would see what would happen to the city","ref":"J4:5"}],"says":"יונה leaves the city, sits east of it, makes himself a hut and sits in its shade to see what will happen to the city.","teach":"יונה still waits, maybe hoping the city will be destroyed after all.","tip":"<q class=\"pq\">וַיַּעַשׂ לוֹ שָׁם סֻכָּה וַיֵּשֶׁב תַּחְתֶּיהָ בַּצֵּל</q> <span class=\"cite\">(יונה ד, ה)</span>."},{"v":["J4:6"],"words":[{"he":"וַיְמַן","cons":"וימן","en":"(ה') appointed / prepared","ref":"J4:6"},{"he":"קִיקָיוֹן","cons":"קיקיון","en":"a קיקיון plant (a fast-growing, shady plant)","ref":"J4:6"},{"he":"לִהְיוֹת צֵל עַל־רֹאשׁוֹ","cons":"להיות צל על ראשו","en":"to be shade over his head","ref":"J4:6"},{"he":"לְהַצִּיל לוֹ מֵרָעָתוֹ","cons":"להציל לו מרעתו","en":"to save him from his discomfort","ref":"J4:6"},{"he":"וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה","cons":"וישמח יונה על הקיקיון שמחה גדולה","en":"יונה was overjoyed about the קיקיון","ref":"J4:6"}],"says":"ה' makes a קיקיון grow over יונה to shade his head and ease his suffering. יונה is <b>very happy</b> about the קיקיון.","teach":"<b>Pattern:</b> <q class=\"pq\">רָעָה גְדוֹלָה</q> (4:1) → <q class=\"pq\">שִׂמְחָה גְדוֹלָה</q> (4:6). For the city, great anger. For a plant that helps <b>him</b>, great joy.","tip":"<b>יונה והקיקיון</b>: <q class=\"pq\">וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה</q> <span class=\"cite\">(יונה ד, ו)</span>."},{"check":{"t":"mc","q":"What does <span class=\"he\">וַיְמַן</span> mean?","o":["(ה') appointed / prepared","he was angry","he ran away","he slept"],"why":"וימן = ה' appointed (sent) something on purpose. It appears for the קיקיון, the worm and the wind.","proof":"<q class=\"pq\">וַיְמַן ה'־אֱלֹהִים קִיקָיוֹן</q> <span class=\"cite\">(יונה ד, ו)</span>","alt":{"t":"mc","q":"How did יונה feel when the קיקיון grew?","o":["very happy (שמחה גדולה)","angry","afraid","he didn't care"],"why":"<q class=\"pq\">וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה</q>.","proof":"<q class=\"pq\">וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה</q> <span class=\"cite\">(יונה ד, ו)</span>"}}},{"v":["J4:7"],"words":[{"he":"תּוֹלַעַת","cons":"תולעת","en":"a worm","ref":"J4:7"},{"he":"בַּעֲלוֹת הַשַּׁחַר לַמׇּחֳרָת","cons":"בעלות השחר למחרת","en":"at dawn the next day","ref":"J4:7"},{"he":"וַתַּךְ אֶת־הַקִּיקָיוֹן","cons":"ותך את הקיקיון","en":"it attacked (struck) the קיקיון","ref":"J4:7"},{"he":"וַיִּיבָשׁ","cons":"וייבש","en":"and it dried up","ref":"J4:7"}],"says":"At dawn the next day God sends a worm. It attacks the קיקיון and it dries up.","teach":"ה' gives, and ה' takes away, to teach יונה something.","tip":"<q class=\"pq\">וַיְמַן הָאֱלֹהִים תּוֹלַעַת בַּעֲלוֹת הַשַּׁחַר לַמׇּחֳרָת וַתַּךְ אֶת־הַקִּיקָיוֹן וַיִּיבָשׁ</q> <span class=\"cite\">(יונה ד, ז)</span>."},{"v":["J4:8"],"words":[{"he":"כִּזְרֹחַ הַשֶּׁמֶשׁ","cons":"כזרח השמש","en":"when the sun rose","ref":"J4:8"},{"he":"רוּחַ קָדִים חֲרִישִׁית","cons":"רוח קדים חרישית","en":"a hot, silent east wind (a scorching desert wind)","ref":"J4:8"},{"he":"וַתַּךְ הַשֶּׁמֶשׁ עַל־רֹאשׁ יוֹנָה","cons":"ותך השמש על ראש יונה","en":"the sun beat down on יונה's head","ref":"J4:8"},{"he":"וַיִּתְעַלָּף","cons":"ויתעלף","en":"he grew faint","ref":"J4:8"},{"he":"וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת","cons":"וישאל את נפשו למות","en":"he asked to die","ref":"J4:8"},{"he":"טוֹב מוֹתִי מֵחַיָּי","cons":"טוב מותי מחיי","en":"my death is better than my life","ref":"J4:8"}],"says":"When the sun rises, God sends a hot east wind. The sun beats on יונה's head, he faints and asks to die: \"Better for me to die than to live.\"","teach":"<b>His reaction when the קיקיון disappeared:</b> again he asks to die, with the same words as 4:3: <q class=\"pq\">טוֹב מוֹתִי מֵחַיָּי</q>.","tip":"<q class=\"pq\">וַיִּתְעַלָּף וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ח)</span>."},{"v":["J4:9"],"words":[{"he":"הַהֵיטֵב חָרָה־לְךָ עַל־הַקִּיקָיוֹן","cons":"ההיטב חרה לך על הקיקיון","en":"are you right to be angry about the קיקיון?","ref":"J4:9"},{"he":"הֵיטֵב חָרָה־לִי עַד־מָוֶת","cons":"היטב חרה לי עד מות","en":"I am right to be angry, angry enough to die","ref":"J4:9"}],"says":"God asks: \"Are you right to be angry about the קיקיון?\" יונה answers: \"Yes, I'm angry enough to die.\"","teach":"ה' asks the same question as before (4:4), now about the plant. יונה is still angry.","tip":"<q class=\"pq\">הֵיטֵב חָרָה־לִי עַד־מָוֶת</q> <span class=\"cite\">(יונה ד, ט)</span>."},{"check":{"t":"order","q":"Put the קיקיון story in order:","items":["יונה builds a סוכה east of the city","ה' makes a קיקיון grow; יונה is very happy","A worm attacks the קיקיון at dawn","A hot east wind and sun; יונה faints","יונה: \"טוב מותי מחיי\"","ה': \"you pitied the קיקיון… and I shall not pity נינוה?\""],"why":"ה → ו → ז → ח → ח → י–יא.","alt":{"t":"mc","q":"What does <span class=\"he\">רוּחַ קָדִים חֲרִישִׁית</span> mean?","o":["a hot, silent east wind","a cold north wind","a great storm at sea","a gentle breeze"],"why":"קדים = east. חרישית = silent/scorching. A hot desert wind.","proof":"<q class=\"pq\">רוּחַ קָדִים חֲרִישִׁית</q> <span class=\"cite\">(יונה ד, ח)</span>"}}},{"v":["J4:10","J4:11"],"words":[{"he":"אַתָּה חַסְתָּ עַל־הַקִּיקָיוֹן","cons":"אתה חסת על הקיקיון","en":"you had pity on the קיקיון","ref":"J4:10"},{"he":"אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ","cons":"אשר לא עמלת בו","en":"that you did not work for","ref":"J4:10"},{"he":"וְלֹא גִדַּלְתּוֹ","cons":"ולא גדלתו","en":"and did not grow","ref":"J4:10"},{"he":"שֶׁבִּן־לַיְלָה הָיָה וּבִן־לַיְלָה אָבָד","cons":"שבן לילה היה ובן לילה אבד","en":"it came up in a night and died in a night","ref":"J4:10"},{"he":"וַאֲנִי לֹא אָחוּס","cons":"ואני לא אחוס","en":"and shall I not have pity","ref":"J4:11"},{"he":"מִשְׁתֵּים־עֶשְׂרֵה רִבּוֹ","cons":"משתים עשרה רבו","en":"12 × 10,000 = 120,000","ref":"J4:11"},{"he":"אֲשֶׁר לֹא־יָדַע בֵּין־יְמִינוֹ לִשְׂמֹאלוֹ","cons":"אשר לא ידע בין ימינו לשמאלו","en":"who don't know their right hand from their left","ref":"J4:11"},{"he":"וּבְהֵמָה רַבָּה","cons":"ובהמה רבה","en":"and many animals","ref":"J4:11"}],"says":"ה': \"You cared about the קיקיון, which you didn't work for or grow, which came in one night and died in one night. And shouldn't I care about נינוה, the great city, with more than 120,000 people who don't know their right from their left, and many animals?\"","teach":"<b>The קל וחומר:</b> if <b>you</b> pity a <b>plant</b> you didn't work for, that lived one night, then how much more must <b>I</b> pity a great city of 120,000+ people and many animals, which I made. The book ends with this <b>question</b>, and יונה doesn't answer.","tip":"<b>ה''s answer to יונה</b>: <q class=\"pq\">אַתָּה חַסְתָּ עַל־הַקִּיקָיוֹן אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ</q> <span class=\"cite\">(יונה ד, י)</span> + <q class=\"pq\">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה הָעִיר הַגְּדוֹלָה</q> <span class=\"cite\">(יונה ד, יא)</span>."},{"type":"pattern","title":"Pattern 5
