: יונה's feelings","rows":[["<q class=\"pq\">וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ</q>","נינוה is saved → great anger (4:1)"],["<q class=\"pq\">כִּי טוֹב מוֹתִי מֵחַיָּי</q>","asks to die (4:3)"],["<q class=\"pq\">וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה</q>","a plant for himself → great joy (4:6)"],["<q class=\"pq\">וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי</q>","the plant is gone → asks to die again (4:8)"]],"note":"רעה גדולה → שמחה גדולה → טוב מותי מחיי. His feelings depend on what's good for <b>him</b>. That's what ה' shows him with the קל וחומר."},{"type":"compare","title":"The קל וחומר at the end of יונה","cols":["The קיקיון (light: קל)","נינוה (heavy: חומר)"],"rows":[["<q class=\"pq\">אַתָּה חַסְתָּ</q>: you (a person) had pity","<q class=\"pq\">וַאֲנִי לֹא אָחוּס</q>: I (ה') shall not have pity?"],["<q class=\"pq\">אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ</q>: you didn't work for it","ה' made them"],["<q class=\"pq\">שֶׁבִּן־לַיְלָה הָיָה וּבִן־לַיְלָה אָבָד</q>: lasted one night","<q class=\"pq\">הָעִיר הַגְּדוֹלָה</q>: a great, old city"],["one plant","<q class=\"pq\">הַרְבֵּה מִשְׁתֵּים־עֶשְׂרֵה רִבּוֹ אָדָם</q> + <q class=\"pq\">וּבְהֵמָה רַבָּה</q>"]]}],"cheat":{"facts":["ה': <q class=\"pq\">קוּם לֵךְ אֶל־נִינְוֵה</q>. יונה: <q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי ה'</q>.","Why he ran (his words, 4:2): <q class=\"pq\">כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם</q>. Class: 1. they won't listen 2. won't really do teshuva 3. don't deserve mercy 4. bad for Israel, who didn't do teshuva.","Going down: <q class=\"pq\">וַיֵּרֶד יָפוֹ</q> → <q class=\"pq\">וַיֵּרֶד בָּהּ</q> → <q class=\"pq\">יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה</q> → <q class=\"pq\">וַיֵּרָדַם</q>.","Sailors: pray, throw cargo, lots, questions, row hard, pray to ה', <q class=\"pq\">יִרְאָה גְדוֹלָה אֶת־ה'</q> + זבח + נדרים. יונה: sleeps, doesn't pray, admits <q class=\"pq\">כִּי בְשֶׁלִּי</q>, <q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי</q>.","Fear grows: 1:5 → 1:10 → 1:16 (את ה').","Fish: 3 days and 3 nights (פרק ב, not on the test).","נינוה: <q class=\"pq\">עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת</q>. People: believe, fast, sackcloth, everyone. King adds: off the throne, sits on אפר, animals fast too, no water, pray בחזקה, <q class=\"pq\">וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס</q>.","<q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם</q>: God saw their DEEDS.","אולי… ולא נאבד (captain, 1:6) = מי יודע… ולא נאבד (king, 3:9).","יונה's reaction: <q class=\"pq\">רָעָה גְדוֹלָה וַיִּחַר לוֹ</q>, asks to die. קיקיון: <q class=\"pq\">שִׂמְחָה גְדוֹלָה</q> → worm + רוח קדים חרישית → <q class=\"pq\">טוֹב מוֹתִי מֵחַיָּי</q>.","קל וחומר: you pitied a plant you didn't grow → I shall not pity נינוה, 120,000 people + animals?","Why we read it on יום כיפור: anyone can do teshuva. נינוה changed their ways and ה' forgave them."],"must":["J1:3","J1:5","J1:12","J1:16","J3:5","J3:6","J3:8","J3:10","J4:1","J4:2","J4:6","J4:8","J4:10","J4:11"]},"quiz":[{"lv":1,"t":"mc","q":"What does <span class=\"he\">רַב הַחֹבֵל</span> mean?","o":["the captain","a great storm","the cargo","a sailor's rope"],"why":"רב החבל = the chief of the sailors, the captain. He woke יונה.","proof":"<q class=\"pq\">וַיִּקְרַב אֵלָיו רַב הַחֹבֵל</q> <span class=\"cite\">(יונה א, ו)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">קִיקָיוֹן</span> mean?","o":["a fast-growing, shady plant","a worm","a hut","a hot wind"],"why":"ה' made the קיקיון grow to give יונה shade.","proof":"<q class=\"pq\">לִהְיוֹת צֵל עַל־רֹאשׁוֹ</q> <span class=\"cite\">(יונה ד, ו)</span>"}},{"lv":1,"t":"mc","q":"What does <span class=\"he\">מִשְׁתֵּים־עֶשְׂרֵה רִבּוֹ</span> mean?","o":["120,000","12","1,200","12 days"],"why":"רבו = 10,000. 12 × 10,000 = 120,000 people.","proof":"<q class=\"pq\">הַרְבֵּה מִשְׁתֵּים־עֶשְׂרֵה רִבּוֹ אָדָם</q> <span class=\"cite\">(יונה ד, יא)</span>","alt":{"t":"mc","q":"What does <span class=\"he\">וַיִּתְעַלָּף</span> mean?","o":["he fainted / grew faint","he prayed","he got angry","he fell asleep"],"why":"ויתעלף = he grew faint from the sun and wind.","proof":"<q class=\"pq\">וַתַּךְ הַשֶּׁמֶשׁ עַל־רֹאשׁ יוֹנָה וַיִּתְעַלָּף</q> <span class=\"cite\">(יונה ד, ח)</span>"}},{"lv":1,"t":"mc","q":"What did the sailors do at the very end of פרק א?","o":["feared ה', brought a sacrifice and made vows","went back to יפו","threw out more cargo","asked יונה to pray"],"why":"<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח לַה' וַיִּדְּרוּ נְדָרִים</q>.","proof":"<q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח לַה' וַיִּדְּרוּ נְדָרִים</q> <span class=\"cite\">(יונה א, טז)</span>"},{"lv":1,"t":"mc","q":"What attacked the קיקיון?","o":["a worm (תולעת)","a bird","the sailors","יונה"],"why":"<q class=\"pq\">וַיְמַן הָאֱלֹהִים תּוֹלַעַת</q>.","proof":"<q class=\"pq\">וַיְמַן הָאֱלֹהִים תּוֹלַעַת בַּעֲלוֹת הַשַּׁחַר לַמׇּחֳרָת וַתַּךְ אֶת־הַקִּיקָיוֹן</q> <span class=\"cite\">(יונה ד, ז)</span>"},{"lv":1,"t":"mc","q":"Who said <span class=\"he\">טוֹב מוֹתִי מֵחַיָּי</span>?","o":["יונה","the king of נינוה","רב החובל","the sailors"],"why":"יונה said it twice: 4:3 and 4:8.","proof":"<q class=\"pq\">וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ח)</span>","alt":{"t":"mc","q":"Who said <span class=\"he\">אָנָּה ה' אַל־נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה</span>?","o":["the sailors","יונה","the king of נינוה","the people of נינוה"],"why":"<q class=\"pq\">וַיִּקְרְאוּ אֶל־ה' וַיֹּאמְרוּ</q>: the sailors, before throwing יונה in.","proof":"<q class=\"pq\">וַיִּקְרְאוּ אֶל־ה' וַיֹּאמְרוּ אָנָּה ה' אַל־נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא כִּי־אַתָּה ה' כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ</q> <span class=\"cite\">(יונה א, יד)</span>"}},{"lv":2,"t":"mc","q":"Which pasuk shows what יונה was doing during the storm?","o":["<q class=\"pq\">וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם</q>","<q class=\"pq\">וְאֶת־ה' אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא</q>","<q class=\"pq\">וַיִּתֵּן שְׂכָרָהּ</q>","<q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם</q>"],"why":"He went down, lay down and fell into a deep sleep.","proof":"<q class=\"pq\">וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם</q> <span class=\"cite\">(יונה א, ה)</span>","alt":{"t":"mc","q":"Which pasuk shows that the people of נינוה changed their deeds?","o":["<q class=\"pq\">כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה</q>","<q class=\"pq\">וַיִּקְרְאוּ־צוֹם</q>","<q class=\"pq\">וַיֵּשֶׁב עַל־הָאֵפֶר</q>","<q class=\"pq\">עוֹד אַרְבָּעִים יוֹם</q>"],"why":"Fasting and ashes are outward signs. \"שבו מדרכם הרעה\" is changing deeds.","proof":"<q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה אֲשֶׁר־דִּבֶּר לַעֲשׂוֹת־לָהֶם וְלֹא עָשָׂה</q> <span class=\"cite\">(יונה ג, י)</span>"}},{"lv":2,"t":"fill","ref":"J3:10","blank":"מעשיהם","mean":"their deeds","why":"<q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם</q>: God saw their DEEDS.","before":"וַיַּרְא הָאֱלֹהִים אֶת־","answer":"מַעֲשֵׂיהֶם","after":" כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה אֲשֶׁר־דִּבֶּר לַעֲשׂוֹת־לָהֶם וְלֹא עָשָׂה","cite":"יונה ג, י","ansCons":"מעשיהם","others":["וַיַּרְא","הָאֱלֹהִים","שָׁבוּ","מִדַּרְכָּם","הָרָעָה","וַיִּנָּחֶם","הָאֱלֹהִים","הָרָעָה","אֲשֶׁר","דִּבֶּר","לַעֲשׂוֹת","לָהֶם","וְלֹא","עָשָׂה׃"]},{"lv":2,"t":"fill","ref":"J1:3","blank":"לברח","mean":"to run away","why":"<q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה</q>.","before":"וַיָּקׇם יוֹנָה ","answer":"לִבְרֹחַ","after":" תַּרְשִׁישָׁה מִלִּפְנֵי ה' וַיֵּרֶד יָפוֹ וַיִּמְצָא אֳנִיָּה בָּאָה תַרְשִׁישׁ וַיִּתֵּן שְׂכָרָהּ וַיֵּרֶד בָּהּ לָבוֹא עִמָּהֶם תַּרְשִׁישָׁה מִלִּפְנֵי ה'","cite":"יונה א, ג","ansCons":"לברח","others":["וַיָּקׇם","יוֹנָה","תַּרְשִׁישָׁה","מִלִּפְנֵי","וַיֵּרֶד","יָפוֹ","וַיִּמְצָא","אֳנִיָּה","בָּאָה","תַרְשִׁישׁ","וַיִּתֵּן","שְׂכָרָהּ","וַיֵּרֶד","לָבוֹא","עִמָּהֶם","תַּרְשִׁישָׁה","מִלִּפְנֵי"]},{"lv":2,"t":"fill","ref":"J3:6","blank":"האפר","mean":"the ashes","why":"The king <q class=\"pq\">וַיֵּשֶׁב עַל־הָאֵפֶר</q>.","before":"וַיִּגַּע הַדָּבָר אֶל־מֶלֶךְ נִינְוֵה וַיָּקׇם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל־","answer":"הָאֵפֶר","after":"","cite":"יונה ג, ו","ansCons":"האפר","others":["וַיִּגַּע","הַדָּבָר","מֶלֶךְ","נִינְוֵה","וַיָּקׇם","מִכִּסְאוֹ","וַיַּעֲבֵר","אַדַּרְתּוֹ","מֵעָלָיו","וַיְכַס","וַיֵּשֶׁב"]},{"lv":2,"t":"fill","ref":"J4:2","blank":"חנון ורחום","mean":"gracious and merciful","why":"<q class=\"pq\">כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם</q>.","before":"וַיִּתְפַּלֵּל אֶל־ה' וַיֹּאמַר אָנָּה ה' הֲלוֹא־זֶה דְבָרִי עַד־הֱיוֹתִי עַל־אַדְמָתִי עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־","answer":"חַנּוּן וְרַחוּם","after":" אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה","cite":"יונה ד, ב","ansCons":"חנון ורחום","others":["וַיִּתְפַּלֵּל","וַיֹּאמַר","אָנָּה","הֲלוֹא","דְבָרִי","הֱיוֹתִי","אַדְמָתִי","קִדַּמְתִּי","לִבְרֹחַ","תַּרְשִׁישָׁה","יָדַעְתִּי","אַתָּה","אֶרֶךְ","אַפַּיִם","וְרַב","חֶסֶד","וְנִחָם","הָרָעָה׃"]},{"lv":2,"t":"mc","q":"The captain's words <span class=\"he\">אוּלַי … וְלֹא נֹאבֵד</span> match which later words?","o":["<q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵד</q> (the king)","<q class=\"pq\">עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת</q> (יונה)","<q class=\"pq\">הַהֵיטֵב חָרָה לָךְ</q> (ה')","<q class=\"pq\">אַל־נָא נֹאבְדָה</q> (the sailors)"],"why":"Captain 1:6 ↔ King 3:9: both hope, both end in \"ולא נאבד\".","proof":"<q class=\"pq\">וְלֹא נֹאבֵד</q> <span class=\"cite\">(יונה ג, ט)</span>"},{"lv":3,"t":"open","q":"למה יונה לא רצה ללכת לנינוה? הבא פסוק.","en":"Why didn't Yonah want to go to Nineveh?","model":"יונה עצמו מסביר (פרק ד) שהוא ברח כי ידע שה' רחום וימחל לאנשי נינוה: <q class=\"pq\">עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה</q> <span class=\"cite\">(יונה ד, ב)</span>. כלומר, הוא ידע שאם הם יחזרו בתשובה ה' לא יעניש אותם.<br>סיבות נוספות (מהשיעור): 1. הוא לא חשב שיקשיבו לו. 2. הוא לא האמין שהם באמת יחזרו בתשובה. 3. הוא לא חשב שמגיע להם רחמים. 4. הוא ידע שאם נינוה תחזור בתשובה זה יהיה נגד ישראל, שלא חזרו בתשובה.<br>הוא ברח: <q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי ה'</q> <span class=\"cite\">(יונה א, ג)</span>.","check":["יונה's own reason from ד, ב with a quote","Explanation: ה' would forgive them","At least 2 class reasons","(Bonus) the escape pasuk א, ג"]},{"lv":3,"t":"open","q":"השווה בין התנהגות המלחים להתנהגות יונה בסערה: מה יונה עשה ומה לא עשה?","en":"Compare the sailors' behavior to Yonah's.","model":"המלחים פחדו והתפללו כל אחד לאלוהיו, וזרקו את המטען כדי להציל את האונייה: <q class=\"pq\">וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו וַיָּטִלוּ אֶת־הַכֵּלִים אֲשֶׁר בָּאֳנִיָּה אֶל־הַיָּם</q> <span class=\"cite\">(יונה א, ה)</span>. יונה, לעומתם, ירד לבטן האונייה וישן: <q class=\"pq\">וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם</q> <span class=\"cite\">(יונה א, ה)</span>. גם כשרב החובל אמר לו <q class=\"pq\">קוּם קְרָא אֶל־אֱלֹהֶיךָ</q> <span class=\"cite\">(יונה א, ו)</span>, לא כתוב שהוא התפלל.<br>מה יונה כן עשה: הודה שהסערה בגללו והציע שיזרקו אותו: <q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם … כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה עֲלֵיכֶם</q> <span class=\"cite\">(יונה א, יב)</span>.<br>המלחים ניסו להציל אותו: <q class=\"pq\">וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה</q> <span class=\"cite\">(יונה א, יג)</span>, ובסוף האמינו בה': <q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח לַה' וַיִּדְּרוּ נְדָרִים</q> <span class=\"cite\">(יונה א, טז)</span>.","check":["Sailors: pray + throw cargo (ה)","יונה: goes down and sleeps (ה)","יונה didn't pray, even after the captain (ו)","What he did: admits + \"throw me\" (יב)","Sailors row to save him (יג) and believe in ה' (טז)"]},{"lv":3,"t":"open","q":"איך חזרו אנשי נינוה בתשובה, ומה הוסיף המלך? הבא פסוקים.","en":"How did Nineveh do teshuva, and what did the king add?","model":"העם: <q class=\"pq\">וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים וַיִּקְרְאוּ־צוֹם וַיִּלְבְּשׁוּ שַׂקִּים מִגְּדוֹלָם וְעַד־קְטַנָּם</q> <span class=\"cite\">(יונה ג, ה)</span>. הם האמינו, צמו ולבשו שקים, כולם.<br>המלך הוסיף: 1. ירד מהכיסא, הוריד את האדרת וישב על האפר: <q class=\"pq\">וַיָּקׇם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל־הָאֵפֶר</q> <span class=\"cite\">(יונה ג, ו)</span>. 2. גם הבהמות צמות, בלי אוכל ובלי מים: <q class=\"pq\">הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה אַל־יִרְעוּ וּמַיִם אַל־יִשְׁתּוּ</q> <span class=\"cite\">(יונה ג, ז)</span>. 3. תפילה בחוזקה ושינוי המעשים: <q class=\"pq\">וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחׇזְקָה וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם</q> <span class=\"cite\">(יונה ג, ח)</span>.<br>ה' ראה את המעשים: <q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה</q> <span class=\"cite\">(יונה ג, י)</span>.","check":["People: believe, fast, sackcloth, everyone (ה)","King: throne, robe, ashes (ו)","King: animals + no water (ז)","King: וישבו איש מדרכו הרעה ומן החמס (ח)","God saw their deeds (י)"]},{"lv":3,"t":"open","q":"מה הייתה התגובה של יונה כשה' סלח לנינוה? ומה קרה עם הקיקיון?","en":"Yonah's reaction to Nineveh being saved + the kikayon.","model":"יונה כעס מאוד: <q class=\"pq\">וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ</q> <span class=\"cite\">(יונה ד, א)</span>, ואמר שידע שה' רחום <q class=\"pq\">כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם</q> <span class=\"cite\">(יונה ד, ב)</span>. הוא ביקש למות: <q class=\"pq\">כִּי טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ג)</span>.<br>הקיקיון: ה' הצמיח קיקיון שנתן ליונה צל, ויונה שמח מאוד: <q class=\"pq\">וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה</q> <span class=\"cite\">(יונה ד, ו)</span>. למחרת ה' שלח תולעת והקיקיון התייבש <q class=\"pq\">וַתַּךְ אֶת־הַקִּיקָיוֹן וַיִּיבָשׁ</q> <span class=\"cite\">(יונה ד, ז)</span>, ואז רוח קדים ושמש, ויונה ביקש שוב למות: <q class=\"pq\">וַיִּתְעַלָּף וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ח)</span>.<br>ה' לימד אותו קל וחומר: <q class=\"pq\">אַתָּה חַסְתָּ עַל־הַקִּיקָיוֹן אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ</q> <span class=\"cite\">(יונה ד, י)</span>, <q class=\"pq\">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה הָעִיר הַגְּדוֹלָה</q> <span class=\"cite\">(יונה ד, יא)</span>.","check":["Anger: רעה גדולה ויחר לו (ד, א)","Asks to die (ג)","קיקיון → שמחה גדולה (ו)","Worm + wind → asks to die again (ז–ח)","ה''s קל וחומר (י–יא)"]}],"who":[{"q":"<q class=\"pq\">קוּם לֵךְ אֶל־נִינְוֵה הָעִיר הַגְּדוֹלָה</q> <span class=\"cite\">(יונה א, ב)</span>","a":"ה'","o":["רב החובל","מלך נינוה","המלחים"],"ref":"J1:2"},{"q":"<q class=\"pq\">מַה־לְּךָ נִרְדָּם קוּם קְרָא אֶל־אֱלֹהֶיךָ</q> <span class=\"cite\">(יונה א, ו)</span>","a":"רב החובל","o":["ה'","מלך נינוה","המלחים"],"ref":"J1:6"},{"q":"<q class=\"pq\">לְכוּ וְנַפִּילָה גוֹרָלוֹת</q> <span class=\"cite\">(יונה א, ז)</span>","a":"המלחים","o":["רב החובל","יונה","ה'"],"ref":"J1:7"},{"q":"<q class=\"pq\">עִבְרִי אָנֹכִי</q> <span class=\"cite\">(יונה א, ט)</span>","a":"יונה","o":["רב החובל","המלחים","מלך נינוה"],"ref":"J1:9"},{"q":"<q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם</q> <span class=\"cite\">(יונה א, יב)</span>","a":"יונה","o":["המלחים","רב החובל","ה'"],"ref":"J1:12"},{"q":"<q class=\"pq\">אַל־נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה</q> <span class=\"cite\">(יונה א, יד)</span>","a":"המלחים","o":["יונה","רב החובל","מלך נינוה"],"ref":"J1:14"},{"q":"<q class=\"pq\">עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת</q> <span class=\"cite\">(יונה ג, ד)</span>","a":"יונה","o":["ה'","מלך נינוה","רב החובל"],"ref":"J3:4"},{"q":"<q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים</q> <span class=\"cite\">(יונה ג, ט)</span>","a":"מלך נינוה","o":["רב החובל","יונה","המלחים"],"ref":"J3:9"},{"q":"<q class=\"pq\">קַח־נָא אֶת־נַפְשִׁי מִמֶּנִּי</q> <span class=\"cite\">(יונה ד, ג)</span>","a":"יונה","o":["מלך נינוה","רב החובל","המלחים"],"ref":"J4:3"},{"q":"<q class=\"pq\">הַהֵיטֵב חָרָה לָךְ</q> <span class=\"cite\">(יונה ד, ד)</span>","a":"ה'","o":["יונה","מלך נינוה","רב החובל"],"ref":"J4:4"},{"q":"<q class=\"pq\">הֵיטֵב חָרָה־לִי עַד־מָוֶת</q> <span class=\"cite\">(יונה ד, ט)</span>","a":"יונה","o":["ה'","מלך נינוה","המלחים"],"ref":"J4:9"},{"q":"<q class=\"pq\">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה הָעִיר הַגְּדוֹלָה</q> <span class=\"cite\">(יונה ד, יא)</span>","a":"ה'","o":["יונה","מלך נינוה","רב החובל"],"ref":"J4:11"}]}],"extra":{"realTest":[{"topic":"lech","q":"<b>א.</b> מה היה הקושי של אברם בציווי \"לך לך\"? הבא פסוק.<br><b>ב.</b> מנה את ההבטחות שה' הבטיח לאברם בפרק יב, והסבר למה דווקא ההבטחות האלה.","en":"What was Avram's difficulty in the command \"לך לך\"? Bring a pasuk. / List the promises and explain why exactly these.","model":"<b>א.</b> הקושי של אברם היה שהוא היה צריך לעזוב את כל מה שהוא מכיר: את הארץ שלו, את המולדת שלו ואת בית אביו, וללכת למקום שהוא לא יודע מהו. כתוב: <q class=\"pq\">לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ</q> <span class=\"cite\">(בראשית יב, א)</span>. המילים \"אשר אראך\" מראות שה' לא אמר לו לאן הוא הולך. בנוסף, הוא כבר היה זקן: <q class=\"pq\">וְאַבְרָם בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה</q> <span class=\"cite\">(בראשית יב, ד)</span>.<hr><b>ב.</b> ה' הבטיח לאברם: 1. שיהיה לגוי גדול 2. שיברך אותו 3. שיגדיל את שמו 4. שיהיה ברכה, וכל משפחות האדמה יתברכו בו: <q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה</q> <span class=\"cite\">(בראשית יב, ב)</span>, <q class=\"pq\">וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה</q> <span class=\"cite\">(בראשית יב, ג)</span>. בהמשך ה' הבטיח גם את הארץ: <q class=\"pq\">לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית יב, ז)</span>.<br>למה דווקא אלה? כל הבטחה מתאימה למה שאברם עוזב: הוא עוזב את ארצו ומקבל ארץ; עוזב את מולדתו ומשפחתו והופך לגוי גדול; עוזב את בית אביו (השם והעושר) ומקבל ברכה ושם גדול.","check":["א: Leaving 3 things: ארץ, מולדת, בית אב","א: Going to an unknown place: \"אשר אראך\"","א: Quote from פסוק א with chapter and pasuk","א: (Bonus) age 75, פסוק ד","ב: All 4 promises from ב–ג","ב: The land promise (ז)","ב: The link: each promise matches something he left in פסוק א","ב: Quotes with pasuk numbers"]},{"topic":"lech","q":"<b>א.</b> למה אמר אברם ששרי היא אחותו? מה קרה במצרים ואיך יצאו משם? הבא פסוקים.<br><b>ב.</b> מה היו הניסיונות של אברם בפרק יב? איך עמד בהם?","en":"Why did Avram say Sarai was his sister, what happened in Egypt, and how did they get out? / What were Avram's tests in chapter 12?","model":"<b>א.</b> אברם פחד שהמצרים יהרגו אותו בגלל היופי של שרי: <q class=\"pq\">וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q> <span class=\"cite\">(בראשית יב, יב)</span>. לכן ביקש ממנה: <q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ</q> <span class=\"cite\">(בראשית יב, יג)</span>.<br>במצרים: שרי נלקחה לבית פרעה <q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q> <span class=\"cite\">(בראשית יב, טו)</span>, ולאברם היה טוב בגללה <q class=\"pq\">וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ</q> <span class=\"cite\">(בראשית יב, טז)</span>.<br>איך יצאו: ה' שלח נגעים על פרעה <q class=\"pq\">וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים</q> <span class=\"cite\">(בראשית יב, יז)</span>, פרעה החזיר את שרי <q class=\"pq\">הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ</q> <span class=\"cite\">(בראשית יב, יט)</span> ושלח אותם עם כל רכושם <q class=\"pq\">וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כׇּל־אֲשֶׁר־לוֹ</q> <span class=\"cite\">(בראשית יב, כ)</span>.<hr><b>ב.</b> 1. לעזוב הכל וללכת למקום לא ידוע: <q class=\"pq\">לֶךְ־לְךָ מֵאַרְצְךָ</q> <span class=\"cite\">(בראשית יב, א)</span>. אברם עמד בניסיון: <q class=\"pq\">וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה'</q> <span class=\"cite\">(בראשית יב, ד)</span>.<br>2. רעב בארץ שה' הבטיח לו: <q class=\"pq\">וַיְהִי רָעָב בָּאָרֶץ</q> <span class=\"cite\">(בראשית יב, י)</span>. הוא ירד למצרים רק \"לגור שם\", לזמן קצר.<br>3. הפחד במצרים ולקיחת שרי: <q class=\"pq\">וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה</q> <span class=\"cite\">(בראשית יב, טו)</span>. ה' הציל אותם בנגעים.","check":["א: Reason: fear of being killed (יב)","א: The request: אמרי נא אחתי את (יג)","א: What happened: Sarai taken, Avram got rich (טו–טז)","א: How they got out: נגעים → returned → sent out (יז–כ)","א: A quote for each part","ב: Test 1: לך לך + he went right away","ב: Test 2: the famine","ב: Test 3: Egypt / Sarai taken","ב: A quote for each"]},{"topic":"batar","q":"<b>א.</b> למה אברם האמין לה'? מה הייתה הבטחת הזרע? הבא פסוקים.<br><b>ב.</b> מה ה' גילה לאברם על העתיד של צאצאיו? הבא פסוקים.","en":"Why did Avram believe, and what was the promise of seed? / What did ה' reveal about the future of his descendants?","model":"<b>א.</b> אברם התלונן שאין לו ילדים: <q class=\"pq\">הֵן לִי לֹא נָתַתָּה זָרַע</q> <span class=\"cite\">(בראשית טו, ג)</span>. ה' הבטיח לו בן משלו: <q class=\"pq\">כִּי־אִם אֲשֶׁר יֵצֵא מִמֵּעֶיךָ הוּא יִירָשֶׁךָ</q> <span class=\"cite\">(בראשית טו, ד)</span>, וצאצאים רבים כמו הכוכבים: <q class=\"pq\">וּסְפֹר הַכּוֹכָבִים אִם־תּוּכַל לִסְפֹּר אֹתָם וַיֹּאמֶר לוֹ כֹּה יִהְיֶה זַרְעֶךָ</q> <span class=\"cite\">(בראשית טו, ה)</span>. ה' ענה בדיוק על החשש שלו והראה לו את הכוכבים, ולכן אברם האמין, אפילו בלי הוכחה: <q class=\"pq\">וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה</q> <span class=\"cite\">(בראשית טו, ו)</span>.<hr><b>ב.</b> ה' גילה שצאצאיו יהיו גרים בארץ זרה וישעבדו אותם 400 שנה: <q class=\"pq\">כִּי־גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה</q> <span class=\"cite\">(בראשית טו, יג)</span>. אבל ה' יעניש את הגוי המשעבד והם יצאו עם רכוש גדול: <q class=\"pq\">וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל</q> <span class=\"cite\">(בראשית טו, יד)</span>. הדור הרביעי יחזור לארץ: <q class=\"pq\">וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה</q> <span class=\"cite\">(בראשית טו, טז)</span>.","check":["א: The problem: no children / אליעזר (ב–ג)","א: Promise 1: a son of his own (ד)","א: Promise 2: like the stars (ה)","א: He believed, counted as צדקה (ו)","ב: Strangers + slavery, 400 years (יג)","ב: ה' judges the nation, they leave with wealth (יד)","ב: Return in the 4th generation (טז)"]},{"topic":"batar","q":"<b>א.</b> הסבר את הסמלים בברית בין הבתרים: החיות שנחתכו, הציפורים, העיט, התנור והלפיד.<br><b>ב.</b> ברית בין הבתרים: מי? למה? מתי? ומה הובטח בה?","en":"Explain the symbols. / Who, why, when, what was promised.","model":"<b>א.</b> 1. אברם חתך את החיות לחצי: <q class=\"pq\">וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ</q> <span class=\"cite\">(בראשית טו, י)</span>. כך כורתים ברית (\"כרת\" = חתך).<br>2. את הציפורים לא חתך: <q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q> <span class=\"cite\">(בראשית טו, י)</span>. זה מסמל שעם ישראל יישאר לנצח.<br>3. העיט שירד על הפגרים: <q class=\"pq\">וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים</q> <span class=\"cite\">(בראשית טו, יא)</span>. העיט מסמל את מצרים, שתשעבד את ישראל (פס' יג).<br>4. התנור והלפיד: <q class=\"pq\">וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה</q> <span class=\"cite\">(בראשית טו, יז)</span>. זה מסמל את כריתת הברית, ובפסוק יח כתוב: <q class=\"pq\">בַּיּוֹם הַהוּא כָּרַת ה' אֶת־אַבְרָם בְּרִית</q> <span class=\"cite\">(בראשית טו, יח)</span>.<hr><b>ב.</b> מי: ה' כרת ברית עם אברם: <q class=\"pq\">כָּרַת ה' אֶת־אַבְרָם בְּרִית</q> <span class=\"cite\">(בראשית טו, יח)</span>.<br>למה: אברם שאל <q class=\"pq\">בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה</q> <span class=\"cite\">(בראשית טו, ח)</span>. הברית היא התשובה.<br>מתי: לפני שהיו לאברם ילדים, בשקיעה ובחושך: <q class=\"pq\">וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה</q> <span class=\"cite\">(בראשית טו, יז)</span>.<br>מה הובטח: הארץ לצאצאיו: <q class=\"pq\">לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית טו, יח)</span>, אחרי שעבוד של 400 שנה: <q class=\"pq\">וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה</q> <span class=\"cite\">(בראשית טו, יג)</span>, ויציאה ברכוש גדול: <q class=\"pq\">וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל</q> <span class=\"cite\">(בראשית טו, יד)</span>.","check":["א: Cut animals = the way to make a ברית","א: Birds not cut = Israel forever","א: עיט = מצרים","א: תנור ולפיד = making the ברית","א: A quote for each","ב: Who: ה' + אברם","ב: Why: במה אדע (ח)","ב: When: sunset/dark, before he had children","ב: What: land for his descendants + 400 years + leaving with great wealth"]},{"topic":"mila","q":"<b>א.</b> פרט את דיני ברית המילה. הבא פסוק לכל דין.<br><b>ב.</b> ברית מילה: מי עשה? מתי? מה עושים? מה הסמל?","en":"List the laws of brit mila with a pasuk for each. / Who did it, when, what is done, what is the symbol?","model":"<b>א.</b> 1. חובה למול כל זכר: <q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, י)</span>.<br>2. בגיל שמונה ימים: <q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר לְדֹרֹתֵיכֶם</q> <span class=\"cite\">(בראשית יז, יב)</span>.<br>3. גם עבדים, יליד בית ומקנת כסף: <q class=\"pq\">יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף</q> <span class=\"cite\">(בראשית יז, יב)</span>.<br>4. המילה היא הסרת הערלה: <q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>.<br>5. מי שלא נימול נענש בכרת: <q class=\"pq\">וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ</q> <span class=\"cite\">(בראשית יז, יד)</span>.<hr><b>ב.</b> מי עשה: אברהם מל את עצמו, את ישמעאל בנו ואת כל הזכרים בביתו: <q class=\"pq\">וַיִּקַּח אַבְרָהָם אֶת־יִשְׁמָעֵאל בְּנוֹ וְאֵת כׇּל־יְלִידֵי בֵיתוֹ וְאֵת כׇּל־מִקְנַת כַּסְפּוֹ</q> <span class=\"cite\">(בראשית יז, כג)</span>.<br>מתי: כשאברהם היה בן 99, ובאותו היום שה' ציווה: <q class=\"pq\">וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה</q> <span class=\"cite\">(בראשית יז, כד)</span>, <q class=\"pq\">בְּעֶצֶם הַיּוֹם הַזֶּה נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנוֹ</q> <span class=\"cite\">(בראשית יז, כו)</span>. לדורות: בגיל 8 ימים.<br>מה עושים: מסירים את הערלה: <q class=\"pq\">וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>.<br>הסמל: המילה היא אות לברית בין ה' לעם ישראל, בגוף, לתמיד: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם</q> <span class=\"cite\">(בראשית יז, יא)</span>, <q class=\"pq\">וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם</q> <span class=\"cite\">(בראשית יז, יג)</span>.","check":["א: כל זכר","א: 8 days","א: servants: יליד בית + מקנת כסף","א: removing the ערלה","א: כרת","א: a pasuk for each","ב: Who: Avraham + ישמעאל + all males of the house","ב: When: age 99, that same day (and 8 days for the generations)","ב: What: removing the ערלה","ב: Symbol: אות ברית, in the body, forever"]},{"topic":"mila","q":"<b>א.</b> השווה בין ברית בין הבתרים לברית מילה: ציין דבר אחד דומה ושני דברים שונים. הבא פסוקים.<br><b>ב.</b> מה הייתה התגובה של אברהם להבטחת הבן משרה, ומה ענה לו ה'?","en":"Compare: one similarity, two differences. / Avraham's reaction to the promise of a son from Sarah and ה''s answer.","model":"<b>א.</b> דומה: בשתי הבריתות ה' מבטיח את הארץ לצאצאי אברהם: <q class=\"pq\">לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת</q> <span class=\"cite\">(בראשית טו, יח)</span> וגם <q class=\"pq\">וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ אֵת אֶרֶץ מְגֻרֶיךָ</q> <span class=\"cite\">(בראשית יז, ח)</span>.<br>שונה 1: בברית בין הבתרים הסמלים הם חיות חתוכות ותנור עשן ולפיד אש: <q class=\"pq\">וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה</q> <span class=\"cite\">(בראשית טו, יז)</span>. בברית מילה הסמל הוא המילה בגוף: <q class=\"pq\">וְהָיָה לְאוֹת בְּרִית</q> <span class=\"cite\">(בראשית יז, יא)</span>.<br>שונה 2: בברית בין הבתרים אברהם לא צריך לקיים מצווה לדורות. בברית מילה הוא וכל צאצאיו צריכים למול לדורות: <q class=\"pq\">הִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, י)</span>.<br>שונה 3: מתי: בברית בין הבתרים עוד לא היו לו ילדים. בברית מילה הוא בן 99: <q class=\"pq\">וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים</q> <span class=\"cite\">(בראשית יז, א)</span>.<hr><b>ב.</b> אברהם צחק, כי היה לו קשה להאמין שיוולד להם בן בגילם: <q class=\"pq\">וַיִּצְחָק וַיֹּאמֶר בְּלִבּוֹ הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד</q> <span class=\"cite\">(בראשית יז, יז)</span>. הוא ביקש: <q class=\"pq\">לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ</q> <span class=\"cite\">(בראשית יז, יח)</span>. ה' ענה ששרה תלד בן בשם יצחק והברית תמשיך דרכו: <q class=\"pq\">אֲבָל שָׂרָה אִשְׁתְּךָ יֹלֶדֶת לְךָ בֵּן וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ</q> <span class=\"cite\">(בראשית יז, יט)</span>. גם ישמעאל יתברך ויהיה לגוי גדול: <q class=\"pq\">וּנְתַתִּיו לְגוֹי גָּדוֹל</q> <span class=\"cite\">(בראשית יז, כ)</span>.","check":["א: Similarity with a pasuk from each chapter","א: Difference 1 with pesukim (symbols)","א: Difference 2 with pesukim (mitzva / when / who)","ב: He laughed + why (age)","ב: He asked about ישמעאל","ב: ה': son יצחק from Sarah, ברית through him","ב: ישמעאל also a great nation"]},{"topic":"yona","q":"<b>א.</b> למה יונה לא רצה ללכת לנינוה? הבא פסוק.<br><b>ב.</b> השווה בין התנהגות המלחים להתנהגות יונה בסערה: מה יונה עשה ומה לא עשה?","en":"Why didn't Yonah want to go to Nineveh? / Compare the sailors' behavior to Yonah's.","model":"<b>א.</b> יונה עצמו מסביר (פרק ד) שהוא ברח כי ידע שה' רחום וימחל לאנשי נינוה: <q class=\"pq\">עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה</q> <span class=\"cite\">(יונה ד, ב)</span>. כלומר, הוא ידע שאם הם יחזרו בתשובה ה' לא יעניש אותם.<br>סיבות נוספות (מהשיעור): 1. הוא לא חשב שיקשיבו לו. 2. הוא לא האמין שהם באמת יחזרו בתשובה. 3. הוא לא חשב שמגיע להם רחמים. 4. הוא ידע שאם נינוה תחזור בתשובה זה יהיה נגד ישראל, שלא חזרו בתשובה.<br>הוא ברח: <q class=\"pq\">וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי ה'</q> <span class=\"cite\">(יונה א, ג)</span>.<hr><b>ב.</b> המלחים פחדו והתפללו כל אחד לאלוהיו, וזרקו את המטען כדי להציל את האונייה: <q class=\"pq\">וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו וַיָּטִלוּ אֶת־הַכֵּלִים אֲשֶׁר בָּאֳנִיָּה אֶל־הַיָּם</q> <span class=\"cite\">(יונה א, ה)</span>. יונה, לעומתם, ירד לבטן האונייה וישן: <q class=\"pq\">וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם</q> <span class=\"cite\">(יונה א, ה)</span>. גם כשרב החובל אמר לו <q class=\"pq\">קוּם קְרָא אֶל־אֱלֹהֶיךָ</q> <span class=\"cite\">(יונה א, ו)</span>, לא כתוב שהוא התפלל.<br>מה יונה כן עשה: הודה שהסערה בגללו והציע שיזרקו אותו: <q class=\"pq\">שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם … כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה עֲלֵיכֶם</q> <span class=\"cite\">(יונה א, יב)</span>.<br>המלחים ניסו להציל אותו: <q class=\"pq\">וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה</q> <span class=\"cite\">(יונה א, יג)</span>, ובסוף האמינו בה': <q class=\"pq\">וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח לַה' וַיִּדְּרוּ נְדָרִים</q> <span class=\"cite\">(יונה א, טז)</span>.","check":["א: יונה's own reason from ד, ב with a quote","א: Explanation: ה' would forgive them","א: At least 2 class reasons","א: (Bonus) the escape pasuk א, ג","ב: Sailors: pray + throw cargo (ה)","ב: יונה: goes down and sleeps (ה)","ב: יונה didn't pray, even after the captain (ו)","ב: What he did: admits + \"throw me\" (יב)","ב: Sailors row to save him (יג) and believe in ה' (טז)"]},{"topic":"yona","q":"<b>א.</b> איך חזרו אנשי נינוה בתשובה, ומה הוסיף המלך? הבא פסוקים.<br><b>ב.</b> מה הייתה התגובה של יונה כשה' סלח לנינוה? ומה קרה עם הקיקיון?","en":"How did Nineveh do teshuva, and what did the king add? / Yonah's reaction to Nineveh being saved + the kikayon.","model":"<b>א.</b> העם: <q class=\"pq\">וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים וַיִּקְרְאוּ־צוֹם וַיִּלְבְּשׁוּ שַׂקִּים מִגְּדוֹלָם וְעַד־קְטַנָּם</q> <span class=\"cite\">(יונה ג, ה)</span>. הם האמינו, צמו ולבשו שקים, כולם.<br>המלך הוסיף: 1. ירד מהכיסא, הוריד את האדרת וישב על האפר: <q class=\"pq\">וַיָּקׇם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל־הָאֵפֶר</q> <span class=\"cite\">(יונה ג, ו)</span>. 2. גם הבהמות צמות, בלי אוכל ובלי מים: <q class=\"pq\">הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה אַל־יִרְעוּ וּמַיִם אַל־יִשְׁתּוּ</q> <span class=\"cite\">(יונה ג, ז)</span>. 3. תפילה בחוזקה ושינוי המעשים: <q class=\"pq\">וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחׇזְקָה וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם</q> <span class=\"cite\">(יונה ג, ח)</span>.<br>ה' ראה את המעשים: <q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה</q> <span class=\"cite\">(יונה ג, י)</span>.<hr><b>ב.</b> יונה כעס מאוד: <q class=\"pq\">וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ</q> <span class=\"cite\">(יונה ד, א)</span>, ואמר שידע שה' רחום <q class=\"pq\">כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם</q> <span class=\"cite\">(יונה ד, ב)</span>. הוא ביקש למות: <q class=\"pq\">כִּי טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ג)</span>.<br>הקיקיון: ה' הצמיח קיקיון שנתן ליונה צל, ויונה שמח מאוד: <q class=\"pq\">וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה</q> <span class=\"cite\">(יונה ד, ו)</span>. למחרת ה' שלח תולעת והקיקיון התייבש <q class=\"pq\">וַתַּךְ אֶת־הַקִּיקָיוֹן וַיִּיבָשׁ</q> <span class=\"cite\">(יונה ד, ז)</span>, ואז רוח קדים ושמש, ויונה ביקש שוב למות: <q class=\"pq\">וַיִּתְעַלָּף וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ח)</span>.<br>ה' לימד אותו קל וחומר: <q class=\"pq\">אַתָּה חַסְתָּ עַל־הַקִּיקָיוֹן אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ</q> <span class=\"cite\">(יונה ד, י)</span>, <q class=\"pq\">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה הָעִיר הַגְּדוֹלָה</q> <span class=\"cite\">(יונה ד, יא)</span>.","check":["א: People: believe, fast, sackcloth, everyone (ה)","א: King: throne, robe, ashes (ו)","א: King: animals + no water (ז)","א: King: וישבו איש מדרכו הרעה ומן החמס (ח)","א: God saw their deeds (י)","ב: Anger: רעה גדולה ויחר לו (ד, א)","ב: Asks to die (ג)","ב: קיקיון → שמחה גדולה (ו)","ב: Worm + wind → asks to die again (ז–ח)","ב: ה''s קל וחומר (י–יא)"]}],"lesson":{"formula":"<ol class=\"formula\"><li><b>Answer in one sentence</b>: answer exactly what was asked, in your own words (in Hebrew).</li><li><b>Quote the pasuk</b>: copy the exact words, with chapter and pasuk: (\"…\" בראשית יב, יב).</li><li><b>Explain what the quote shows</b>: one sentence that connects the quote to your answer (\"מכאן רואים ש…\").</li></ol>","examples":[{"q":"למה ירד אברם למצרים?","steps":[["1. Answer","אברם ירד למצרים בגלל רעב כבד בארץ כנען."],["2. Quote","<q class=\"pq\">וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם כִּי־כָבֵד הָרָעָב בָּאָרֶץ</q> <span class=\"cite\">(בראשית יב, י)</span>"],["3. Explain","המילים \"כי כבד הרעב\" מראות שהסיבה היא הרעב, והמילים \"לגור שם\" מראות שהוא תכנן להישאר שם רק זמן קצר."]]},{"q":"מה ראה האלהים במעשי אנשי נינוה?","steps":[["1. Answer","ה' ראה שאנשי נינוה שינו את המעשים שלהם ועזבו את הדרך הרעה, ולכן לא העניש אותם."],["2. Quote","<q class=\"pq\">וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה</q> <span class=\"cite\">(יונה ג, י)</span>"],["3. Explain","כתוב \"את מעשיהם\", ולא \"את צומם\" או \"את שקיהם\". מכאן רואים שמה שהציל אותם הוא שינוי המעשים."]]}],"types":[{"name":"השווה","how":"Write what is <b>similar</b> AND what is <b>different</b>. Give a pasuk for <b>each side</b>. Use the words \"דומה: … / שונה: … ואילו …\".","ex":"<b>דומה:</b> גם רב החובל וגם מלך נינוה מקווים שלא ימותו: <q class=\"pq\">אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵד</q> <span class=\"cite\">(יונה א, ו)</span>, <q class=\"pq\">מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵד</q> <span class=\"cite\">(יונה ג, ט)</span>.<br><b>שונה:</b> רב החובל מבקש מיונה להתפלל, ואילו המלך מצווה על כל העיר לשוב מהדרך הרעה: <q class=\"pq\">וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה</q> <span class=\"cite\">(יונה ג, ח)</span>."},{"name":"הסבר את הסמל","how":"1. Name the symbol and quote it. 2. Say what it stands for. 3. Connect it to the story (\"כמו ש…\").","ex":"הסמל: <q class=\"pq\">וְאֶת־הַצִּפֹּר לֹא בָתָר</q> <span class=\"cite\">(בראשית טו, י)</span>. הציפורים שלא נחתכו מסמלות שעם ישראל יישאר לנצח."},{"name":"מה הייתה התגובה","how":"Say <b>what he felt</b> and <b>what he did / said</b>, with a quote. If there are two reactions, give both.","ex":"התגובה של יונה: הוא כעס מאוד <q class=\"pq\">וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ</q> <span class=\"cite\">(יונה ד, א)</span> וביקש למות <q class=\"pq\">כִּי טוֹב מוֹתִי מֵחַיָּי</q> <span class=\"cite\">(יונה ד, ג)</span>."},{"name":"הבא פסוק","how":"Copy the <b>exact</b> words, and only the part that proves the point. Always add the source: (ספר פרק, פסוק).","ex":"<q class=\"pq\">וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר</q> <span class=\"cite\">(בראשית יז, יב)</span>"},{"name":"מנה / פרט","how":"<b>מנה</b> = list (short points, numbered). <b>פרט</b> = list + explain each one briefly. Number them 1, 2, 3… and give a quote for each one if you can.","ex":"1. גוי גדול <q class=\"pq\">וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל</q> 2. ברכה <q class=\"pq\">וַאֲבָרֶכְךָ</q> 3. שם גדול <q class=\"pq\">וַאֲגַדְּלָה שְׁמֶךָ</q> 4. מקור ברכה <q class=\"pq\">וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה</q> (בראשית יב, ב–ג)"}],"practice":[{"t":"mc","q":"Which answer is COMPLETE for: \"למה אמר אברם ששרי אחותו?\"","o":["אברם פחד שיהרגו אותו בגלל היופי של שרי: <q class=\"pq\">וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ</q> <span class=\"cite\">(בראשית יב, יב)</span>. מכאן רואים שאם הייתה אחותו, לא הייתה סיבה להרוג אותו.","כי הוא פחד.","<q class=\"pq\">אִמְרִי־נָא אֲחֹתִי אָתְּ</q> <span class=\"cite\">(בראשית יב, יג)</span>","אברם פחד מהמצרים כי הם היו רעים."],"why":"A full answer has all 3 parts: an answer sentence + an exact quote with a source + an explanation. The others are missing a quote, or an explanation, or both."},{"t":"mc","q":"\"השווה בין המלחים ליונה.\" What MUST a full answer include?","o":["Something about the sailors AND something about יונה, with a pasuk for each side","Only what the sailors did","Only one quote for the whole answer","Only יונה's feelings"],"why":"השווה = both sides, with a pasuk for each side."},{"t":"mc","q":"What is the difference between מנה and פרט?","o":["מנה = list; פרט = list and explain each item","They are the same","מנה = explain; פרט = only quote","פרט = write one sentence only"],"why":"מנה = just list. פרט = list + a short explanation (and quotes) for each."}]}},"verses":{"G12:1":{"nk":"וַיֹּאמֶר ה' אֶל־אַבְרָם לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ׃","tm":"וַיֹּ֤אמֶר ה' אֶל־אַבְרָ֔ם לֶךְ־לְךָ֛ מֵאַרְצְךָ֥ וּמִמּֽוֹלַדְתְּךָ֖ וּמִבֵּ֣ית אָבִ֑יךָ אֶל־הָאָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽךָּ׃","cite":"בראשית יב, א"},"G12:2":{"nk":"וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה׃","tm":"וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃","cite":"בראשית יב, ב"},"G12:3":{"nk":"וַאֲבָרְכָה מְבָרְכֶיךָ וּמְקַלֶּלְךָ אָאֹר וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה׃","tm":"וַאֲבָֽרְכָה֙ מְבָ֣רְכֶ֔יךָ וּמְקַלֶּלְךָ֖ אָאֹ֑ר וְנִבְרְכ֣וּ בְךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָאֲדָמָֽה׃","cite":"בראשית יב, ג"},"G12:4":{"nk":"וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו ה' וַיֵּלֶךְ אִתּוֹ לוֹט וְאַבְרָם בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה בְּצֵאתוֹ מֵחָרָן׃","tm":"וַיֵּ֣לֶךְ אַבְרָ֗ם כַּאֲשֶׁ֨ר דִּבֶּ֤ר אֵלָיו֙ ה' וַיֵּ֥לֶךְ אִתּ֖וֹ ל֑וֹט וְאַבְרָ֗ם בֶּן־חָמֵ֤שׁ שָׁנִים֙ וְשִׁבְעִ֣ים שָׁנָ֔ה בְּצֵאת֖וֹ מֵחָרָֽן׃","cite":"בראשית יב, ד"},"G12:5":{"nk":"וַיִּקַּח אַבְרָם אֶת־שָׂרַי אִשְׁתּוֹ וְאֶת־לוֹט בֶּן־אָחִיו וְאֶת־כׇּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ וְאֶת־הַנֶּפֶשׁ אֲשֶׁר־עָשׂוּ בְחָרָן וַיֵּצְאוּ לָלֶכֶת אַרְצָה כְּנַעַן וַיָּבֹאוּ אַרְצָה כְּנָעַן׃","tm":"וַיִּקַּ֣ח אַבְרָם֩ אֶת־שָׂרַ֨י אִשְׁתּ֜וֹ וְאֶת־ל֣וֹט בֶּן־אָחִ֗יו וְאֶת־כׇּל־רְכוּשָׁם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְאֶת־הַנֶּ֖פֶשׁ אֲשֶׁר־עָשׂ֣וּ בְחָרָ֑ן וַיֵּצְא֗וּ לָלֶ֙כֶת֙ אַ֣רְצָה כְּנַ֔עַן וַיָּבֹ֖אוּ אַ֥רְצָה כְּנָֽעַן׃","cite":"בראשית יב, ה"},"G12:6":{"nk":"וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה וְהַכְּנַעֲנִי אָז בָּאָרֶץ׃","tm":"וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃","cite":"בראשית יב, ו"},"G12:7":{"nk":"וַיֵּרָא ה' אֶל־אַבְרָם וַיֹּאמֶר לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת וַיִּבֶן שָׁם מִזְבֵּחַ לַה' הַנִּרְאֶה אֵלָיו׃","tm":"וַיֵּרָ֤א ה' אֶל־אַבְרָ֔ם וַיֹּ֕אמֶר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַה' הַנִּרְאֶ֥ה אֵלָֽיו׃","cite":"בראשית יב, ז"},"G12:8":{"nk":"וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵית־אֵל וַיֵּט אׇהֳלֹה בֵּית־אֵל מִיָּם וְהָעַי מִקֶּדֶם וַיִּבֶן־שָׁם מִזְבֵּחַ לַה' וַיִּקְרָא בְּשֵׁם ה'׃","tm":"וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אׇהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַה' וַיִּקְרָ֖א בְּשֵׁ֥ם ה'׃","cite":"בראשית יב, ח"},"G12:9":{"nk":"וַיִּסַּע אַבְרָם הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה׃","tm":"וַיִּסַּ֣ע אַבְרָ֔ם הָל֥וֹךְ וְנָס֖וֹעַ הַנֶּֽגְבָּה׃","cite":"בראשית יב, ט"},"G12:10":{"nk":"וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם כִּי־כָבֵד הָרָעָב בָּאָרֶץ׃","tm":"וַיְהִ֥י רָעָ֖ב בָּאָ֑רֶץ וַיֵּ֨רֶד אַבְרָ֤ם מִצְרַ֙יְמָה֙ לָג֣וּר שָׁ֔ם כִּֽי־כָבֵ֥ד הָרָעָ֖ב בָּאָֽרֶץ׃","cite":"בראשית יב, י"},"G12:11":{"nk":"וַיְהִי כַּאֲשֶׁר הִקְרִיב לָבוֹא מִצְרָיְמָה וַיֹּאמֶר אֶל־שָׂרַי אִשְׁתּוֹ הִנֵּה־נָא יָדַעְתִּי כִּי אִשָּׁה יְפַת־מַרְאֶה אָתְּ׃","tm":"וַיְהִ֕י כַּאֲשֶׁ֥ר הִקְרִ֖יב לָב֣וֹא מִצְרָ֑יְמָה וַיֹּ֙אמֶר֙ אֶל־שָׂרַ֣י אִשְׁתּ֔וֹ הִנֵּה־נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת־מַרְאֶ֖ה אָֽתְּ׃","cite":"בראשית יב, יא"},"G12:12":{"nk":"וְהָיָה כִּי־יִרְאוּ אֹתָךְ הַמִּצְרִים וְאָמְרוּ אִשְׁתּוֹ זֹאת וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּוּ׃","tm":"וְהָיָ֗ה כִּֽי־יִרְא֤וּ אֹתָךְ֙ הַמִּצְרִ֔ים וְאָמְר֖וּ אִשְׁתּ֣וֹ זֹ֑את וְהָרְג֥וּ אֹתִ֖י וְאֹתָ֥ךְ יְחַיּֽוּ׃","cite":"בראשית יב, יב"},"G12:13":{"nk":"אִמְרִי־נָא אֲחֹתִי אָתְּ לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ׃","tm":"אִמְרִי־נָ֖א אֲחֹ֣תִי אָ֑תְּ לְמַ֙עַן֙ יִֽיטַב־לִ֣י בַעֲבוּרֵ֔ךְ וְחָיְתָ֥ה נַפְשִׁ֖י בִּגְלָלֵֽךְ׃","cite":"בראשית יב, יג"},"G12:14":{"nk":"וַיְהִי כְּבוֹא אַבְרָם מִצְרָיְמָה וַיִּרְאוּ הַמִּצְרִים אֶת־הָאִשָּׁה כִּי־יָפָה הִוא מְאֹד׃","tm":"וַיְהִ֕י כְּב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָה וַיִּרְא֤וּ הַמִּצְרִים֙ אֶת־הָ֣אִשָּׁ֔ה כִּֽי־יָפָ֥ה הִ֖וא מְאֹֽד׃","cite":"בראשית יב, יד"},"G12:15":{"nk":"וַיִּרְאוּ אֹתָהּ שָׂרֵי פַרְעֹה וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה׃","tm":"וַיִּרְא֤וּ אֹתָהּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַיְהַֽלְל֥וּ אֹתָ֖הּ אֶל־פַּרְעֹ֑ה וַתֻּקַּ֥ח הָאִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה׃","cite":"בראשית יב, טו"},"G12:16":{"nk":"וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ וַיְהִי־לוֹ צֹאן־וּבָקָר וַחֲמֹרִים וַעֲבָדִים וּשְׁפָחֹת וַאֲתֹנֹת וּגְמַלִּים׃","tm":"וּלְאַבְרָ֥ם הֵיטִ֖יב בַּעֲבוּרָ֑הּ וַֽיְהִי־ל֤וֹ צֹאן־וּבָקָר֙ וַחֲמֹרִ֔ים וַעֲבָדִים֙ וּשְׁפָחֹ֔ת וַאֲתֹנֹ֖ת וּגְמַלִּֽים׃","cite":"בראשית יב, טז"},"G12:17":{"nk":"וַיְנַגַּע ה' אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָם׃","tm":"וַיְנַגַּ֨ע ה' ׀ אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃","cite":"בראשית יב, יז"},"G12:18":{"nk":"וַיִּקְרָא פַרְעֹה לְאַבְרָם וַיֹּאמֶר מַה־זֹּאת עָשִׂיתָ לִּי לָמָּה לֹא־הִגַּדְתָּ לִּי כִּי אִשְׁתְּךָ הִוא׃","tm":"וַיִּקְרָ֤א פַרְעֹה֙ לְאַבְרָ֔ם וַיֹּ֕אמֶר מַה־זֹּ֖את עָשִׂ֣יתָ לִּ֑י לָ֚מָּה לֹא־הִגַּ֣דְתָּ לִּ֔י כִּ֥י אִשְׁתְּךָ֖ הִֽוא׃","cite":"בראשית יב, יח"},"G12:19":{"nk":"לָמָה אָמַרְתָּ אֲחֹתִי הִוא וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה וְעַתָּה הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ׃","tm":"לָמָ֤ה אָמַ֙רְתָּ֙ אֲחֹ֣תִי הִ֔וא וָאֶקַּ֥ח אֹתָ֛הּ לִ֖י לְאִשָּׁ֑ה וְעַתָּ֕ה הִנֵּ֥ה אִשְׁתְּךָ֖ קַ֥ח וָלֵֽךְ׃","cite":"בראשית יב, יט"},"G12:20":{"nk":"וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כׇּל־אֲשֶׁר־לוֹ׃","tm":"וַיְצַ֥ו עָלָ֛יו פַּרְעֹ֖ה אֲנָשִׁ֑ים וַֽיְשַׁלְּח֥וּ אֹת֛וֹ וְאֶת־אִשְׁתּ֖וֹ וְאֶת־כׇּל־אֲשֶׁר־לֽוֹ׃","cite":"בראשית יב, כ"},"G15:1":{"nk":"אַחַר הַדְּבָרִים הָאֵלֶּה הָיָה דְבַר־ה' אֶל־אַבְרָם בַּמַּחֲזֶה לֵאמֹר אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד׃","tm":"אַחַ֣ר ׀ הַדְּבָרִ֣ים הָאֵ֗לֶּה הָיָ֤ה דְבַר־ה' אֶל־אַבְרָ֔ם בַּֽמַּחֲזֶ֖ה לֵאמֹ֑ר אַל־תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔ךְ שְׂכָרְךָ֖ הַרְבֵּ֥ה מְאֹֽד׃","cite":"בראשית טו, א"},"G15:2":{"nk":"וַיֹּאמֶר אַבְרָם אֲדֹנָי ה' מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר׃","tm":"וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י ה' מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר׃","cite":"בראשית טו, ב"},"G15:3":{"nk":"וַיֹּאמֶר אַבְרָם הֵן לִי לֹא נָתַתָּה זָרַע וְהִנֵּה בֶן־בֵּיתִי יוֹרֵשׁ אֹתִי׃","tm":"וַיֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔י לֹ֥א נָתַ֖תָּה זָ֑רַע וְהִנֵּ֥ה בֶן־בֵּיתִ֖י יוֹרֵ֥שׁ אֹתִֽי׃","cite":"בראשית טו, ג"},"G15:4":{"nk":"וְהִנֵּה דְבַר־ה' אֵלָיו לֵאמֹר לֹא יִירָשְׁךָ זֶה כִּי־אִם אֲשֶׁר יֵצֵא מִמֵּעֶיךָ הוּא יִירָשֶׁךָ׃","tm":"וְהִנֵּ֨ה דְבַר־ה' אֵלָיו֙ לֵאמֹ֔ר לֹ֥א יִֽירָשְׁךָ֖ זֶ֑ה כִּי־אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִמֵּעֶ֔יךָ ה֖וּא יִֽירָשֶֽׁךָ׃","cite":"בראשית טו, ד"},"G15:5":{"nk":"וַיּוֹצֵא אֹתוֹ הַחוּצָה וַיֹּאמֶר הַבֶּט־נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים אִם־תּוּכַל לִסְפֹּר אֹתָם וַיֹּאמֶר לוֹ כֹּה יִהְיֶה זַרְעֶךָ׃","tm":"וַיּוֹצֵ֨א אֹת֜וֹ הַח֗וּצָה וַיֹּ֙אמֶר֙ הַבֶּט־נָ֣א הַשָּׁמַ֗יְמָה וּסְפֹר֙ הַכּ֣וֹכָבִ֔ים אִם־תּוּכַ֖ל לִסְפֹּ֣ר אֹתָ֑ם וַיֹּ֣אמֶר ל֔וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽךָ׃","cite":"בראשית טו, ה"},"G15:6":{"nk":"וְהֶאֱמִן בַּה' וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה׃","tm":"וְהֶאֱמִ֖ן בַּה' וַיַּחְשְׁבֶ֥הָ לּ֖וֹ צְדָקָֽה׃","cite":"בראשית טו, ו"},"G15:7":{"nk":"וַיֹּאמֶר אֵלָיו אֲנִי ה' אֲשֶׁר הוֹצֵאתִיךָ מֵאוּר כַּשְׂדִּים לָתֶת לְךָ אֶת־הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ׃","tm":"וַיֹּ֖אמֶר אֵלָ֑יו אֲנִ֣י ה' אֲשֶׁ֤ר הוֹצֵאתִ֙יךָ֙ מֵא֣וּר כַּשְׂדִּ֔ים לָ֧תֶת לְךָ֛ אֶת־הָאָ֥רֶץ הַזֹּ֖את לְרִשְׁתָּֽהּ׃","cite":"בראשית טו, ז"},"G15:8":{"nk":"וַיֹּאמַר אֲדֹנָי ה' בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה׃","tm":"וַיֹּאמַ֑ר אֲדֹנָ֣י ה' בַּמָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁנָּה׃","cite":"בראשית טו, ח"},"G15:9":{"nk":"וַיֹּאמֶר אֵלָיו קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָל׃","tm":"וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת וְאַ֣יִל מְשֻׁלָּ֑שׁ וְתֹ֖ר וְגוֹזָֽל׃","cite":"בראשית טו, ט"},"G15:10":{"nk":"וַיִּקַּח־לוֹ אֶת־כׇּל־אֵלֶּה וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ וְאֶת־הַצִּפֹּר לֹא בָתָר׃","tm":"וַיִּֽקַּֽח־ל֣וֹ אֶת־כׇּל־אֵ֗לֶּה וַיְבַתֵּ֤ר אֹתָם֙ בַּתָּ֔וֶךְ וַיִּתֵּ֥ן אִישׁ־בִּתְר֖וֹ לִקְרַ֣את רֵעֵ֑הוּ וְאֶת־הַצִּפֹּ֖ר לֹ֥א בָתָֽר׃","cite":"בראשית טו, י"},"G15:11":{"nk":"וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים וַיַּשֵּׁב אֹתָם אַבְרָם׃","tm":"וַיֵּ֥רֶד הָעַ֖יִט עַל־הַפְּגָרִ֑ים וַיַּשֵּׁ֥ב אֹתָ֖ם אַבְרָֽם׃","cite":"בראשית טו, יא"},"G15:12":{"nk":"וַיְהִי הַשֶּׁמֶשׁ לָבוֹא וְתַרְדֵּמָה נָפְלָה עַל־אַבְרָם וְהִנֵּה אֵימָה חֲשֵׁכָה גְדֹלָה נֹפֶלֶת עָלָיו׃","tm":"וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ לָב֔וֹא וְתַרְדֵּמָ֖ה נָפְלָ֣ה עַל־אַבְרָ֑ם וְהִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽיו׃","cite":"בראשית טו, יב"},"G15:13":{"nk":"וַיֹּאמֶר לְאַבְרָם יָדֹעַ תֵּדַע כִּי־גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה׃","tm":"וַיֹּ֣אמֶר לְאַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי־גֵ֣ר ׀ יִהְיֶ֣ה זַרְעֲךָ֗ בְּאֶ֙רֶץ֙ לֹ֣א לָהֶ֔ם וַעֲבָד֖וּם וְעִנּ֣וּ אֹתָ֑ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃","cite":"בראשית טו, יג"},"G15:14":{"nk":"וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל׃","tm":"וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ בִּרְכֻ֥שׁ גָּדֽוֹל׃","cite":"בראשית טו, יד"},"G15:15":{"nk":"וְאַתָּה תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם תִּקָּבֵר בְּשֵׂיבָה טוֹבָה׃","tm":"וְאַתָּ֛ה תָּב֥וֹא אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃","cite":"בראשית טו, טו"},"G15:16":{"nk":"וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי עַד־הֵנָּה׃","tm":"וְד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא־שָׁלֵ֛ם עֲוֺ֥ן הָאֱמֹרִ֖י עַד־הֵֽנָּה׃","cite":"בראשית טו, טז"},"G15:17":{"nk":"וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה׃","tm":"וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃","cite":"בראשית טו, יז"},"G15:18":{"nk":"בַּיּוֹם הַהוּא כָּרַת ה' אֶת־אַבְרָם בְּרִית לֵאמֹר לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת׃","tm":"בַּיּ֣וֹם הַה֗וּא כָּרַ֧ת ה' אֶת־אַבְרָ֖ם בְּרִ֣ית לֵאמֹ֑ר לְזַרְעֲךָ֗ נָתַ֙תִּי֙ אֶת־הָאָ֣רֶץ הַזֹּ֔את מִנְּהַ֣ר מִצְרַ֔יִם עַד־הַנָּהָ֥ר הַגָּדֹ֖ל נְהַר־פְּרָֽת׃","cite":"בראשית טו, יח"},"G15:19":{"nk":"אֶת־הַקֵּינִי וְאֶת־הַקְּנִזִּי וְאֵת הַקַּדְמֹנִי׃","tm":"אֶת־הַקֵּינִי֙ וְאֶת־הַקְּנִזִּ֔י וְאֵ֖ת הַקַּדְמֹנִֽי׃","cite":"בראשית טו, יט"},"G15:20":{"nk":"וְאֶת־הַחִתִּי וְאֶת־הַפְּרִזִּי וְאֶת־הָרְפָאִים׃","tm":"וְאֶת־הַחִתִּ֥י וְאֶת־הַפְּרִזִּ֖י וְאֶת־הָרְפָאִֽים׃","cite":"בראשית טו, כ"},"G15:21":{"nk":"וְאֶת־הָאֱמֹרִי וְאֶת־הַכְּנַעֲנִי וְאֶת־הַגִּרְגָּשִׁי וְאֶת־הַיְבוּסִי׃","tm":"וְאֶת־הָֽאֱמֹרִי֙ וְאֶת־הַֽכְּנַעֲנִ֔י וְאֶת־הַגִּרְגָּשִׁ֖י וְאֶת־הַיְבוּסִֽי׃","cite":"בראשית טו, כא"},"G17:1":{"nk":"וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים וַיֵּרָא ה' אֶל־אַבְרָם וַיֹּאמֶר אֵלָיו אֲנִי־אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים׃","tm":"וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א ה' אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְפָנַ֖י וֶהְיֵ֥ה תָמִֽים׃","cite":"בראשית יז, א"},"G17:2":{"nk":"וְאֶתְּנָה בְרִיתִי בֵּינִי וּבֵינֶךָ וְאַרְבֶּה אוֹתְךָ בִּמְאֹד מְאֹד׃","tm":"וְאֶתְּנָ֥ה בְרִיתִ֖י בֵּינִ֣י וּבֵינֶ֑ךָ וְאַרְבֶּ֥ה אוֹתְךָ֖ בִּמְאֹ֥ד מְאֹֽד׃","cite":"בראשית יז, ב"},"G17:3":{"nk":"וַיִּפֹּל אַבְרָם עַל־פָּנָיו וַיְדַבֵּר אִתּוֹ אֱלֹהִים לֵאמֹר׃","tm":"וַיִּפֹּ֥ל אַבְרָ֖ם עַל־פָּנָ֑יו וַיְדַבֵּ֥ר אִתּ֛וֹ אֱלֹהִ֖ים לֵאמֹֽר׃","cite":"בראשית יז, ג"},"G17:4":{"nk":"אֲנִי הִנֵּה בְרִיתִי אִתָּךְ וְהָיִיתָ לְאַב הֲמוֹן גּוֹיִם׃","tm":"אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖י אִתָּ֑ךְ וְהָיִ֕יתָ לְאַ֖ב הֲמ֥וֹן גּוֹיִֽם׃","cite":"בראשית יז, ד"},"G17:5":{"nk":"וְלֹא־יִקָּרֵא עוֹד אֶת־שִׁמְךָ אַבְרָם וְהָיָה שִׁמְךָ אַבְרָהָם כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ׃","tm":"וְלֹא־יִקָּרֵ֥א ע֛וֹד אֶת־שִׁמְךָ֖ אַבְרָ֑ם וְהָיָ֤ה שִׁמְךָ֙ אַבְרָהָ֔ם כִּ֛י אַב־הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽיךָ׃","cite":"בראשית יז, ה"},"G17:6":{"nk":"וְהִפְרֵתִי אֹתְךָ בִּמְאֹד מְאֹד וּנְתַתִּיךָ לְגוֹיִם וּמְלָכִים מִמְּךָ יֵצֵאוּ׃","tm":"וְהִפְרֵתִ֤י אֹֽתְךָ֙ בִּמְאֹ֣ד מְאֹ֔ד וּנְתַתִּ֖יךָ לְגוֹיִ֑ם וּמְלָכִ֖ים מִמְּךָ֥ יֵצֵֽאוּ׃","cite":"בראשית יז, ו"},"G17:7":{"nk":"וַהֲקִמֹתִי אֶת־בְּרִיתִי בֵּינִי וּבֵינֶךָ וּבֵין זַרְעֲךָ אַחֲרֶיךָ לְדֹרֹתָם לִבְרִית עוֹלָם לִהְיוֹת לְךָ לֵאלֹהִים וּלְזַרְעֲךָ אַחֲרֶיךָ׃","tm":"וַהֲקִמֹתִ֨י אֶת־בְּרִיתִ֜י בֵּינִ֣י וּבֵינֶ֗ךָ וּבֵ֨ין זַרְעֲךָ֧ אַחֲרֶ֛יךָ לְדֹרֹתָ֖ם לִבְרִ֣ית עוֹלָ֑ם לִהְי֤וֹת לְךָ֙ לֵֽאלֹהִ֔ים וּֽלְזַרְעֲךָ֖ אַחֲרֶֽיךָ׃","cite":"בראשית יז, ז"},"G17:8":{"nk":"וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ אֵת אֶרֶץ מְגֻרֶיךָ אֵת כׇּל־אֶרֶץ כְּנַעַן לַאֲחֻזַּת עוֹלָם וְהָיִיתִי לָהֶם לֵאלֹהִים׃","tm":"וְנָתַתִּ֣י לְ֠ךָ֠ וּלְזַרְעֲךָ֨ אַחֲרֶ֜יךָ אֵ֣ת ׀ אֶ֣רֶץ מְגֻרֶ֗יךָ אֵ֚ת כׇּל־אֶ֣רֶץ כְּנַ֔עַן לַאֲחֻזַּ֖ת עוֹלָ֑ם וְהָיִ֥יתִי לָהֶ֖ם לֵאלֹהִֽים׃","cite":"בראשית יז, ח"},"G17:9":{"nk":"וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם וְאַתָּה אֶת־בְּרִיתִי תִשְׁמֹר אַתָּה וְזַרְעֲךָ אַחֲרֶיךָ לְדֹרֹתָם׃","tm":"וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־אַבְרָהָ֔ם וְאַתָּ֖ה אֶת־בְּרִיתִ֣י תִשְׁמֹ֑ר אַתָּ֛ה וְזַרְעֲךָ֥ אַֽחֲרֶ֖יךָ לְדֹרֹתָֽם׃","cite":"בראשית יז, ט"},"G17:10":{"nk":"זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ הִמּוֹל לָכֶם כׇּל־זָכָר׃","tm":"זֹ֣את בְּרִיתִ֞י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם וּבֵ֥ין זַרְעֲךָ֖ אַחֲרֶ֑יךָ הִמּ֥וֹל לָכֶ֖ם כׇּל־זָכָֽר׃","cite":"בראשית יז, י"},"G17:11":{"nk":"וּנְמַלְתֶּם אֵת בְּשַׂר עׇרְלַתְכֶם וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם׃","tm":"וּנְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עׇרְלַתְכֶ֑ם וְהָיָה֙ לְא֣וֹת בְּרִ֔ית בֵּינִ֖י וּבֵינֵיכֶֽם׃","cite":"בראשית יז, יא"},"G17:12":{"nk":"וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כׇּל־זָכָר לְדֹרֹתֵיכֶם יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מִכֹּל בֶּן־נֵכָר אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא׃","tm":"וּבֶן־שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָכֶ֛ם כׇּל־זָכָ֖ר לְדֹרֹתֵיכֶ֑ם יְלִ֣יד בָּ֔יִת וּמִקְנַת־כֶּ֙סֶף֙ מִכֹּ֣ל בֶּן־נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽזַּרְעֲךָ֖ הֽוּא׃","cite":"בראשית יז, יב"},"G17:13":{"nk":"הִמּוֹל יִמּוֹל יְלִיד בֵּיתְךָ וּמִקְנַת כַּסְפֶּךָ וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם׃","tm":"הִמּ֧וֹל ׀ יִמּ֛וֹל יְלִ֥יד בֵּֽיתְךָ֖ וּמִקְנַ֣ת כַּסְפֶּ֑ךָ וְהָיְתָ֧ה בְרִיתִ֛י בִּבְשַׂרְכֶ֖ם לִבְרִ֥ית עוֹלָֽם׃","cite":"בראשית יז, יג"},"G17:14":{"nk":"וְעָרֵל זָכָר אֲשֶׁר לֹא־יִמּוֹל אֶת־בְּשַׂר עׇרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ אֶת־בְּרִיתִי הֵפַר׃","tm":"וְעָרֵ֣ל ׀ זָכָ֗ר אֲשֶׁ֤ר לֹֽא־יִמּוֹל֙ אֶת־בְּשַׂ֣ר עׇרְלָת֔וֹ וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּ֑יהָ אֶת־בְּרִיתִ֖י הֵפַֽר׃","cite":"בראשית יז, יד"},"G17:15":{"nk":"וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם שָׂרַי אִשְׁתְּךָ לֹא־תִקְרָא אֶת־שְׁמָהּ שָׂרָי כִּי שָׂרָה שְׁמָהּ׃","tm":"וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּךָ֔ לֹא־תִקְרָ֥א אֶת־שְׁמָ֖הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽהּ׃","cite":"בראשית יז, טו"},"G17:16":{"nk":"וּבֵרַכְתִּי אֹתָהּ וְגַם נָתַתִּי מִמֶּנָּה לְךָ בֵּן וּבֵרַכְתִּיהָ וְהָיְתָה לְגוֹיִם מַלְכֵי עַמִּים מִמֶּנָּה יִהְיוּ׃","tm":"וּבֵרַכְתִּ֣י אֹתָ֔הּ וְגַ֨ם נָתַ֧תִּי מִמֶּ֛נָּה לְךָ֖ בֵּ֑ן וּבֵֽרַכְתִּ֙יהָ֙ וְהָֽיְתָ֣ה לְגוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥נָּה יִהְיֽוּ׃","cite":"בראשית יז, טז"},"G17:17":{"nk":"וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו וַיִּצְחָק וַיֹּאמֶר בְּלִבּוֹ הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד׃","tm":"וַיִּפֹּ֧ל אַבְרָהָ֛ם עַל־פָּנָ֖יו וַיִּצְחָ֑ק וַיֹּ֣אמֶר בְּלִבּ֗וֹ הַלְּבֶ֤ן מֵאָֽה־שָׁנָה֙ יִוָּלֵ֔ד וְאִ֨ם־שָׂרָ֔ה הֲבַת־תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד׃","cite":"בראשית יז, יז"},"G17:18":{"nk":"וַיֹּאמֶר אַבְרָהָם אֶל־הָאֱלֹהִים לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ׃","tm":"וַיֹּ֥אמֶר אַבְרָהָ֖ם אֶל־הָֽאֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְפָנֶֽיךָ׃","cite":"בראשית יז, יח"},"G17:19":{"nk":"וַיֹּאמֶר אֱלֹהִים אֲבָל שָׂרָה אִשְׁתְּךָ יֹלֶדֶת לְךָ בֵּן וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ לִבְרִית עוֹלָם לְזַרְעוֹ אַחֲרָיו׃","tm":"וַיֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּךָ֗ יֹלֶ֤דֶת לְךָ֙ בֵּ֔ן וְקָרָ֥אתָ אֶת־שְׁמ֖וֹ יִצְחָ֑ק וַהֲקִמֹתִ֨י אֶת־בְּרִיתִ֥י אִתּ֛וֹ לִבְרִ֥ית עוֹלָ֖ם לְזַרְע֥וֹ אַחֲרָֽיו׃","cite":"בראשית יז, יט"},"G17:20":{"nk":"וּלְיִשְׁמָעֵאל שְׁמַעְתִּיךָ הִנֵּה בֵּרַכְתִּי אֹתוֹ וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד שְׁנֵים־עָשָׂר נְשִׂיאִם יוֹלִיד וּנְתַתִּיו לְגוֹי גָּדוֹל׃","tm":"וּֽלְיִשְׁמָעֵאל֮ שְׁמַעְתִּ֒יךָ֒ הִנֵּ֣ה ׀ בֵּרַ֣כְתִּי אֹת֗וֹ וְהִפְרֵיתִ֥י אֹת֛וֹ וְהִרְבֵּיתִ֥י אֹת֖וֹ בִּמְאֹ֣ד מְאֹ֑ד שְׁנֵים־עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּנְתַתִּ֖יו לְג֥וֹי גָּדֽוֹל׃","cite":"בראשית יז, כ"},"G17:21":{"nk":"וְאֶת־בְּרִיתִי אָקִים אֶת־יִצְחָק אֲשֶׁר תֵּלֵד לְךָ שָׂרָה לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת׃","tm":"וְאֶת־בְּרִיתִ֖י אָקִ֣ים אֶת־יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְךָ֤ שָׂרָה֙ לַמּוֹעֵ֣ד הַזֶּ֔ה בַּשָּׁנָ֖ה הָאַחֶֽרֶת׃","cite":"בראשית יז, כא"},"G17:22":{"nk":"וַיְכַל לְדַבֵּר אִתּוֹ וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָם׃","tm":"וַיְכַ֖ל לְדַבֵּ֣ר אִתּ֑וֹ וַיַּ֣עַל אֱלֹהִ֔ים מֵעַ֖ל אַבְרָהָֽם׃","cite":"בראשית יז, כב"},"G17:23":{"nk":"וַיִּקַּח אַבְרָהָם אֶת־יִשְׁמָעֵאל בְּנוֹ וְאֵת כׇּל־יְלִידֵי בֵיתוֹ וְאֵת כׇּל־מִקְנַת כַּסְפּוֹ כׇּל־זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם וַיָּמׇל אֶת־בְּשַׂר עׇרְלָתָם בְּעֶצֶם הַיּוֹם הַזֶּה כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים׃","tm":"וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־יִשְׁמָעֵ֣אל בְּנ֗וֹ וְאֵ֨ת כׇּל־יְלִידֵ֤י בֵיתוֹ֙ וְאֵת֙ כׇּל־מִקְנַ֣ת כַּסְפּ֔וֹ כׇּל־זָכָ֕ר בְּאַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַיָּ֜מׇל אֶת־בְּשַׂ֣ר עׇרְלָתָ֗ם בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה כַּאֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖וֹ אֱלֹהִֽים׃","cite":"בראשית יז, כג"},"G17:24":{"nk":"וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה בְּהִמֹּלוֹ בְּשַׂר עׇרְלָתוֹ׃","tm":"וְאַ֨בְרָהָ֔ם בֶּן־תִּשְׁעִ֥ים וָתֵ֖שַׁע שָׁנָ֑ה בְּהִמֹּל֖וֹ בְּשַׂ֥ר עׇרְלָתֽוֹ׃","cite":"בראשית יז, כד"},"G17:25":{"nk":"וְיִשְׁמָעֵאל בְּנוֹ בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה בְּהִמֹּלוֹ אֵת בְּשַׂר עׇרְלָתוֹ׃","tm":"וְיִשְׁמָעֵ֣אל בְּנ֔וֹ בֶּן־שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה בְּהִ֨מֹּל֔וֹ אֵ֖ת בְּשַׂ֥ר עׇרְלָתֽוֹ׃","cite":"בראשית יז, כה"},"G17:26":{"nk":"בְּעֶצֶם הַיּוֹם הַזֶּה נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנוֹ׃","tm":"בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה נִמּ֖וֹל אַבְרָהָ֑ם וְיִשְׁמָעֵ֖אל בְּנֽוֹ׃","cite":"בראשית יז, כו"},"G17:27":{"nk":"וְכׇל־אַנְשֵׁי בֵיתוֹ יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מֵאֵת בֶּן־נֵכָר נִמֹּלוּ אִתּוֹ׃","tm":"וְכׇל־אַנְשֵׁ֤י בֵיתוֹ֙ יְלִ֣יד בָּ֔יִת וּמִקְנַת־כֶּ֖סֶף מֵאֵ֣ת בֶּן־נֵכָ֑ר נִמֹּ֖לוּ אִתּֽוֹ׃","cite":"בראשית יז, כז"},"J1:1":{"nk":"וַיְהִי דְּבַר־ה' אֶל־יוֹנָה בֶן־אֲמִתַּי לֵאמֹר׃","tm":"וַֽיְהִי֙ דְּבַר־ה' אֶל־יוֹנָ֥ה בֶן־אֲמִתַּ֖י לֵאמֹֽר׃","cite":"יונה א, א"},"J1:2":{"nk":"קוּם לֵךְ אֶל־נִינְוֵה הָעִיר הַגְּדוֹלָה וּקְרָא עָלֶיהָ כִּי־עָלְתָה רָעָתָם לְפָנָי׃","tm":"ק֠וּם לֵ֧ךְ אֶל־נִֽינְוֵ֛ה הָעִ֥יר הַגְּדוֹלָ֖ה וּקְרָ֣א עָלֶ֑יהָ כִּֽי־עָלְתָ֥ה רָעָתָ֖ם לְפָנָֽי׃","cite":"יונה א, ב"},"J1:3":{"nk":"וַיָּקׇם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי ה' וַיֵּרֶד יָפוֹ וַיִּמְצָא אֳנִיָּה בָּאָה תַרְשִׁישׁ וַיִּתֵּן שְׂכָרָהּ וַיֵּרֶד בָּהּ לָבוֹא עִמָּהֶם תַּרְשִׁישָׁה מִלִּפְנֵי ה'׃","tm":"וַיָּ֤קׇם יוֹנָה֙ לִבְרֹ֣חַ תַּרְשִׁ֔ישָׁה מִלִּפְנֵ֖י ה' וַיֵּ֨רֶד יָפ֜וֹ וַיִּמְצָ֥א אֳנִיָּ֣ה ׀ בָּאָ֣ה תַרְשִׁ֗ישׁ וַיִּתֵּ֨ן שְׂכָרָ֜הּ וַיֵּ֤רֶד בָּהּ֙ לָב֤וֹא עִמָּהֶם֙ תַּרְשִׁ֔ישָׁה מִלִּפְנֵ֖י ה'׃","cite":"יונה א, ג"},"J1:4":{"nk":"וַה' הֵטִיל רוּחַ־גְּדוֹלָה אֶל־הַיָּם וַיְהִי סַעַר־גָּדוֹל בַּיָּם וְהָאֳנִיָּה חִשְּׁבָה לְהִשָּׁבֵר׃","tm":"וַה' הֵטִ֤יל רֽוּחַ־גְּדוֹלָה֙ אֶל־הַיָּ֔ם וַיְהִ֥י סַֽעַר־גָּד֖וֹל בַּיָּ֑ם וְהָ֣אֳנִיָּ֔ה חִשְּׁבָ֖ה לְהִשָּׁבֵֽר׃","cite":"יונה א, ד"},"J1:5":{"nk":"וַיִּירְאוּ הַמַּלָּחִים וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו וַיָּטִלוּ אֶת־הַכֵּלִים אֲשֶׁר בָּאֳנִיָּה אֶל־הַיָּם לְהָקֵל מֵעֲלֵיהֶם וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם׃","tm":"וַיִּֽירְא֣וּ הַמַּלָּחִ֗ים וַֽיִּזְעֲקוּ֮ אִ֣ישׁ אֶל־אֱלֹהָיו֒ וַיָּטִ֨לוּ אֶת־הַכֵּלִ֜ים אֲשֶׁ֤ר בָּֽאֳנִיָּה֙ אֶל־הַיָּ֔ם לְהָקֵ֖ל מֵֽעֲלֵיהֶ֑ם וְיוֹנָ֗ה יָרַד֙ אֶל־יַרְכְּתֵ֣י הַסְּפִינָ֔ה וַיִּשְׁכַּ֖ב וַיֵּרָדַֽם׃","cite":"יונה א, ה"},"J1:6":{"nk":"וַיִּקְרַב אֵלָיו רַב הַחֹבֵל וַיֹּאמֶר לוֹ מַה־לְּךָ נִרְדָּם קוּם קְרָא אֶל־אֱלֹהֶיךָ אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵד׃","tm":"וַיִּקְרַ֤ב אֵלָיו֙ רַ֣ב הַחֹבֵ֔ל וַיֹּ֥אמֶר ל֖וֹ מַה־לְּךָ֣ נִרְדָּ֑ם ק֚וּם קְרָ֣א אֶל־אֱלֹהֶ֔יךָ אוּלַ֞י יִתְעַשֵּׁ֧ת הָאֱלֹהִ֛ים לָ֖נוּ וְלֹ֥א נֹאבֵֽד׃","cite":"יונה א, ו"},"J1:7":{"nk":"וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ לְכוּ וְנַפִּילָה גוֹרָלוֹת וְנֵדְעָה בְּשֶׁלְּמִי הָרָעָה הַזֹּאת לָנוּ וַיַּפִּלוּ גּוֹרָלוֹת וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה׃","tm":"וַיֹּאמְר֞וּ אִ֣ישׁ אֶל־רֵעֵ֗הוּ לְכוּ֙ וְנַפִּ֣ילָה גֽוֹרָל֔וֹת וְנֵ֣דְעָ֔ה בְּשֶׁלְּמִ֛י הָרָעָ֥ה הַזֹּ֖את לָ֑נוּ וַיַּפִּ֙לוּ֙ גּֽוֹרָל֔וֹת וַיִּפֹּ֥ל הַגּוֹרָ֖ל עַל־יוֹנָֽה׃","cite":"יונה א, ז"},"J1:8":{"nk":"וַיֹּאמְרוּ אֵלָיו הַגִּידָה־נָּא לָנוּ בַּאֲשֶׁר לְמִי־הָרָעָה הַזֹּאת לָנוּ מַה־מְּלַאכְתְּךָ וּמֵאַיִן תָּבוֹא מָה אַרְצֶךָ וְאֵי־מִזֶּה עַם אָתָּה׃","tm":"וַיֹּאמְר֣וּ אֵלָ֔יו הַגִּידָה־נָּ֣א לָ֔נוּ בַּאֲשֶׁ֛ר לְמִי־הָרָעָ֥ה הַזֹּ֖את לָ֑נוּ מַה־מְּלַאכְתְּךָ֙ וּמֵאַ֣יִן תָּב֔וֹא מָ֣ה אַרְצֶ֔ךָ וְאֵֽי־מִזֶּ֥ה עַ֖ם אָֽתָּה׃","cite":"יונה א, ח"},"J1:9":{"nk":"וַיֹּאמֶר אֲלֵיהֶם עִבְרִי אָנֹכִי וְאֶת־ה' אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא אֲשֶׁר־עָשָׂה אֶת־הַיָּם וְאֶת־הַיַּבָּשָׁה׃","tm":"וַיֹּ֥אמֶר אֲלֵיהֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְאֶת־ה' אֱלֹהֵ֤י הַשָּׁמַ֙יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר־עָשָׂ֥ה אֶת־הַיָּ֖ם וְאֶת־הַיַּבָּשָֽׁה׃","cite":"יונה א, ט"},"J1:10":{"nk":"וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה וַיֹּאמְרוּ אֵלָיו מַה־זֹּאת עָשִׂיתָ כִּי־יָדְעוּ הָאֲנָשִׁים כִּי־מִלִּפְנֵי ה' הוּא בֹרֵחַ כִּי הִגִּיד לָהֶם׃","tm":"וַיִּֽירְא֤וּ הָֽאֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַיֹּאמְר֥וּ אֵלָ֖יו מַה־זֹּ֣את עָשִׂ֑יתָ כִּֽי־יָדְע֣וּ הָאֲנָשִׁ֗ים כִּֽי־מִלִּפְנֵ֤י ה' ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָהֶֽם׃","cite":"יונה א, י"},"J1:11":{"nk":"וַיֹּאמְרוּ אֵלָיו מַה־נַּעֲשֶׂה לָּךְ וְיִשְׁתֹּק הַיָּם מֵעָלֵינוּ כִּי הַיָּם הוֹלֵךְ וְסֹעֵר׃","tm":"וַיֹּאמְר֤וּ אֵלָיו֙ מַה־נַּ֣עֲשֶׂה לָּ֔ךְ וְיִשְׁתֹּ֥ק הַיָּ֖ם מֵֽעָלֵ֑ינוּ כִּ֥י הַיָּ֖ם הוֹלֵ֥ךְ וְסֹעֵֽר׃","cite":"יונה א, יא"},"J1:12":{"nk":"וַיֹּאמֶר אֲלֵיהֶם שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם וְיִשְׁתֹּק הַיָּם מֵעֲלֵיכֶם כִּי יוֹדֵעַ אָנִי כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה עֲלֵיכֶם׃","tm":"וַיֹּ֣אמֶר אֲלֵיהֶ֗ם שָׂא֙וּנִי֙ וַהֲטִילֻ֣נִי אֶל־הַיָּ֔ם וְיִשְׁתֹּ֥ק הַיָּ֖ם מֵֽעֲלֵיכֶ֑ם כִּ֚י יוֹדֵ֣עַ אָ֔נִי כִּ֣י בְשֶׁלִּ֔י הַסַּ֧עַר הַגָּד֛וֹל הַזֶּ֖ה עֲלֵיכֶֽם׃","cite":"יונה א, יב"},"J1:13":{"nk":"וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה וְלֹא יָכֹלוּ כִּי הַיָּם הוֹלֵךְ וְסֹעֵר עֲלֵיהֶם׃","tm":"וַיַּחְתְּר֣וּ הָאֲנָשִׁ֗ים לְהָשִׁ֛יב אֶל־הַיַּבָּשָׁ֖ה וְלֹ֣א יָכֹ֑לוּ כִּ֣י הַיָּ֔ם הוֹלֵ֥ךְ וְסֹעֵ֖ר עֲלֵיהֶֽם׃","cite":"יונה א, יג"},"J1:14":{"nk":"וַיִּקְרְאוּ אֶל־ה' וַיֹּאמְרוּ אָנָּה ה' אַל־נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא כִּי־אַתָּה ה' כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ׃","tm":"וַיִּקְרְא֨וּ אֶל־ה' וַיֹּאמְר֗וּ אָנָּ֤ה ה' אַל־נָ֣א נֹאבְדָ֗ה בְּנֶ֙פֶשׁ֙ הָאִ֣ישׁ הַזֶּ֔ה וְאַל־תִּתֵּ֥ן עָלֵ֖ינוּ דָּ֣ם נָקִ֑יא כִּֽי־אַתָּ֣ה ה' כַּאֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ׃","cite":"יונה א, יד"},"J1:15":{"nk":"וַיִּשְׂאוּ אֶת־יוֹנָה וַיְטִלֻהוּ אֶל־הַיָּם וַיַּעֲמֹד הַיָּם מִזַּעְפּוֹ׃","tm":"וַיִּשְׂאוּ֙ אֶת־יוֹנָ֔ה וַיְטִלֻ֖הוּ אֶל־הַיָּ֑ם וַיַּעֲמֹ֥ד הַיָּ֖ם מִזַּעְפּֽוֹ׃","cite":"יונה א, טו"},"J1:16":{"nk":"וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־ה' וַיִּזְבְּחוּ־זֶבַח לַה' וַיִּדְּרוּ נְדָרִים׃","tm":"וַיִּֽירְא֧וּ הָאֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת־ה' וַיִּֽזְבְּחוּ־זֶ֙בַח֙ לַה' וַֽיִּדְּר֖וּ נְדָרִֽים׃","cite":"יונה א, טז"},"J3:1":{"nk":"וַיְהִי דְבַר־ה' אֶל־יוֹנָה שֵׁנִית לֵאמֹר׃","tm":"וַיְהִ֧י דְבַר־ה' אֶל־יוֹנָ֖ה שֵׁנִ֥ית לֵאמֹֽר׃","cite":"יונה ג, א"},"J3:2":{"nk":"קוּם לֵךְ אֶל־נִינְוֵה הָעִיר הַגְּדוֹלָה וּקְרָא אֵלֶיהָ אֶת־הַקְּרִיאָה אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ׃","tm":"ק֛וּם לֵ֥ךְ אֶל־נִֽינְוֵ֖ה הָעִ֣יר הַגְּדוֹלָ֑ה וּקְרָ֤א אֵלֶ֙יהָ֙ אֶת־הַקְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽיךָ׃","cite":"יונה ג, ב"},"J3:3":{"nk":"וַיָּקׇם יוֹנָה וַיֵּלֶךְ אֶל־נִינְוֵה כִּדְבַר ה' וְנִינְוֵה הָיְתָה עִיר־גְּדוֹלָה לֵאלֹהִים מַהֲלַךְ שְׁלֹשֶׁת יָמִים׃","tm":"וַיָּ֣קׇם יוֹנָ֗ה וַיֵּ֛לֶךְ אֶל־נִֽינְוֵ֖ה כִּדְבַ֣ר ה' וְנִֽינְוֵ֗ה הָיְתָ֤ה עִיר־גְּדוֹלָה֙ לֵֽאלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים׃","cite":"יונה ג, ג"},"J3:4":{"nk":"וַיָּחֶל יוֹנָה לָבוֹא בָעִיר מַהֲלַךְ יוֹם אֶחָד וַיִּקְרָא וַיֹּאמַר עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת׃","tm":"וַיָּ֤חֶל יוֹנָה֙ לָב֣וֹא בָעִ֔יר מַהֲלַ֖ךְ י֣וֹם אֶחָ֑ד וַיִּקְרָא֙ וַיֹּאמַ֔ר ע֚וֹד אַרְבָּעִ֣ים י֔וֹם וְנִֽינְוֵ֖ה נֶהְפָּֽכֶת׃","cite":"יונה ג, ד"},"J3:5":{"nk":"וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים וַיִּקְרְאוּ־צוֹם וַיִּלְבְּשׁוּ שַׂקִּים מִגְּדוֹלָם וְעַד־קְטַנָּם׃","tm":"וַֽיַּאֲמִ֛ינוּ אַנְשֵׁ֥י נִֽינְוֵ֖ה בֵּֽאלֹהִ֑ים וַיִּקְרְאוּ־צוֹם֙ וַיִּלְבְּשׁ֣וּ שַׂקִּ֔ים מִגְּדוֹלָ֖ם וְעַד־קְטַנָּֽם׃","cite":"יונה ג, ה"},"J3:6":{"nk":"וַיִּגַּע הַדָּבָר אֶל־מֶלֶךְ נִינְוֵה וַיָּקׇם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל־הָאֵפֶר׃","tm":"וַיִּגַּ֤ע הַדָּבָר֙ אֶל־מֶ֣לֶךְ נִֽינְוֵ֔ה וַיָּ֙קׇם֙ מִכִּסְא֔וֹ וַיַּעֲבֵ֥ר אַדַּרְתּ֖וֹ מֵֽעָלָ֑יו וַיְכַ֣ס שַׂ֔ק וַיֵּ֖שֶׁב עַל־הָאֵֽפֶר׃","cite":"יונה ג, ו"},"J3:7":{"nk":"וַיַּזְעֵק וַיֹּאמֶר בְּנִינְוֵה מִטַּעַם הַמֶּלֶךְ וּגְדֹלָיו לֵאמֹר הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה אַל־יִרְעוּ וּמַיִם אַל־יִשְׁתּוּ׃","tm":"וַיַּזְעֵ֗ק וַיֹּ֙אמֶר֙ בְּנִֽינְוֵ֔ה מִטַּ֧עַם הַמֶּ֛לֶךְ וּגְדֹלָ֖יו לֵאמֹ֑ר הָאָדָ֨ם וְהַבְּהֵמָ֜ה הַבָּקָ֣ר וְהַצֹּ֗אן אַֽל־יִטְעֲמוּ֙ מְא֔וּמָה אַ֨ל־יִרְע֔וּ וּמַ֖יִם אַל־יִשְׁתּֽוּ׃","cite":"יונה ג, ז"},"J3:8":{"nk":"וְיִתְכַּסּוּ שַׂקִּים הָאָדָם וְהַבְּהֵמָה וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחׇזְקָה וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם׃","tm":"וְיִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽאָדָם֙ וְהַבְּהֵמָ֔ה וְיִקְרְא֥וּ אֶל־אֱלֹהִ֖ים בְּחׇזְקָ֑ה וְיָשֻׁ֗בוּ אִ֚ישׁ מִדַּרְכּ֣וֹ הָֽרָעָ֔ה וּמִן־הֶחָמָ֖ס אֲשֶׁ֥ר בְּכַפֵּיהֶֽם׃","cite":"יונה ג, ח"},"J3:9":{"nk":"מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵד׃","tm":"מִֽי־יוֹדֵ֣עַ יָשׁ֔וּב וְנִחַ֖ם הָאֱלֹהִ֑ים וְשָׁ֛ב מֵחֲר֥וֹן אַפּ֖וֹ וְלֹ֥א נֹאבֵֽד׃","cite":"יונה ג, ט"},"J3:10":{"nk":"וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה אֲשֶׁר־דִּבֶּר לַעֲשׂוֹת־לָהֶם וְלֹא עָשָׂה׃","tm":"וַיַּ֤רְא הָֽאֱלֹהִים֙ אֶת־מַ֣עֲשֵׂיהֶ֔ם כִּי־שָׁ֖בוּ מִדַּרְכָּ֣ם הָרָעָ֑ה וַיִּנָּ֣חֶם הָאֱלֹהִ֗ים עַל־הָרָעָ֛ה אֲשֶׁר־דִּבֶּ֥ר לַעֲשׂוֹת־לָהֶ֖ם וְלֹ֥א עָשָֽׂה׃","cite":"יונה ג, י"},"J4:1":{"nk":"וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ׃","tm":"וַיֵּ֥רַע אֶל־יוֹנָ֖ה רָעָ֣ה גְדוֹלָ֑ה וַיִּ֖חַר לֽוֹ׃","cite":"יונה ד, א"},"J4:2":{"nk":"וַיִּתְפַּלֵּל אֶל־ה' וַיֹּאמַר אָנָּה ה' הֲלוֹא־זֶה דְבָרִי עַד־הֱיוֹתִי עַל־אַדְמָתִי עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה׃","tm":"וַיִּתְפַּלֵּ֨ל אֶל־ה' וַיֹּאמַ֗ר אָנָּ֤ה ה' הֲלוֹא־זֶ֣ה דְבָרִ֗י עַד־הֱיוֹתִי֙ עַל־אַדְמָתִ֔י עַל־כֵּ֥ן קִדַּ֖מְתִּי לִבְרֹ֣חַ תַּרְשִׁ֑ישָׁה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל־חַנּ֣וּן וְרַח֔וּם אֶ֤רֶךְ אַפַּ֙יִם֙ וְרַב־חֶ֔סֶד וְנִחָ֖ם עַל־הָרָעָֽה׃","cite":"יונה ד, ב"},"J4:3":{"nk":"וְעַתָּה ה' קַח־נָא אֶת־נַפְשִׁי מִמֶּנִּי כִּי טוֹב מוֹתִי מֵחַיָּי׃","tm":"וְעַתָּ֣ה ה' קַח־נָ֥א אֶת־נַפְשִׁ֖י מִמֶּ֑נִּי כִּ֛י ט֥וֹב מוֹתִ֖י מֵחַיָּֽי׃","cite":"יונה ד, ג"},"J4:4":{"nk":"וַיֹּאמֶר ה' הַהֵיטֵב חָרָה לָךְ׃","tm":"וַיֹּ֣אמֶר ה' הַהֵיטֵ֖ב חָ֥רָה לָֽךְ׃","cite":"יונה ד, ד"},"J4:5":{"nk":"וַיֵּצֵא יוֹנָה מִן־הָעִיר וַיֵּשֶׁב מִקֶּדֶם לָעִיר וַיַּעַשׂ לוֹ שָׁם סֻכָּה וַיֵּשֶׁב תַּחְתֶּיהָ בַּצֵּל עַד אֲשֶׁר יִרְאֶה מַה־יִּהְיֶה בָּעִיר׃","tm":"וַיֵּצֵ֤א יוֹנָה֙ מִן־הָעִ֔יר וַיֵּ֖שֶׁב מִקֶּ֣דֶם לָעִ֑יר וַיַּ֩עַשׂ֩ ל֨וֹ שָׁ֜ם סֻכָּ֗ה וַיֵּ֤שֶׁב תַּחְתֶּ֙יהָ֙ בַּצֵּ֔ל עַ֚ד אֲשֶׁ֣ר יִרְאֶ֔ה מַה־יִּהְיֶ֖ה בָּעִֽיר׃","cite":"יונה ד, ה"},"J4:6":{"nk":"וַיְמַן ה'־אֱלֹהִים קִיקָיוֹן וַיַּעַל מֵעַל לְיוֹנָה לִהְיוֹת צֵל עַל־רֹאשׁוֹ לְהַצִּיל לוֹ מֵרָעָתוֹ וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה׃","tm":"וַיְמַ֣ן ה'־אֱ֠לֹהִ֠ים קִיקָי֞וֹן וַיַּ֣עַל ׀ מֵעַ֣ל לְיוֹנָ֗ה לִֽהְי֥וֹת צֵל֙ עַל־רֹאשׁ֔וֹ לְהַצִּ֥יל ל֖וֹ מֵרָֽעָת֑וֹ וַיִּשְׂמַ֥ח יוֹנָ֛ה עַל־הַקִּֽיקָי֖וֹן שִׂמְחָ֥ה גְדוֹלָֽה׃","cite":"יונה ד, ו"},"J4:7":{"nk":"וַיְמַן הָאֱלֹהִים תּוֹלַעַת בַּעֲלוֹת הַשַּׁחַר לַמׇּחֳרָת וַתַּךְ אֶת־הַקִּיקָיוֹן וַיִּיבָשׁ׃","tm":"וַיְמַ֤ן הָֽאֱלֹהִים֙ תּוֹלַ֔עַת בַּעֲל֥וֹת הַשַּׁ֖חַר לַֽמׇּחֳרָ֑ת וַתַּ֥ךְ אֶת־הַקִּֽיקָי֖וֹן וַיִּיבָֽשׁ׃","cite":"יונה ד, ז"},"J4:8":{"nk":"וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ וַיְמַן אֱלֹהִים רוּחַ קָדִים חֲרִישִׁית וַתַּךְ הַשֶּׁמֶשׁ עַל־רֹאשׁ יוֹנָה וַיִּתְעַלָּף וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי׃","tm":"וַיְהִ֣י ׀ כִּזְרֹ֣חַ הַשֶּׁ֗מֶשׁ וַיְמַ֨ן אֱלֹהִ֜ים ר֤וּחַ קָדִים֙ חֲרִישִׁ֔ית וַתַּ֥ךְ הַשֶּׁ֛מֶשׁ עַל־רֹ֥אשׁ יוֹנָ֖ה וַיִּתְעַלָּ֑ף וַיִּשְׁאַ֤ל אֶת־נַפְשׁוֹ֙ לָמ֔וּת וַיֹּ֕אמֶר ט֥וֹב מוֹתִ֖י מֵחַיָּֽי׃","cite":"יונה ד, ח"},"J4:9":{"nk":"וַיֹּאמֶר אֱלֹהִים אֶל־יוֹנָה הַהֵיטֵב חָרָה־לְךָ עַל־הַקִּיקָיוֹן וַיֹּאמֶר הֵיטֵב חָרָה־לִי עַד־מָוֶת׃","tm":"וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־יוֹנָ֔ה הַהֵיטֵ֥ב חָרָֽה־לְךָ֖ עַל־הַקִּֽיקָי֑וֹן וַיֹּ֕אמֶר הֵיטֵ֥ב חָֽרָה־לִ֖י עַד־מָֽוֶת׃","cite":"יונה ד, ט"},"J4:10":{"nk":"וַיֹּאמֶר ה' אַתָּה חַסְתָּ עַל־הַקִּיקָיוֹן אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ שֶׁבִּן־לַיְלָה הָיָה וּבִן־לַיְלָה אָבָד׃","tm":"וַיֹּ֣אמֶר ה' אַתָּ֥ה חַ֙סְתָּ֙ עַל־הַקִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא־עָמַ֥לְתָּ בּ֖וֹ וְלֹ֣א גִדַּלְתּ֑וֹ שֶׁבִּן־לַ֥יְלָה הָיָ֖ה וּבִן־לַ֥יְלָה אָבָֽד׃","cite":"יונה ד, י"},"J4:11":{"nk":"וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה הָעִיר הַגְּדוֹלָה אֲשֶׁר יֶשׁ־בָּהּ הַרְבֵּה מִשְׁתֵּים־עֶשְׂרֵה רִבּוֹ אָדָם אֲשֶׁר לֹא־יָדַע בֵּין־יְמִינוֹ לִשְׂמֹאלוֹ וּבְהֵמָה רַבָּה׃","tm":"וַֽאֲנִי֙ לֹ֣א אָח֔וּס עַל־נִינְוֵ֖ה הָעִ֣יר הַגְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ־בָּ֡הּ הַרְבֵּה֩ מִֽשְׁתֵּים־עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא־יָדַע֙ בֵּין־יְמִינ֣וֹ לִשְׂמֹאל֔וֹ וּבְהֵמָ֖ה רַבָּֽה׃","cite":"יונה ד, יא"}}};

// ================= HELPERS =================
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const pct=(r,t)=>t?Math.round(100*r/t):0;
const hasHe=s=>/[֐-׿]/.test(s);
function norm(s){return String(s).replace(/<[^>]+>/g,'').replace(/־/g,' ').replace(/[֑-ׇ]/g,'').replace(/[׳״'"`.,;:!?()\-–—׃]/g,' ')
 .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ').replace(/\s+/g,' ').trim();}
function toast(m,ms=1800){const d=document.createElement('div');d.className='toast';d.innerHTML=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
function verseHTML(ref,num=true){const V=DATA.verses[ref];const txt=S.settings.taamim?V.tm:V.nk;const n=V.cite.split(', ')[1];return `<p class="pasuk">${num?`<span class="vn">${n}</span>`:''}${esc(txt)}</p>`;}
function refTitle(refs){const a=DATA.verses[refs[0]].cite, b=DATA.verses[refs[refs.length-1]].cite;return refs.length>1?a+'–'+b.split(', ')[1]:a;}

// ================= QUESTION REGISTRY =================
const REG={};
function reg(id,q,tid,extra){const o=Object.assign({},q,extra||{},{id,topic:tid});if(q.alt&&typeof q.alt==='object'){reg(id+'.alt',q.alt,tid,{lv:q.lv});o.alt=id+'.alt';}REG[id]=o;
 if(o.t==='fill'){const others=[...new Map(o.others.map(x=>[norm(x),x])).values()].filter(x=>norm(x)!==norm(o.answer));
   REG[id+'.mc']={id:id+'.mc',topic:tid,lv:o.lv,t:'mc',q:`Which word is missing from the pasuk?<div class="pasuk-box"><p class="pasuk">${esc(o.before)}<span class="blank">&nbsp;?&nbsp;</span>${esc(o.after)}</p><div class="cite">(${o.cite})</div></div>`,o:[`<span class="he">${o.answer}</span>`].concat(pick(others,3).map(x=>`<span class="he">${x}</span>`)),why:o.why,proof:`<q class="pq">${o.before}${o.answer}${o.after}</q> <span class="cite">(${o.cite})</span>`};
   if(!o.alt)o.alt=id+'.mc';}
 return o;}
const WORDS={}, WHO={};
TOP.forEach(t=>{
 t.cards.forEach((c,ci)=>{ if(c.check) reg(`${t.id}.c${ci}`,c.check,t.id,{lv:'check'}); });
 t.quiz.forEach((q,qi)=>reg(`${t.id}.q${qi}`,q,t.id));
 // word bank (deduped)
 const seen=new Set(); WORDS[t.id]=[];
 t.cards.forEach((c,ci)=>(c.words||[]).forEach((w,wi)=>{const k=norm(w.he); if(seen.has(k)||!w.ref)return; seen.add(k); WORDS[t.id].push({id:`${t.id}.wd${ci}_${wi}`,he:w.he,en:w.en,ref:w.ref});}));
 WORDS[t.id].forEach((w,i,arr)=>{
  const others=arr.filter(x=>x!==w);
  const V=DATA.verses[w.ref];
  const proof=`<q class="pq">${w.he}</q> <span class="cite">(${V?V.cite:''})</span>`;
  REG[w.id]={id:w.id,topic:t.id,lv:1,t:'mc',gen:'word',q:`What does <span class="he">${w.he}</span> mean?`,o:[esc(w.en)].concat(pick(others,3).map(x=>esc(x.en))),why:`<span class="he">${w.he}</span> = ${esc(w.en)}.`,proof,alt:w.id+'r',look:`Break the word into its root and look at the words around it in the pasuk.`};
  REG[w.id+'r']={id:w.id+'r',topic:t.id,lv:1,t:'mc',gen:'word',q:`Which word means: <b>"${esc(w.en)}"</b>?`,o:[`<span class="he">${w.he}</span>`].concat(pick(others,3).map(x=>`<span class="he">${x.he}</span>`)),why:`"${esc(w.en)}" = <span class="he">${w.he}</span>.`,proof,alt:w.id};
 });
 WHO[t.id]=[];
 (t.who||[]).forEach((w,i)=>{const id=`${t.id}.who${i}`;WHO[t.id].push(id);
  REG[id]={id,topic:t.id,lv:1,t:'mc',gen:'who',q:`Who said: ${w.q}`,o:[w.a].concat(w.o).map(x=>`<span class="he">${esc(x)}</span>`),why:`<b class="he">${esc(w.a)}</b> said this. Read the start of the pasuk to see who is speaking.`,proof:w.q,look:`Look at the words before the quote: "ויאמר…" / "ויאמרו…" tells you who is speaking.`};});
 WHO[t.id].forEach(id=>{const others=WHO[t.id].filter(x=>x!==id);REG[id].alt=others.length?others[Math.floor(Math.random()*others.length)]:id;});
});
DATA.extra.realTest.forEach((r,i)=>{REG['real.'+i]={id:'real.'+i,topic:r.topic,lv:3,t:'open',q:r.q,en:r.en,model:r.model,check:r.check};});
DATA.extra.lesson.practice.forEach((q,i)=>reg('lesson.p'+i,q,'lesson',{lv:1}));
function getQ(id){return REG[id];}
function retryFor(q){
 if(q.alt&&REG[q.alt]) return q.alt;
 return q.id; // same question again, reshuffled
}

function clearMistake(id){if(S.mistakes[id]){delete S.mistakes[id];save();updHeader();}}
