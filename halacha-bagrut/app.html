<li>ט' באב ×5: מרגלים, בית ראשון, בית שני, ביתר, נחרש ההיכל</li>
<li>25 hrs · no שלום, sit low & no work till חצות</li>
<li>איכה (ירמיהו) + קינות · no tallit/tefillin until Mincha · עננו</li>
<li>י' באב till חצות · "כל המתאבל על ירושלים זוכה ורואה בשמחתה"</li></ul></section>`;

/* ======================= STATE & STORAGE ======================= */
const TABS=[["learn","Learn"],["cards","Flashcards"],["exam","Exam questions"],["mock","Mock exam"],["mistakes","Mistakes"],["cram","Cram sheet"]];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={tab:LS.get("tab","learn"),unit:LS.get("unit","brachot")};
let progress=LS.get("progress",{});   // cardId -> "known"|"missed"
let mistakes=LS.get("mistakes",[]);    // {id,unit,kind,q,mine,correct,created,resolved}
let db=null, sample=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unitById=id=>UNITS.find(u=>u.id===id)||UNITS[0];
const cardId=(u,i)=>u+":c"+i;
const stripHtml=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim()};

async function saveProgress(id,val){progress[id]=val;LS.set("progress",progress);if(db){try{await db.doc("progress/main").set({cards:progress,updated:Date.now()})}catch(e){}}}
async function addMistake(m){m.id="m"+Date.now()+Math.floor(Math.random()*1000);m.created=Date.now();m.resolved=false;
  mistakes=mistakes.filter(x=>!(x.q===m.q&&!x.resolved));mistakes.unshift(m);LS.set("mistakes",mistakes);
  if(db){try{await db.collection("mistakes").doc(m.id).set(m)}catch(e){}}}
async function resolveMistake(id,val){const m=mistakes.find(x=>x.id===id);if(!m)return;m.resolved=val;LS.set("mistakes",mistakes);
  if(db){try{await db.doc("mistakes/"+id).set(m)}catch(e){}}}

/* ======================= RENDER: CHROME ======================= */
function renderChrome(){
  const uEl=document.getElementById("units");
  uEl.innerHTML=UNITS.map(u=>`<button class="chip" data-unit="${u.id}" aria-pressed="${u.id===state.unit}">${esc(u.name)}</button>`).join("");
  uEl.hidden = ["mock","mistakes","cram"].includes(state.tab);
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${k===state.tab}">${l}${k==="mistakes"?` (${mistakes.filter(m=>!m.resolved).length})`:""}</button>`).join("");
}
document.addEventListener("click",e=>{
  const u=e.target.closest("[data-unit]");if(u){state.unit=u.dataset.unit;LS.set("unit",state.unit);cardIdx=0;render();window.scrollTo(0,0);return}
  const t=e.target.closest("[data-tab]");if(t){state.tab=t.dataset.tab;LS.set("tab",state.tab);render();window.scrollTo(0,0)}
});
function render(){renderChrome();const v=document.getElementById("view");
  ({learn:renderLearn,cards:renderCards,exam:renderExam,mock:renderMock,mistakes:renderMistakes,cram:renderCram})[state.tab](v)}

const MISSING=`<div class="banner"><b>Not in the app yet:</b> pp. 23–46 and 124–146 haven't been scanned. Send them in the chat and they'll be added.</div>`;

/* ======================= LEARN ======================= */
function renderLearn(v){const u=unitById(state.unit);
  const known=u.cards.filter((c,i)=>progress[cardId(u.id,i)]==="known").length;
  v.innerHTML=`${MISSING}
  <div><span class="pages">pp. ${u.pages}</span><h2>${esc(u.name)}</h2>
  <div class="row stat">Flashcards known: ${known}/${u.cards.length}</div><div class="meter"><span style="width:${Math.round(100*known/u.cards.length)}%"></span></div></div>
  ${u.learn.map(s=>`<section class="lesson"><h3>${esc(s.h)}</h3>${s.html}</section>`).join("")}
  <section class="lesson" id="tutor"><h3>Ask the tutor about this unit</h3>
   <p class="muted">Answers come only from the book material in this unit.</p>
   <textarea id="tutorQ" placeholder="e.g. Why don't women have to hear the shofar?"></textarea>
   <div class="row"><button class="btn" id="tutorBtn">Ask</button></div><div id="tutorA"></div></section>
  <div class="row"><button class="btn" data-tab="cards">Practice the flashcards →</button></div>`;
  const btn=document.getElementById("tutorBtn"),out=document.getElementById("tutorA");
  if(!sample){btn.disabled=true;out.innerHTML=`<p class="muted">The tutor isn't available in this view.</p>`;return}
  btn.onclick=async()=>{const q=document.getElementById("tutorQ").value.trim();if(!q)return;btn.disabled=true;out.innerHTML=`<div class="grade">Thinking...</div>`;
    const notes=u.learn.map(s=>s.h+": "+stripHtml(s.html)).join("\n");
    try{const {text}=await sample(`You are a patient tutor for an Israeli Bagrut exam in Halacha for olim (book "במעגלי הלכה – עולים"). Answer the student's question ONLY from the book notes below. If the notes don't cover it, say the book pages provided don't cover it. Give the reason ("why") when there is one. Write simple English mixed with Hebrew terms in Hebrew. Keep it under 150 words. No markdown headings.\n\nBOOK NOTES (unit: ${u.name}):\n${notes}\n\nSTUDENT QUESTION: ${q}`,{cache:false,onText:({text})=>{out.innerHTML=`<div class="grade" style="white-space:pre-wrap">${esc(text)}</div>`}});
      out.innerHTML=`<div class="grade" style="white-space:pre-wrap">${esc(text)}</div>`}
    catch(e){out.innerHTML=`<div class="grade">${e.code==="not_granted"?"The tutor needs permission to use Claude.":e.code==="rate_limited"?"Too many questions right now — try again in a minute.":"Couldn't get an answer. Try again."}</div>`}
    finally{btn.disabled=false}}
}

/* ======================= FLASHCARDS ======================= */
let cardIdx=0, cardMode="all";
function renderCards(v){const u=unitById(state.unit);
  let order=u.cards.map((c,i)=>i);
  if(cardMode==="weak")order=order.filter(i=>progress[cardId(u.id,i)]!=="known");
  const known=u.cards.filter((c,i)=>progress[cardId(u.id,i)]==="known").length;
  if(cardIdx>=order.length)cardIdx=0;
  const head=`<div><span class="pages">pp. ${u.pages}</span><h2>Flashcards · ${esc(u.name)}</h2>
   <div class="row stat">Known ${known}/${u.cards.length}</div><div class="meter"><span style="width:${Math.round(100*known/u.cards.length)}%"></span></div></div>
   <div class="row"><button class="btn ${cardMode==="all"?"":"ghost"}" id="mAll">All cards</button><button class="btn ${cardMode==="weak"?"":"ghost"}" id="mWeak">Only cards I don't know yet</button></div>`;
  if(!order.length){v.innerHTML=head+`<div class="card"><p class="q">You know every card in this unit. 🎉</p><div class="row"><button class="btn" data-tab="exam">Try the exam questions →</button></div></div>`;bindModes();return}
  const i=order[cardIdx],[q,a]=u.cards[i],st=progress[cardId(u.id,i)];
  v.innerHTML=head+`<div class="card">
   <div class="row"><span class="pill">Card ${cardIdx+1} of ${order.length}</span>${st?`<span class="pill ${st==="known"?"good":"bad"}">${st==="known"?"known":"missed before"}</span>`:""}</div>
   <div class="q" dir="auto">${esc(q)}</div>
   <textarea id="myA" placeholder="Type your answer first (optional), then reveal" dir="auto" style="min-height:70px"></textarea>
   <div class="row"><button class="btn" id="reveal">Show answer</button></div>
   <div id="ans" hidden><div class="a" dir="auto"><b>Answer:</b> ${esc(a)}</div>
    <p class="muted" style="margin-top:8px">Be honest: did you have it?</p>
    <div class="row"><button class="btn good" id="gotIt">Got it</button><button class="btn bad" id="missed">Missed it → mistakes list</button></div></div>
   <div class="row"><button class="btn ghost" id="prev">← Previous</button><button class="btn ghost" id="next">Skip →</button></div></div>`;
  bindModes();
  document.getElementById("reveal").onclick=()=>{document.getElementById("ans").hidden=false;document.getElementById("reveal").hidden=true};
  const advance=()=>{cardIdx=(cardMode==="weak")?cardIdx:(cardIdx+1);render()};
  document.getElementById("gotIt").onclick=async()=>{await saveProgress(cardId(u.id,i),"known");advance()};
  document.getElementById("missed").onclick=async()=>{await saveProgress(cardId(u.id,i),"missed");
    await addMistake({unit:u.id,kind:"flashcard",q,mine:document.getElementById("myA").value.trim(),correct:a});cardIdx++;render()};
  document.getElementById("next").onclick=()=>{cardIdx++;render()};
  document.getElementById("prev").onclick=()=>{cardIdx=Math.max(0,cardIdx-1);render()};
}
function bindModes(){document.getElementById("mAll").onclick=()=>{cardMode="all";cardIdx=0;render()};document.getElementById("mWeak").onclick=()=>{cardMode="weak";cardIdx=0;render()}}

/* ======================= EXAM QUESTIONS (AI examiner) ======================= */
function gradePrompt(u,qo,ans){
  const notes=u.learn.map(s=>s.h+": "+stripHtml(s.html)).join("\n").slice(0,12000);
  return `You are a STRICT examiner for the Israeli Bagrut exam "תורה שבעל פה – דינים ומבוא לעולים" (שאלון 005384). Grade ONLY by the book "במעגלי הלכה – עולים" — use the rubric and book notes below. If the student's answer follows another custom that differs from the book, say the book's version is what counts. Reasons ("why") earn points; vague answers lose points; list answers need the required number of items.
QUESTION (${qo.pts} points): ${qo.q}
RUBRIC FOR FULL MARKS: ${qo.rubric}
BOOK NOTES: ${notes}
STUDENT ANSWER: ${ans||"(no answer)"}
Reply with only JSON: {"score": number (0-${qo.pts}, may use .5), "verdict": "one short sentence", "good": ["what earned points"], "missing": ["what lost points — be specific"], "fullAnswer": "a model full-marks answer, concise, English with Hebrew terms"}. Feedback in simple English with Hebrew terms in Hebrew.`}
function gradeHtml(r,max){const s=Number(r.score)||0,cls=s>=max?"full":s>0?"part":"zero";
  return `<div class="grade"><div class="score ${cls}">${s} / ${max}</div><p dir="auto">${esc(r.verdict||"")}</p>
  ${(r.good||[]).length?`<p><b>Earned points:</b></p><ul>${r.good.map(x=>`<li dir="auto">${esc(x)}</li>`).join("")}</ul>`:""}
  ${(r.missing||[]).length?`<p><b>Lost points:</b></p><ul>${r.missing.map(x=>`<li dir="auto">${esc(x)}</li>`).join("")}</ul>`:""}
  <details><summary>Full-marks answer</summary><p dir="auto" style="white-space:pre-wrap">${esc(r.fullAnswer||"")}</p></details></div>`}
let qIdx=0;
function renderExam(v){const u=unitById(state.unit);if(qIdx>=u.qs.length)qIdx=0;const qo=u.qs[qIdx];
  v.innerHTML=`<div><span class="pages">pp. ${u.pages}</span><h2>Exam questions · ${esc(u.name)}</h2>
   <p class="muted">Bagrut-style. Write a full answer, then a strict examiner grades it. Anything below full marks goes to your mistakes list.</p></div>
  <div class="card"><div class="row"><span class="pill">Question ${qIdx+1} of ${u.qs.length}</span><span class="pill">${qo.pts} points</span></div>
   <div class="q" dir="auto">${esc(qo.q)}</div>
   <textarea id="ansBox" dir="auto" placeholder="Write your answer (English, Hebrew or mixed)"></textarea>
   <div class="row"><button class="btn" id="gradeBtn">Grade my answer</button><button class="btn ghost" id="showModel">Show what full marks needs</button></div>
   <div id="gradeOut"></div>
   <div class="row"><button class="btn ghost" id="qPrev">← Previous</button><button class="btn ghost" id="qNext">Next question →</button></div></div>`;
  const out=document.getElementById("gradeOut"),gb=document.getElementById("gradeBtn");
  document.getElementById("qPrev").onclick=()=>{qIdx=Math.max(0,qIdx-1);render()};
  document.getElementById("qNext").onclick=()=>{qIdx=(qIdx+1)%u.qs.length;render()};
  document.getElementById("showModel").onclick=()=>{out.innerHTML=`<div class="grade"><b>Full marks needs:</b><p dir="auto">${esc(qo.rubric)}</p>
    <p class="muted">Grade yourself:</p><div class="row"><button class="btn good" id="selfFull">I had it all</button><button class="btn bad" id="selfMiss">I missed parts → mistakes</button></div></div>`;
    document.getElementById("selfFull").onclick=()=>{out.insertAdjacentHTML("beforeend",`<p class="pill good">Nice.</p>`)};
    document.getElementById("selfMiss").onclick=async()=>{await addMistake({unit:u.id,kind:"exam",q:qo.q,mine:document.getElementById("ansBox").value.trim(),correct:qo.rubric});renderChrome();out.insertAdjacentHTML("beforeend",`<p class="pill bad">Added to mistakes.</p>`)}};
  if(!sample){gb.hidden=true;return}
  gb.onclick=async()=>{const ans=document.getElementById("ansBox").value.trim();if(!ans){out.innerHTML=`<div class="grade">Write an answer first — even a short one.</div>`;return}
    gb.disabled=true;out.innerHTML=`<div class="grade">The examiner is reading your answer...</div>`;
    try{const r=await sample.json(gradePrompt(u,qo,ans),{cache:false});out.innerHTML=gradeHtml(r,qo.pts);
      if((Number(r.score)||0)<qo.pts){await addMistake({unit:u.id,kind:"exam",q:qo.q,mine:ans,correct:(r.missing||[]).join(" · ")+" — Full answer: "+(r.fullAnswer||qo.rubric)});renderChrome()}}
    catch(e){out.innerHTML=`<div class="grade">${e.code==="not_granted"?"Grading needs permission to use Claude. Use “Show what full marks needs” instead.":e.code==="rate_limited"?"Too many requests — wait a minute and try again.":"Couldn't grade this time. Try again, or use “Show what full marks needs”."}</div>`}
    finally{gb.disabled=false}}
}

/* ======================= MOCK EXAM ======================= */
let mock=LS.get("mock",null), mockTimer=null;
function newMock(){const all=[];UNITS.forEach(u=>u.qs.forEach((q,i)=>all.push({u:u.id,i})));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  const pick=[],used=new Set();for(const x of all){if(pick.length>=9)break;const key=x.u+(pick.length<5?"A":"B");if(used.has(key))continue;used.add(key);pick.push(x)}
  mock={started:Date.now(),qs:pick.map((x,k)=>({...x,part:k<5?"A":"B",ans:"",res:null}))};LS.set("mock",mock)}
function renderMock(v){clearInterval(mockTimer);
  if(!mock){v.innerHTML=`<div><h2>Mock Bagrut exam</h2><p>Built like the real שאלון 005384: <b>1.5 hours</b>. <b>Part A</b> — answer <b>4 of 5</b> questions (18 points each). <b>Part B</b> — answer <b>2 of 4</b> (14 points each). Questions are mixed from all units.</p></div>${MISSING}<div class="row"><button class="btn" id="startMock">Start the exam</button></div>`;
    document.getElementById("startMock").onclick=()=>{newMock();render()};return}
  const qhtml=(x,k)=>{const u=unitById(x.u),qo=u.qs[x.i];return `<div class="card"><div class="row"><span class="pill">${k+1}</span><span class="pill">${esc(u.name)}</span></div>
    <div class="q" dir="auto">${esc(qo.q.replace(/\(\d+ points\)/,""))}</div>
    <textarea data-mq="${k}" dir="auto" placeholder="Leave empty if you skip this question">${esc(x.ans)}</textarea>${x.res?gradeHtml(x.res,x.part==="A"?18:14):""}</div>`};
  const graded=mock.qs.some(x=>x.res);
  v.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Mock exam</h2><span class="timer" id="timer"></span></div>
   <h3>Part A — answer 4 of 5 (18 points each)</h3>${mock.qs.filter(x=>x.part==="A").map((x)=>qhtml(x,mock.qs.indexOf(x))).join("")}
   <h3>Part B — answer 2 of 4 (14 points each)</h3>${mock.qs.filter(x=>x.part==="B").map((x)=>qhtml(x,mock.qs.indexOf(x))).join("")}
   <div id="mockOut"></div>
   <div class="row"><button class="btn" id="gradeMock" ${sample?"":"hidden"}>${graded?"Re-grade":"Hand in & grade"}</button><button class="btn ghost" id="newMock">New exam</button></div>`;
  v.querySelectorAll("[data-mq]").forEach(t=>t.addEventListener("input",()=>{mock.qs[+t.dataset.mq].ans=t.value;LS.set("mock",mock)}));
  const tick=()=>{const left=90*60-Math.floor((Date.now()-mock.started)/1000),el=document.getElementById("timer");if(!el)return;
    el.textContent=left>0?`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")} left`:"Time's up";};tick();mockTimer=setInterval(tick,1000);
  document.getElementById("newMock").onclick=()=>{mock=null;LS.set("mock",null);render()};
  showMockTotal();
  const gm=document.getElementById("gradeMock");gm.onclick=async()=>{
    const a=mock.qs.filter(x=>x.part==="A"&&x.ans.trim()),b=mock.qs.filter(x=>x.part==="B"&&x.ans.trim()),out=document.getElementById("mockOut");
    if(a.length>4||b.length>2){out.innerHTML=`<div class="banner">Like the real exam: answer only <b>4</b> in Part A and <b>2</b> in Part B. You answered ${a.length} and ${b.length}.</div>`;return}
    gm.disabled=true;
    for(const x of [...a,...b]){const u=unitById(x.u),qo=u.qs[x.i],max=x.part==="A"?18:14;
      out.innerHTML=`<div class="grade">Grading question ${mock.qs.indexOf(x)+1}...</div>`;
      try{const r=await sample.json(gradePrompt(u,{...qo,pts:max},x.ans),{cache:false});x.res=r;LS.set("mock",mock);
        if((Number(r.score)||0)<max)await addMistake({unit:u.id,kind:"mock exam",q:qo.q,mine:x.ans,correct:(r.missing||[]).join(" · ")+" — Full answer: "+(r.fullAnswer||qo.rubric)})}
      catch(e){out.innerHTML=`<div class="grade">Grading stopped (${esc(e.code)}). Try again later.</div>`;gm.disabled=false;return}}
    gm.disabled=false;render()};
}
function showMockTotal(){if(!mock||!mock.qs.some(x=>x.res))return;const tot=mock.qs.reduce((s,x)=>s+(x.res?Number(x.res.score)||0:0),0);
  document.getElementById("mockOut").innerHTML=`<div class="grade"><div class="score ${tot>=85?"full":tot>=55?"part":"zero"}">${tot} / 100</div><p>Every lost point is in your mistakes list.</p></div>`}

/* ======================= MISTAKES ======================= */
let reqIdx=0;
function renderMistakes(v){const open=mistakes.filter(m=>!m.resolved),done=mistakes.filter(m=>m.resolved);
  const item=m=>`<div class="mitem ${m.resolved?"resolved":""}"><div class="row"><span class="pill">${esc(unitById(m.unit).name)}</span><span class="pill ${m.resolved?"good":"bad"}">${esc(m.kind)}${m.resolved?" · fixed":""}</span></div>
   <p class="q" dir="auto" style="font-size:1rem;margin-top:6px">${esc(m.q)}</p>${m.mine?`<p dir="auto" class="muted">You wrote: ${esc(m.mine)}</p>`:""}
   <details><summary>Correct answer</summary><p dir="auto">${esc(m.correct)}</p></details>
   <div class="row" style="margin-top:6px"><button class="btn ghost" data-res="${m.id}" data-val="${!m.resolved}">${m.resolved?"Mark as still weak":"I know it now"}</button></div></div>`;
  v.innerHTML=`<div><h2>Mistakes list</h2><p class="muted">Everything you missed in flashcards, exam questions and mock exams. Re-quiz until it's empty.</p></div>
   ${open.length?`<div class="card" id="requiz"></div>`:`<div class="card"><p class="q">No open mistakes. Keep practicing — anything you miss lands here.</p></div>`}
   <h3>Open (${open.length})</h3><div class="mlist">${open.map(item).join("")||"<p class='muted'>None.</p>"}</div>
   ${done.length?`<h3>Fixed (${done.length})</h3><div class="mlist">${done.map(item).join("")}</div>`:""}`;
  v.querySelectorAll("[data-res]").forEach(b=>b.onclick=async()=>{await resolveMistake(b.dataset.res,b.dataset.val==="true");render()});
  if(open.length){if(reqIdx>=open.length)reqIdx=0;const m=open[reqIdx],box=document.getElementById("requiz");
    box.innerHTML=`<div class="row"><span class="pill">Re-quiz ${reqIdx+1} of ${open.length}</span></div><div class="q" dir="auto">${esc(m.q)}</div>
     <textarea id="rqA" dir="auto" style="min-height:70px" placeholder="Answer from memory"></textarea>
     <div class="row"><button class="btn" id="rqShow">Check</button></div><div id="rqAns" hidden><div class="a" dir="auto">${esc(m.correct)}</div>
     <div class="row" style="margin-top:8px"><button class="btn good" id="rqGood">Got it now</button><button class="btn bad" id="rqBad">Still weak</button></div></div>`;
    document.getElementById("rqShow").onclick=()=>{document.getElementById("rqAns").hidden=false};
    document.getElementById("rqGood").onclick=async()=>{await resolveMistake(m.id,true);render()};
    document.getElementById("rqBad").onclick=()=>{reqIdx++;render()};}
}

/* ======================= CRAM ======================= */
function renderCram(v){v.innerHTML=`<div><h2>Cram sheet</h2><p class="muted">The most-tested facts from every unit. Read it the night before and the morning of the exam.</p></div>${MISSING}<div class="cram">${CRAM}</div>`}

/* ======================= BOOT ======================= */
render();
(async()=>{
  if(!window.claude?.use)return;
  try{sample=await claude.use("sample")}catch(e){sample=null}
  try{db=await claude.use("db")}catch(e){db=null}
  if(db){try{
      const p=await db.doc("progress/main").get();if(p.exists){progress={...progress,...(p.data().cards||{})};LS.set("progress",progress)}
      const ms=await db.collection("mistakes").get();const remote=ms.docs.map(d=>d.data());
      const ids=new Set(remote.map(m=>m.id));mistakes=[...remote,...mistakes.filter(m=>!ids.has(m.id))].sort((a,b)=>b.created-a.created);LS.set("mistakes",mistakes);
    }catch(e){}}
  render();
})();
</script>
